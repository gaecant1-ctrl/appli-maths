  <!-- Style pour le canevas -->
  <style>
    /* Ajouter un box-sizing global */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;

      display: flex;

#maGrille {
  width: 250px;

 /* overflow: hidden; /* Empêche le débordement du contenu */

}

#maGrille canvas {

  height: 100%; /* Assure que le canevas prend toute la hauteur du parent */

}
    

    /* Modifier la largeur de la flyout et de la barre de défilement */
    .blocklyFlyout {
    }

    /* Bloc en cours d'exécution : contour jaune épais (Blockly ne le rend presque pas visible) */

      stroke: #ffc400;

Blockly.JavaScript.forBlock['test_equals'] = function(block) {
  var valueA = Blockly.JavaScript.valueToCode(block, 'A', Blockly.JavaScript.ORDER_EQUALITY) || '0';
  var valueB = Blockly.JavaScript.valueToCode(block, 'B', Blockly.JavaScript.ORDER_EQUALITY) || '0';
  var code = `${valueA} == ${valueB}`;
  return [code, Blockly.JavaScript.ORDER_EQUALITY];
};

// Chaque exécution a son numéro : une exécution remplacée (nouveau clic sur Exécuter)
// ou interrompue (Réinitialiser) reste bloquée dans sa pause et ne reprend jamais.
let executionId = 0;

function attendre(ms) {
    const id = executionId;
    return new Promise(resolve => {
        setTimeout(() => {
            if (!executionEnCours || id !== executionId) return;
            resolve();
        }, ms);
    });
}

// Surligne le bloc en cours : il le reste pendant son action et la pause qui suit
Blockly.JavaScript.STATEMENT_PREFIX = 'surligner(%1);\n';

function surligner(id) {
    workspace.highlightBlock(id);
}

// Définition du bloc "Si...Sinon"
Blockly.Blocks['si_sinon'] = {
  init: function() {
    this.appendValueInput("CONDITION")
        .setCheck("Boolean")
        .appendField("Si");
    this.appendStatementInput("DO")
        .setCheck(null)
        .appendField("alors");
    this.appendStatementInput("ELSE")
        .setCheck(null)
        .appendField("sinon");
    this.setPreviousStatement(true, null);

    this.setColour(210);
    this.setTooltip("Exécute une action si la condition est vraie, sinon une autre.");
    this.setHelpUrl("");
  }
};

// Génération du code JavaScript pour "Si...Sinon"
Blockly.JavaScript.forBlock['si_sinon'] = function(block) {
  var condition = Blockly.JavaScript.valueToCode(block, 'CONDITION', Blockly.JavaScript.ORDER_NONE) || 'false';
  var statements_do = Blockly.JavaScript.statementToCode(block, 'DO');
  var statements_else = Blockly.JavaScript.statementToCode(block, 'ELSE');
  var code = `if (${condition}) {\n${statements_do}} else {\n${statements_else}}\n`;
  return code;
};

// Boîtes à outils : la série « avec variable » ajoute n, mettre, ajouter, = et si/sinon
const BLOCS_SANS_VARIABLE = `
      <block type="programme"></block>
      <block type="avancer"></block>
      <block type="reculer"></block>
      <block type="tourner"></block>
      <block type="tourner_droite"></block>
      <block type="math_number"></block>
      <block type="repeter_x_fois"></block>
      <block type="lever_stylo"></block>
      <block type="baisser_stylo"></block>`;

const TOOLBOX = {
  sans: `<xml>${BLOCS_SANS_VARIABLE}</xml>`,
  avec: `<xml>${BLOCS_SANS_VARIABLE}
      <block type="n"></block>
      <block type="mettre_a"></block>
      <block type="ajouter_a"></block>
      <block type="test_equals"></block>
      <block type="si_sinon"></block>
    </xml>`
};

const workspace = Blockly.inject('blocklyDiv', {
  toolbox: TOOLBOX.sans,
  media: 'https://unpkg.com/blockly/media/'
});


let block = workspace.newBlock('programme');
block.initSvg();
block.render();
block.moveBy(50, 50); // Position du bloc

 // Fonction pour exécuter le code généré par Blockly

function attend(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
async function runCode() {
    executionId++;          // arrête une éventuelle exécution précédente
    const monId = executionId;
    workspace.highlightBlock(null);
    fermerAlerte();
    grille.effacer();
    await attend(500);
    Blockly.JavaScript.init(workspace);
    let startBlock = workspace.getTopBlocks().find(b => b.type === "programme");

    if (!startBlock) {
        alerte("Erreur : Vous devez ajouter un bloc Programme !");
        return;
    }
    workspace.getAllBlocks().forEach(block => block.unselect());
    executionEnCours=true;
    try {
        const code = Blockly.JavaScript.blockToCode(startBlock);
        console.log("Code généré :", code); // Vérifier le code généré
        if (!code) {
            console.log("Aucun code généré.");
            return;
        }
        // Création d'une fonction asynchrone dynamique
        let asyncFunction = new Function("attendre", "grille", "surligner", `
            return (async function() { 
                ${code} 
            })();
        `);

        // Exécution de la fonction avec `await`
        await asyncFunction(attendre, grille, surligner);

    } catch (e) {
        alerte("Erreur dans le code généré : " + e.message);
        console.error(e);
    } finally {
        if (monId === executionId) workspace.highlightBlock(null);
    }
}






function mettreAJourCompteur() {
    let nombreBlocs = workspace.getAllBlocks().length;
    let compteurElement = document.getElementById("nbBlocs");
    if (compteurElement.innerText != nombreBlocs) {
        compteurElement.innerText = nombreBlocs;
    }
}


    // Ajouter un bouton pour exécuter le code généré
    const button = document.getElementById("button");
    button.innerText = "Exécuter";
    button.onclick = runCode;


    // Ajouter la fonctionnalité de réinitialisation
    const resetButton = document.getElementById("resetButton");
resetButton.onclick = function () {
    executionEnCours=false;
    executionId++;
    workspace.highlightBlock(null);
    fermerAlerte();
    grille.effacer(); 
    //workspace.clear(); // Efface tous les blocs
    mettreAJourCompteur(); // Remet à jour le compteur après effacement
};


function alerte(t) {
    let container = document.getElementById("messageContainer");
    let label = document.getElementById("messageAlerte");

    label.innerText = t;
    container.classList.remove("hidden"); // Supprime la classe cachée
    container.classList.add("visible"); // Ajoute la classe pour afficher

    // Change la couleur de la bordure et du fond selon le message
    if (t.toLowerCase().includes("erreur")) {
        container.style.borderColor = "red";
        container.style.backgroundColor = "#ffcccc";
        label.style.color = "black";
    } else if (t.toLowerCase().includes("réussie") || t.toLowerCase().includes("réussi")) {
        container.style.borderColor = "green";
        container.style.backgroundColor = "#ccffcc";
        label.style.color = "black";
    }
    else if (t.toLowerCase().includes("échec") || t.toLowerCase().includes("réussi")) {
        container.style.borderColor = "red";
        container.style.backgroundColor = "#ffcccc";
        label.style.color = "black";
    } else {
        container.style.borderColor = "blue";
        container.style.backgroundColor = "#cce5ff";
        label.style.color = "black";
    }
}


function fermerAlerte() {
    let container = document.getElementById("messageContainer");
    container.classList.remove("visible"); // Retire la classe visible
    container.classList.add("hidden"); // Ajoute la classe cachée
}

</script>
<script src="grille.js"></script>
<script>
const grille = new Grille("maGrille");
let executionEnCours=false;

function nbTotChange(n){
    document.getElementById("nbBlocksTot").innerText=n;
}
    
    
// Exercices par série : départ (x, y en px, angle), nombre de blocs visé, tracé modèle
const EXERCICES = {
  sans: [
    { // carré
      blocs: 6, x: 100, y: 200, angle: 0,
      trace() {
        for (let i = 0; i < 4; i++) { this.avancer(5); this.tourner(90); }
      }
    },
    { // escalier
      blocs: 9, x: 40, y: 240, angle: 0,
      trace() {
        for (let i = 0; i < 4; i++) {
          this.avancer(3); this.tourner(90); this.avancer(2); this.tourner(-90);
        }
      }
    },
    { // croix
      blocs: 8, x: 140, y: 140, angle: 0,
      trace() {
        for (let i = 0; i < 4; i++) {
          this.avancer(5);
          this.leverStylo();   // pas de retracé : les pointillés restent nets
          this.avancer(-5);
          this.baisserStylo();
          this.tourner(90);
        }
      }
    },
    { // pointillés horizontaux
      blocs: 9, x: 60, y: 140, angle: 0,
      trace() {
        for (let i = 0; i < 3; i++) {
          this.avancer(2); this.leverStylo(); this.avancer(1); this.baisserStylo();
        }
      }
    },
    { // pointillés verticaux (tourner avant la boucle)
      blocs: 10, x: 140, y: 240, angle: 0,
      trace() {
        this.tourner(90);
        for (let i = 0; i < 3; i++) {
          this.avancer(2); this.leverStylo(); this.avancer(1); this.baisserStylo();
        }
      }
    },
    { // pointillés en équerre (tourner en fin de boucle)
      blocs: 10, x: 120, y: 180, angle: 0,
      trace() {
        for (let i = 0; i < 3; i++) {
          this.avancer(2); this.leverStylo(); this.avancer(1); this.baisserStylo();
          this.tourner(90);
        }
      }
    }
  ],
  avec: [
    { // carrés emboîtés
      blocs: 14, x: 80, y: 240, angle: 0,
      trace() {
        let n = 4;
        for (let j = 0; j < 5; j++) {
          for (let i = 0; i < 4; i++) { this.avancer(n); this.tourner(90); }
          n = n + 1;
        }
      }
    },
    { // carrés séparés, stylo levé
      blocs: 18, x: 120, y: 40, angle: -90,
      trace() {
        let n = 2;
        for (let j = 0; j < 3; j++) {
          for (let i = 0; i < 4; i++) { this.avancer(n); this.tourner(90); }
          this.leverStylo(); this.avancer(n + 1); this.baisserStylo();
          n = n + 1;
        }
      }
    },
    { // triangles en rosace
      blocs: 15, x: 120, y: 120, angle: 0,
      trace() {
        let n = 2;
        for (let j = 0; j < 6; j++) {
          for (let i = 0; i < 3; i++) { this.avancer(n); this.tourner(120); }
          this.tourner(60);
          n = n + 1;
        }
      }
    },
    { // carrés alternés 1 / 2
      blocs: 23, x: 20, y: 180, angle: 0,
      trace() {
        let n = 1;
        for (let j = 0; j < 9; j++) {
          for (let i = 0; i < 4; i++) { this.avancer(n); this.tourner(90); }
          this.avancer(n);
          if (n == 1) { n = 2; } else { n = 1; }
        }
      }
    }
  ]
};

let serie = "sans";
const exoInput = document.getElementById("exoInput");

function changerExercice() {
    const liste = EXERCICES[serie];
    let numero = parseInt(exoInput.value) || 1;
    numero = Math.min(Math.max(numero, 1), liste.length);
    exoInput.value = numero;
    const exo = liste[numero - 1];

    grille.effacer();
    nbTotChange(exo.blocs);
    grille.setPosition(exo.x, exo.y);
    grille.setOrientation(exo.angle);
    grille.tracerFantome(exo.trace);
}

function changerSerie(nouvelleSerie, numero = 1) {
    serie = nouvelleSerie;
    document.querySelectorAll("#serieChoix button").forEach(b =>
        b.classList.toggle("actif", b.dataset.serie === serie));
    workspace.updateToolbox(TOOLBOX[serie]);
    exoInput.max = EXERCICES[serie].length;
    exoInput.value = numero;
    changerExercice();
}

document.querySelectorAll("#serieChoix button").forEach(b =>
    b.onclick = () => { if (b.dataset.serie !== serie) changerSerie(b.dataset.serie); });


// Ouvrir dans un nouvel onglet en transmettant la série, l'exercice et les blocs posés
const CLE_TRANSFERT = "turtleBlockly_transfert";

document.getElementById("newTabButton").onclick = function () {
    try {
        localStorage.setItem(CLE_TRANSFERT, JSON.stringify(
            Blockly.serialization.workspaces.save(workspace)));
    } catch (e) {}
    const url = new URL(window.location.href);
    url.searchParams.set("serie", serie);
    url.searchParams.set("exo", exoInput.value);
    window.open(url.toString(), "_blank");
};

const params = new URLSearchParams(window.location.search);
if (params.get("exo")) {
    try {
        const etat = localStorage.getItem(CLE_TRANSFERT);
        if (etat) {
            localStorage.removeItem(CLE_TRANSFERT);
            Blockly.serialization.workspaces.load(JSON.parse(etat), workspace);
        }
    } catch (e) {}
}
changerSerie(params.get("serie") === "avec" ? "avec" : "sans", params.get("exo") || 1);


workspace.addChangeListener(mettreAJourCompteur);
document.getElementById("exoInput").addEventListener("change", changerExercice);
</script>
