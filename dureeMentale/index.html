<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durée mentale</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#d8dee9;
  --accent:#2f6fde; --accent-soft:#e6eefc; --ok:#1f9d55; --ok-bg:#e2f6e9; --ko:#d64545; --ko-bg:#fde7e7;
  --shadow:0 2px 8px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{font-size:1.3rem;margin:0}
.grow{flex:1}
.prog{font-weight:600;color:var(--muted)}
.score{font-weight:700;color:var(--ok);margin-left:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}

/* Accueil */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 18px;text-align:left;box-shadow:var(--shadow)}
.mode:not(:disabled):hover{border-color:var(--accent)}
.mode b{display:block;font-size:1.5rem;margin-bottom:6px}
.mode span{color:var(--muted)}
.info{margin-top:18px;color:var(--muted);text-align:center}
.info.warn{color:var(--ko);font-weight:600}
@media (max-width:640px){.modes{grid-template-columns:1fr;gap:12px;margin-top:12px}.mode{padding:16px}}
/* QR code de l'accueil (pour ouvrir l'appli sur un téléphone) ; inutile sur le téléphone lui-même */
.qr{margin:20px auto 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;box-shadow:var(--shadow)}
.qr svg{display:block;width:170px;height:170px}
.qr span{color:var(--muted);font-size:.95rem}
#qrOv{cursor:zoom-out}
#qrOv .qr-grand{background:#fff;border-radius:20px;padding:20px}
#qrOv svg{display:block;width:min(80vmin,720px);height:min(80vmin,720px)}
@media (max-width:640px),(pointer:coarse) and (max-height:500px){.qr{display:none}} /* téléphone, en portrait ou en paysage */

/* Question */
.calc{font-weight:700;text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.8em;line-height:1.05;margin:0 .08em}
.frac>span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:12px 0}
.big{font-size:clamp(2.4rem,10vw,7rem)}
.mid{font-size:clamp(2.2rem,9vw,4.5rem)}
.num{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:6px 18px;font-size:clamp(1.2rem,3vw,2rem)}
.bar{width:min(700px,100%);height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:100%}
.hint{color:var(--muted);font-size:1.15rem;text-align:center}
.inc{color:var(--accent)}

/* Correction flash : 2 colonnes */
.corr{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:10px 20px;margin-top:12px}
.cell{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 16px;font-size:clamp(1rem,2.6vw,1.8rem);box-shadow:var(--shadow)}
.cell .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.75em}
.cell .r{color:var(--accent);font-weight:800}
@media (max-width:640px){.corr{gap:8px}.cell{padding:6px;gap:6px}}

/* QCM */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%)}
.choice{min-height:72px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:clamp(1.25rem,5vw,1.9rem);font-weight:700;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;padding:6px 8px}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.choice:disabled{cursor:default}
.fb{min-height:1.6em;font-size:1.3rem;font-weight:700;text-align:center}
.fb.ok{color:var(--ok)} .fb.ko{color:var(--ko)}
.next-row{width:min(640px,100%);display:flex;justify-content:flex-end;min-height:48px}

/* Résultats */
.res{width:min(720px,100%);margin:12px auto 0;display:flex;flex-direction:column;gap:12px}
.filigrane{position:fixed;inset:0;display:grid;place-items:center;font-size:min(70vw,70vh);line-height:1;opacity:.22;pointer-events:none;z-index:0}
.res .err{background:rgba(255,255,255,.55)}
.res .err .fig{background:rgba(255,255,255,.6)}
.res>*:not(.filigrane){position:relative;z-index:1}
.res h2{text-align:center;font-size:clamp(2rem,8vw,3rem);margin:8px 0}
.err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:1.25rem}
.err.bon{border-left:6px solid var(--ok)}
.err.rate{border-left:6px solid var(--ko);background:rgba(255,240,240,.6)}
.err .marque{font-weight:900;font-size:1.3em;width:1.2em;text-align:center}
.err.bon .marque{color:var(--ok)} .err.rate .marque{color:var(--ko)}
.err .r{color:var(--ok);font-weight:800}
.err .y{color:var(--ko);font-size:1rem}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

/* Paramètres */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px 18px 20px}
.sheet-head{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--card);padding:6px 0}
.sheet h2{margin:0;flex:1}
.sheet h3{margin:16px 0 8px;font-size:1rem;color:var(--muted)}
.type{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.type.off{opacity:.4}
.type input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.type .l{flex:1}
.type .ex{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:64px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* Intégrée dans une page : on force le nouvel onglet */
#voileOnglet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;z-index:50;text-align:center}
#voileOnglet .titre{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:700;margin:0}
#voileOnglet a{display:flex;align-items:center;justify-content:center;gap:.4em;width:min(900px,100%);min-height:min(45vh,320px);padding:24px;border-radius:28px;background:var(--accent);color:#fff;text-decoration:none;font-size:clamp(2rem,7vw,4.5rem);font-weight:800;line-height:1.15;box-shadow:0 8px 24px rgba(47,111,222,.35)}
@media (max-width:640px){.overlay{padding:0}.sheet{border-radius:0;height:100%;width:100%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="hTitle">Durée mentale</h1>
    <span id="hProg" class="prog hidden"></span><span id="hScore" class="score hidden"></span>
    <span class="grow"></span>
    <button class="btn hidden" id="bPause">⏸ Pause</button>
    <button class="btn" id="bParams">⚙ Paramètres</button>
    <button class="btn hidden" id="bHome">↩ Accueil</button>
  </header>

  <main>
    <section class="screen" id="sHome">
      <div class="modes">
        <button class="mode" data-mode="flash"><b>Flash</b><span>Durées projetées, correction à la fin</span></button>
        <button class="mode" data-mode="qcm"><b>QCM</b><span>Choisis parmi 4 réponses</span></button>
      </div>
      <p class="info" id="homeInfo"></p>
      <button type="button" class="qr hidden" id="qrBox" title="Agrandir"><div id="qrImg"></div><span>Sur ton téléphone : scanne-moi</span></button>
    </section>

    <section class="screen hidden" id="sFlash">
      <div class="stage" id="flIntro">
        <div class="mid calc" id="flIntroTxt"></div>
        <p class="hint">Écris la réponse sur ta feuille.</p>
        <button class="btn primary" id="flStart" style="font-size:1.4rem;padding:14px 32px">Démarrer</button>
      </div>
      <div class="stage hidden" id="flRun">
        <span class="num" id="flNum"></span>
        <div class="big calc" id="flCalc"></div>
        <div class="bar"><div id="flBar"></div></div>
      </div>
      <div class="stage hidden" id="flEnd">
        <div class="mid calc">Terminé !</div>
        <button class="btn primary" id="flShow" style="font-size:1.3rem;padding:14px 28px">Voir la correction</button>
      </div>
      <div class="hidden" id="flCorr">
        <div class="corr" id="flGrid"></div>
        <div class="actions"><button class="btn primary" id="flAgain">Nouvelle série</button></div>
      </div>
    </section>

    <section class="screen hidden" id="sQcm">
      <div class="stage">
        <div class="big calc" id="qCalc"></div>
        <div class="bar" id="qBarWrap"><div id="qBar"></div></div>
        <div class="choices" id="qChoices"></div>
        <div class="fb" id="qFb"></div>
        <div class="next-row"><button class="btn primary hidden" id="qNext">Suivant →</button></div>
      </div>
    </section>

    <section class="screen hidden" id="sRes">
      <div class="res">
        <div class="filigrane" id="rEmoji" aria-hidden="true"></div>
        <h2 id="rScore"></h2>
        <div id="rList"></div>
        <div class="actions"><button class="btn primary" id="rAgain">Rejouer</button></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay hidden" id="ov">
  <div class="sheet">
    <div class="sheet-head"><h2>Paramètres</h2><button class="btn primary" id="ovClose">OK</button></div>
    <h3>Écritures décimales (0,25 h ; 1,5 h…)</h3>
    <div class="seg" id="decSeg"></div>
    <h3>Types de questions</h3>
    <div id="typeList"></div>
    <h3>Nombre de questions</h3>
    <div class="seg" id="nbSeg"></div>
    <h3>Flash : durée par question</h3>
    <div class="seg" id="durSeg"></div>
    <h3>QCM : durée par question</h3>
    <div class="seg" id="qDurSeg"></div>
  </div>
</div>
<div class="overlay hidden" id="qrOv"><div class="qr-grand" id="qrBig"></div></div>

<script>
/* ================= Outils ================= */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pgcd = (a, b) => b ? pgcd(b, a % b) : a;
const $ = id => document.getElementById(id);
const texte = h => h.replace(/<[^>]+>/g, '');

/* ================= Écriture des durées =================
   Toujours « 1 h + 45 min » (jamais « 1h45 ») ; fractions avec une vraie barre. */
const frac = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const fh = (n, d) => `${frac(n, d)} h`;                                   // ¾ h
const dec = x => String(Math.round(x * 100) / 100).replace('.', ',');      // 1,5
const hm = t => {                                                          // minutes → « 1 h + 45 min »
  const h = Math.floor(t / 60), m = t % 60;
  if (!h) return `${m} min`;
  return m ? `${h} h + ${m} min` : `${h} h`;
};
// une fraction irréductible n/d d'heure qui tombe juste en minutes (d diviseur de 60)
function fractionHeure(dens, impropre) {
  const d = pick(dens);
  let n;
  do { n = impropre ? R(1, 3) * d + R(1, d - 1) : R(1, d - 1); } while (pgcd(n, d) !== 1);
  return { n, d, min: n * 60 / d };
}

/* ================= Générateurs =================
   { q : question (html), a : réponse (html), w : erreurs typiques (html), à valeurs différentes de la réponse } */
function genFracSimple() {               // ¾ h = 45 min
  const { n, d, min } = fractionHeure([2, 3, 4, 5, 6, 10, 12], false);
  return { q: fh(n, d), a: hm(min), w: [...(d < 10 ? [`${n}${d} min`] : []), `${60 / d} min`, `${Math.round(n * 100 / d)} min`, `${n * 10} min`, hm(min + 5), hm(min - 5)] };
}
function genFracImpropre() {             // 7/4 h = 1 h + 45 min
  const { n, d, min } = fractionHeure([2, 3, 4, 5, 6, 10], true), q = Math.floor(n / d), r = n % d;
  return { q: fh(n, d), a: hm(min), w: [`${n} h + ${d} min`, `${q} h + ${r} min`, `${q} h + ${Math.round(r * 100 / d)} min`, hm(min + 60), `${q} h + ${r * 10} min`] };
}
function genDecimal() {                  // 0,25 h = 15 min ; 1,5 h = 1 h + 30 min
  const d = pick([2, 4, 5, 10]);
  let n; do { n = R(1, d - 1); } while (pgcd(n, d) !== 1);
  const k = R(0, 2), x = k + n / d, min = k * 60 + n * 60 / d;
  const chiffres = dec(n / d).split(',')[1];                               // « 25 » pour 0,25
  return {
    q: `${dec(x)} h`, a: hm(min),
    w: [k ? `${k} h + ${chiffres} min` : `${chiffres} min`, k ? `${k} h + ${chiffres.padEnd(2, '0')} min` : `${chiffres.padEnd(2, '0')} min`,
        hm(min + 10), hm(Math.round(k * 60 + n * 100 / d)), hm(min - 5), hm(min + 20), hm(min * 2)],
  };
}
function genVersFraction() {             // 45 min = ¾ h
  const { n, d, min } = fractionHeure([2, 3, 4, 5, 6, 10, 12], false);
  return { q: `${min} min`, a: fh(n, d), w: [`0,${min} h`, fh(min, 100), fh(d, n), `${dec(min / 10)} h`, fh(n, d + 1)] };
}
function genVersHMin() {                 // 105 min = 1 h + 45 min
  const t = R(13, 46) * 5, h = Math.floor(t / 60), m = t % 60;
  if (!m) return genVersHMin();
  return { q: `${t} min`, a: hm(t), w: [...(t >= 100 ? [`${Math.floor(t / 100)} h + ${t % 100} min`] : []), `${h + 1} h + ${m} min`, hm(t + 10), hm(t - 10), `${h} h + ${60 - m} min`] };
}

function genVersDecimal() {             // 1 h + 15 min = 1,25 h
  const d = pick([2, 4, 5, 10]);
  let n; do { n = R(1, d - 1); } while (pgcd(n, d) !== 1);
  const k = R(0, 2), x = k + n / d, t = k * 60 + n * 60 / d, m = t % 60;
  return { q: hm(t), a: `${dec(x)} h`, w: [`${k},${String(m).padStart(2, '0')} h`, `${dec(t / 100)} h`, `${dec(x + 0.25)} h`, `${dec(k + n / 10)} h`, `${dec(x + 1)} h`] };
}

const TYPES = [
  { id: 'fracSimple',   label: 'Fraction d’heure → minutes',   ex: fh(3, 4) + ' = 45 min',         on: true,  gen: genFracSimple },
  { id: 'fracImpropre', label: 'Fraction d’heure → h + min',   ex: fh(7, 4) + ' = 1 h + 45 min',   on: true,  gen: genFracImpropre },
  { id: 'decimal',      label: 'Heure décimale → h + min',     ex: '1,5 h = 1 h + 30 min',         on: false, gen: genDecimal, decimal: true },
  { id: 'versFraction', label: 'Minutes → fraction d’heure',   ex: '45 min = ' + fh(3, 4),         on: true,  gen: genVersFraction },
  { id: 'versHMin',     label: 'Minutes → h + min',            ex: '105 min = 1 h + 45 min',       on: true,  gen: genVersHMin },
  { id: 'versDecimal',  label: 'h + min → heure décimale',     ex: '1 h + 15 min = 1,25 h',        on: false, gen: genVersDecimal, decimal: true },
];

/* ================= Paramètres ================= */
const KEY = 'dureeMentale6e';
const NOMBRES = [5, 10, 15, 20], DUREES_FLASH = [10, 15, 20, 30], DUREES_QCM = [0, 10, 15, 20, 30];
const settings = { types: Object.fromEntries(TYPES.map(t => [t.id, t.on])), nb: 10, duree: 15, qcmDuree: 0, decimal: 0 };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) {
    Object.assign(settings.types, s.types || {});
    if (NOMBRES.includes(s.nb)) settings.nb = s.nb;
    if (DUREES_FLASH.includes(s.duree)) settings.duree = s.duree;
    if (DUREES_QCM.includes(s.qcmDuree)) settings.qcmDuree = s.qcmDuree;
    if ([0, 1].includes(s.decimal)) settings.decimal = s.decimal;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };
// sans écritures décimales : les types décimaux sont exclus (et les leurres décimaux aussi, voir choices)
const activeTypes = () => TYPES.filter(t => settings.types[t.id] && (settings.decimal || !t.decimal));
const seg = (id, valeurs, cle, txt) => {
  $(id).innerHTML = valeurs.map(v => `<button class="btn ${v === settings[cle] ? 'on' : ''}" data-v="${v}">${txt(v)}</button>`).join('');
};
function renderSettings() {
  $('typeList').innerHTML = TYPES.map(t =>
    `<label class="type ${t.decimal && !settings.decimal ? 'off' : ''}"><input type="checkbox" data-id="${t.id}" ${settings.types[t.id] ? 'checked' : ''} ${t.decimal && !settings.decimal ? 'disabled' : ''}>
     <span class="l">${t.label}</span><span class="ex">${t.ex}</span></label>`).join('');
  seg('decSeg', [1, 0], 'decimal', v => v ? 'Oui' : 'Non');
  seg('nbSeg', NOMBRES, 'nb', v => v);
  seg('durSeg', DUREES_FLASH, 'duree', v => v + ' s');
  seg('qDurSeg', DUREES_QCM, 'qcmDuree', v => v ? v + ' s' : 'Sans');
}
const majParams = () => { save(); renderSettings(); renderHome(); };
$('typeList').addEventListener('change', e => { settings.types[e.target.dataset.id] = e.target.checked; save(); renderHome(); });
[['decSeg', 'decimal'], ['nbSeg', 'nb'], ['durSeg', 'duree'], ['qDurSeg', 'qcmDuree']].forEach(([id, cle]) =>
  $(id).addEventListener('click', e => { const v = e.target.dataset.v; if (v != null) { settings[cle] = +v; majParams(); } }));
$('bParams').onclick = () => { renderSettings(); $('ov').classList.remove('hidden'); };
$('ovClose').onclick = () => $('ov').classList.add('hidden');
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') $('ov').classList.add('hidden'); });

/* ================= Série ================= */
function makeSeries() {
  const types = activeTypes(), out = [], vus = new Set();
  let bag = [], garde = 0;
  while (out.length < settings.nb && garde++ < 2000) {
    if (!bag.length) bag = shuffle(types.slice());
    const c = bag.pop().gen();
    if (vus.has(c.q)) continue;
    vus.add(c.q); out.push(c);
  }
  return out;
}
// 4 réponses : la bonne + 3 erreurs typiques distinctes (jamais égales à la bonne réponse)
function choices(c) {
  const vus = new Set([texte(c.a)]), faux = [];
  shuffle(c.w.slice()).forEach(x => {
    const t = texte(x);
    if (faux.length < 3 && !vus.has(t) && !/-|NaN|Infinity/.test(t) && (settings.decimal || !t.includes(','))) { vus.add(t); faux.push(x); }
  });
  return shuffle([{ h: c.a, ok: true }, ...faux.map(h => ({ h, ok: false }))]);
}

/* ================= Navigation ================= */
const SCREENS = ['sHome', 'sFlash', 'sQcm', 'sRes'];
let mode = null, series = [], idx = 0, score = 0, errors = [];
const N = () => series.length;
function show(id) {
  SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id));
  const home = id === 'sHome';
  $('hTitle').classList.toggle('hidden', !home && id !== 'sRes');
  $('bParams').classList.toggle('hidden', !home);
  $('bHome').classList.toggle('hidden', home);
  $('hProg').classList.toggle('hidden', home || id === 'sRes');
  $('hScore').classList.toggle('hidden', id !== 'sQcm');
  $('bPause').classList.add('hidden');
}
function renderHome() {
  const n = activeTypes().length;
  document.querySelectorAll('.mode').forEach(b => b.disabled = n === 0);
  const info = $('homeInfo');
  info.classList.toggle('warn', n === 0);
  info.textContent = n === 0 ? 'Coche au moins un type de question dans ⚙ Paramètres.'
    : `${settings.nb} questions · ${settings.decimal ? 'avec' : 'sans'} décimaux · Flash : ${settings.duree} s · QCM : ${settings.qcmDuree ? settings.qcmDuree + ' s' : 'sans temps'}`;
}
function goHome() { stopTimer(); clearTimeout(nextTO); show('sHome'); renderHome(); }
$('bHome').onclick = goHome;
document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.mode));
function start(m) {
  mode = m; series = makeSeries(); idx = 0; score = 0; errors = [];
  if (m === 'flash') flashIntro(); else { show('sQcm'); qcmShow(); }
}
function setProg() { $('hProg').textContent = `Question ${idx + 1} / ${N()}`; $('hScore').textContent = `✓ ${score}`; }
const question = c => `${c.q} = <span class="inc">?</span>`;

/* Minuteur commun */
let timer = null, remain = 0, total = 0, last = 0, paused = false, timerBar = null, timerEnd = null;
function runTimer(sec, barId, onEnd) {
  stopTimer();
  total = remain = sec * 1000; paused = false; timerBar = $(barId); timerEnd = onEnd;
  timerBar.style.width = '100%'; last = performance.now();
  timer = setInterval(() => {
    const now = performance.now();
    if (!paused) remain -= now - last;
    last = now;
    timerBar.style.width = Math.max(0, remain / total * 100) + '%';
    if (remain <= 0) { stopTimer(); timerEnd(); }
  }, 50);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }

/* ================= Flash (vidéoprojeté) ================= */
function flashPart(p) { ['flIntro', 'flRun', 'flEnd', 'flCorr'].forEach(id => $(id).classList.toggle('hidden', id !== p)); }
function flashIntro() {
  show('sFlash'); flashPart('flIntro');
  $('hProg').textContent = 'Flash';
  $('flIntroTxt').textContent = `${N()} questions · ${settings.duree} s`;
}
$('flStart').onclick = () => { idx = 0; flashPart('flRun'); $('bPause').classList.remove('hidden'); flashShow(); };
function flashShow() {
  setProg();
  $('flNum').textContent = `n° ${idx + 1}`;
  $('flCalc').innerHTML = question(series[idx]);
  $('bPause').textContent = '⏸ Pause';
  runTimer(settings.duree, 'flBar', () => {
    if (++idx < N()) flashShow();
    else { flashPart('flEnd'); $('bPause').classList.add('hidden'); $('hProg').textContent = 'Flash'; }
  });
}
$('bPause').onclick = () => { paused = !paused; $('bPause').textContent = paused ? '▶ Reprendre' : '⏸ Pause'; };
$('flShow').onclick = () => {
  const lignes = Math.ceil(N() / 2);
  $('flGrid').style.gridTemplateRows = `repeat(${lignes}, auto)`;
  $('flGrid').innerHTML = series.map((c, i) =>
    `<div class="cell"><span class="n">${i + 1}</span><span class="calc">${c.q} = <span class="r">${c.a}</span></span></div>`).join('');
  $('hProg').textContent = 'Correction';
  flashPart('flCorr');
};
$('flAgain').onclick = () => start('flash');

/* ================= QCM ================= */
let answered = false, nextTO = null;
function qcmShow() {
  const c = series[idx];
  c.choix = c.choix || choices(c);
  answered = false; setProg();
  $('qCalc').innerHTML = question(c);
  $('qFb').textContent = ''; $('qFb').className = 'fb';
  $('qNext').classList.add('hidden');
  $('qChoices').innerHTML = c.choix.map((x, i) => `<button class="choice" data-i="${i}">${x.h}</button>`).join('');
  $('qBarWrap').classList.toggle('hidden', !settings.qcmDuree);
  if (settings.qcmDuree) runTimer(settings.qcmDuree, 'qBar', () => qcmAnswer(null));
}
function qcmAnswer(b) {
  if (answered) return;
  answered = true; stopTimer();
  const c = series[idx], ok = b && c.choix[b.dataset.i].ok;
  $('qChoices').querySelectorAll('.choice').forEach(x => { x.disabled = true; if (c.choix[x.dataset.i].ok) x.classList.add('ok'); });
  if (ok) { score++; $('qFb').textContent = 'Bravo !'; $('qFb').className = 'fb ok'; setProg(); nextTO = setTimeout(next, 900); }
  else {
    if (b) b.classList.add('ko');
    errors.push({ c, y: b ? c.choix[b.dataset.i].h : null });
    $('qFb').textContent = b ? 'Non.' : 'Temps écoulé !'; $('qFb').className = 'fb ko';
    $('qNext').classList.remove('hidden'); $('qNext').focus();
  }
}
$('qChoices').addEventListener('click', e => { const b = e.target.closest('.choice'); if (b) qcmAnswer(b); });
$('qNext').onclick = next;
function next() {
  clearTimeout(nextTO);
  if (++idx < N()) { qcmShow(); return; }
  show('sRes');
  $('rScore').textContent = `${score} / ${N()}`;
  // gros emoji en filigrane selon le score
  const taux = score / N();
  $('rEmoji').textContent = taux === 1 ? '🏆' : taux >= .8 ? '😃' : taux >= .5 ? '🙂' : '💪';
  // toute la série : ✓ pour les réussites, ✗ avec la réponse donnée pour les erreurs
  $('rList').innerHTML = series.map(c => {
    const e = errors.find(x => x.c === c);
    return `<div class="err ${e ? 'rate' : 'bon'}"><span class="marque">${e ? '✗' : '✓'}</span><span class="calc">${c.q} = <span class="r">${c.a}</span></span>`
      + (e ? `<span class="y">${e.y == null ? 'Temps écoulé' : 'Ta réponse : ' + e.y}</span>` : '') + '</div>';
  }).join('');
}
$('rAgain').onclick = () => start(mode);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('ov').classList.add('hidden'); $('qrOv').classList.add('hidden'); } });

/* ================= Nouvel onglet ================= */
function forcerNouvelOnglet() {
  let integree;
  try { integree = window.self !== window.top; } catch (e) { integree = true; }
  if (!integree) return;
  const voile = document.createElement('div');
  voile.id = 'voileOnglet';
  voile.innerHTML = `<p class="titre">Durée mentale</p><a href="${location.href}" target="_blank" rel="noopener">↗ Ouvrir l’appli</a>`;
  document.body.appendChild(voile);
}
/* ================= QR code de l'accueil =================
   Adresse de la page (sans paramètres), dessinée en SVG ; clic = plein écran pour la projection. */
function installerQr() {
  // déjà sur un téléphone (portrait ou paysage) : pas de QR code
  const telephone = (navigator.userAgentData && navigator.userAgentData.mobile) || /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent);
  if (telephone || !/^https?:$/.test(location.protocol) || typeof qrcode !== 'function') return;
  const qr = qrcode(0, 'M');
  qr.addData(location.origin + location.pathname);
  qr.make();
  const n = qr.getModuleCount(), m = 2;
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m},${y + m}h1v1h-1z`;
  const svg = `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code de l'appli"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  $('qrImg').innerHTML = svg; $('qrBig').innerHTML = svg;
  $('qrBox').classList.remove('hidden');
  $('qrBox').onclick = () => $('qrOv').classList.remove('hidden');
  $('qrOv').onclick = () => $('qrOv').classList.add('hidden');
}

installerQr();
goHome();
forcerNouvelOnglet();
</script>
</body>
