<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>À l'ombre</title>
<style>
:root{--bg:#f4f1ea;--ink:#222;--accent:#2b6cb0;--light:#e89a00;--shadow:#1d2b4a;--mark:#6a3fc0;--ok:#1f8a3a;--err:#d22;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--accent);padding:8px 14px;font-size:16px;font-weight:600;cursor:pointer}
.seg button+button{border-left:2px solid var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
main{flex:1;display:flex;gap:10px;padding:0 12px 12px;min-height:0}
#wrap{flex:1;position:relative;background:#fff;border-radius:12px;box-shadow:0 1px 4px #0002;min-width:0;min-height:300px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
aside{width:190px;display:flex;flex-direction:column;gap:8px}
.consigne{font-weight:700;font-size:17px;padding:4px 2px}
.btn{border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:10px;padding:9px 10px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.btn.on{background:var(--accent);color:#fff}
.btn.big{background:var(--ok);border-color:var(--ok);color:#fff;text-align:center;font-size:18px}
.btn.grey{border-color:#888;color:#555}
.spacer{flex:1}
.solids{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;border-bottom:1px solid #ccc}
.solids .btn{padding:6px 9px;font-size:15px}
#msg{min-height:48px;font-weight:700;font-size:17px;padding:4px 2px}
#msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
.hide{display:none!important}
@media (max-width:720px){
  main{flex-direction:column}
  #wrap{min-height:60vh}
  aside{width:auto;flex-direction:row;flex-wrap:wrap}
  .spacer{display:none}
  .consigne,#msg{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="seg" id="scenes">
    <button data-s="lampe" class="on">Lampe</button>
    <button data-s="soleil">Soleil</button>
  </div>
  <div class="seg" id="modes">
    <button data-m="explore" class="on">Explorer</button>
    <button data-m="practice">S'entraîner</button>
  </div>
</header>
<main>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside>
    <div class="consigne" id="consigne"></div>
    <!-- Explorer -->
    <div class="ex solids" id="solids"></div>
    <button class="btn on ex" id="bBeam">Faisceau</button>
    <button class="btn ex" id="bRays">Rayons limites</button>
    <button class="btn on ex" id="bShadow">Ombre</button>
    <!-- S'entraîner -->
    <button class="btn pr tool" data-t="rayon" id="tRayon">Rayon</button>
    <button class="btn pr tool" data-t="droite" id="tDroite">Droite</button>
    <button class="btn pr tool" data-t="para" id="tPara">Parallèle</button>
    <button class="btn pr tool on" data-t="colorier">Colorier</button>
    <button class="btn pr tool" data-t="gomme">Gomme</button>
    <button class="btn pr grey" id="bClear">Tout effacer</button>
    <div class="spacer"></div>
    <div id="msg"></div>
    <button class="btn pr grey" id="bSol">Voir l'ombre</button>
    <button class="btn pr big" id="bValider">Valider</button>
  </aside>
</main>
<script>
"use strict";
// ---------- géométrie ----------
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,s)=>V(a.x*s,a.y*s);
const dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x, len=a=>Math.hypot(a.x,a.y);
const norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l);};

function poly(arr,opt={}){
  const pts=arr.map(([x,y])=>V(x,y)), n=pts.length;
  let A=0; for(let i=0;i<n;i++) A+=cross(pts[i],pts[(i+1)%n]);
  const ccw=A>0;
  const edges=pts.map((a,i)=>{const b=pts[(i+1)%n], e=sub(b,a);
    return {a,b,n:norm(ccw?V(e.y,-e.x):V(-e.y,e.x)),ground:a.y===0&&b.y===0};});
  return Object.assign({pts,edges},opt);
}
function segX(p1,p2,p3,p4){
  const d1=cross(sub(p4,p3),sub(p1,p3)), d2=cross(sub(p4,p3),sub(p2,p3));
  const d3=cross(sub(p2,p1),sub(p3,p1)), d4=cross(sub(p2,p1),sub(p4,p1));
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
function inside(p,pl){
  let c=false; const P=pl.pts;
  for(let i=0,j=P.length-1;i<P.length;j=i++){
    const a=P[i],b=P[j];
    if((a.y>p.y)!==(b.y>p.y) && p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) c=!c;
  }
  return c;
}

// ---------- scènes (coordonnées de source.tex, sol en y = 0) ----------
const SC={
  lampe:{
    view:{x0:-1.8,x1:19.2,y0:-1.4,y1:12.4},
    light:'point', S0:V(6,11),
    obstacles:[poly([[1,0],[4,0],[4,2],[1,2]],{name:'Pavé 1'}),poly([[7,0],[9,0],[9,5],[7,5]],{name:'Pavé 2'}),poly([[11,0],[14,0],[14,3],[11,3]],{name:'Pavé 3'})],
    consigne:"Colorie l'ombre des pavés.",
    hint:"Déplace la lampe.",
    demoDef:{name:'Maison',x:9,pts:[[0,0],[3,0],[3,2.5],[1.5,4],[0,2.5]]}
  },
  soleil:{
    view:{x0:-4,x1:22.7,y0:-1.1,y1:15.8},
    light:'sun', d0:norm(V(1,-1)),
    obstacles:[poly([[0,0],[2,0],[2,6],[0,6]],{name:'Pilier'}),poly([[5,0],[8,8],[10,4],[16,4],[17,0]],{name:'Sphinx',sphinx:true,other:true})],
    given:[17,20],
    consigne:"Colorie l'ombre du pilier.",
    hint:"Fais glisser pour tourner les rayons.",
    demoDef:{name:'Sapin',x:9,pts:[[-0.3,0],[0.3,0],[0.3,1.5],[1.8,1.5],[0,6],[-1.8,1.5],[-0.3,1.5]]}
  }
};
const STEP=0.05;

for(const k in SC){
  const sc=SC[k];
  sc.S=sc.S0?{...sc.S0}:null; sc.d=sc.d0?{...sc.d0}:null;   // lumière en mode Explorer
  // au départ : le solide de démonstration seul, avec faisceau, rayons limites et ombre
  makeDemo(sc,sc.demoDef.x); sc.demo.off=false;
  for(const o of sc.obstacles) o.off=true;
  sc.showBeam=true; sc.showRays=true; sc.showShadow=true;
  sc.lines=[]; sc.pending=null; sc.validated=false; sc.showSol=false;
  sc.surfaces=buildSurfaces(sc);
  if(sc.given) for(const s of sc.surfaces) if(s.isGround)
    for(let i=0;i<s.N;i++){const x=s.P[i].x; if(x>=sc.given[0]&&x<=sc.given[1]){s.lock[i]=1;s.mark[i]=1;}}
}

function buildSurfaces(sc){
  const out=[], bases=[];
  for(const o of sc.obstacles) for(const e of o.edges) if(e.ground) bases.push([Math.min(e.a.x,e.b.x),Math.max(e.a.x,e.b.x)]);
  bases.sort((a,b)=>a[0]-b[0]);
  let x=sc.view.x0;
  const mk=(a,b,n,isGround)=>{
    const L=len(sub(b,a)), N=Math.max(2,Math.round(L/STEP)), P=[];
    for(let i=0;i<N;i++) P.push(add(a,mul(sub(b,a),(i+0.5)/N)));
    out.push({a,b,n,L,N,P,isGround,mark:new Uint8Array(N),lock:new Uint8Array(N),truth:new Uint8Array(N),target:new Uint8Array(N),back:new Uint8Array(N),ign:new Uint8Array(N)});
  };
  for(const [u,v] of bases){ if(u>x) mk(V(x,0),V(u,0),V(0,1),true); x=Math.max(x,v); }
  if(x<sc.view.x1) mk(V(x,0),V(sc.view.x1,0),V(0,1),true);
  for(const o of sc.obstacles) for(const e of o.edges) if(!e.ground) mk(e.a,e.b,e.n,false);
  return out;
}

// solides présents : en Explorer, on peut en retirer ; en S'entraîner, tous sont là
// solide de démonstration (Explorer seulement), déplaçable le long du sol
function makeDemo(sc,x){
  const off=sc.demo?sc.demo.off:true;
  sc.demoDef.x=x; sc.demo=poly(sc.demoDef.pts.map(([a,b])=>[a+x,b]),{name:sc.demoDef.name,demo:true,off});
}
const allSolids=sc=>mode==='practice'?sc.obstacles:[sc.demo,...sc.obstacles];
const act=sc=>mode==='practice'?sc.obstacles:allSolids(sc).filter(o=>!o.off);
// lumière active : Explorer = déplaçable ; S'entraîner = celle de la fiche
function lightOf(sc){
  return mode==='practice' ? {S:sc.S0, d:sc.d0} : {S:sc.S, d:sc.d};
}
// 0 : éclairé ; sinon bit 1 = caché par un objet « cible », bit 2 = caché par un autre objet
function occluded(sc,Q,L){
  let r=0;
  for(const o of act(sc)) for(const e of o.edges)
    if(!e.ground && segX(Q,L,e.a,e.b)){ r|= o.other?2:1; break; }
  return r;
}
function computeTruth(sc){
  const {S,d}=lightOf(sc);
  for(const s of sc.surfaces){
    for(let i=0;i<s.N;i++){
      const P=s.P[i], toL = sc.light==='point'?sub(S,P):mul(d,-1);
      const back = dot(s.n,toL)<=1e-9 || (sc.light==='point' && toL.y>=0);   // cache au-dessus de la lampe
      let oc=0;
      if(!back){ const Q=add(P,mul(s.n,1e-4)); const L=sc.light==='point'?S:add(Q,mul(d,-1000)); oc=occluded(sc,Q,L); }
      s.truth[i]=(back||oc)?1:0; s.target[i]=(oc&1)?1:0; s.back[i]=(back||(oc&2))?1:0;
    }
  }
}
function computeIgnore(sc,tol){
  for(const s of sc.surfaces){
    const w=Math.ceil(tol/(s.L/s.N));
    for(let i=0;i<s.N;i++){
      let ig = s.back[i] || i<w || i>=s.N-w;
      if(!ig) for(let j=Math.max(0,i-w);j<=Math.min(s.N-1,i+w);j++) if(s.target[j]!==s.target[i]||s.back[j]){ig=true;break;}
      s.ign[i]=ig?1:0;
    }
  }
}

// premier obstacle (ou sol) touché par P0 + t·dir, t dans ]tmin, tmax[
function firstHit(sc,P0,dir,tmin,tmax){
  let best=tmax;
  for(const o of act(sc)) for(const e of o.edges){
    if(e.ground) continue;
    const ab=sub(e.b,e.a), den=cross(dir,ab);
    if(Math.abs(den)<1e-12) continue;
    const ap=sub(e.a,P0), t=cross(ap,ab)/den, u=cross(ap,dir)/den;
    if(u>=0&&u<=1&&t>tmin&&t<best) best=t;
  }
  if(dir.y<0){const t=-P0.y/dir.y; if(t>tmin&&t<best) best=t;}
  return best;
}
// découpe d'une droite P0 + t·dir dans le rectangle de la vue au-dessus du sol
function clipLine(sc,P0,dir,t0=-1e9,t1=1e9){
  const v=sc.view, b=[[ -dir.x, P0.x-v.x0],[dir.x, v.x1-P0.x],[-dir.y, P0.y-0],[dir.y, v.y1-P0.y]];
  for(const [p,q] of b){
    if(Math.abs(p)<1e-12){ if(q<0) return null; continue; }
    const r=q/p; if(p<0){ if(r>t0) t0=r; } else { if(r<t1) t1=r; }
  }
  return t0<t1?[t0,t1]:null;
}

// ---------- état & DOM ----------
let cur='lampe', mode='explore', tool='colorier';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
const msg=document.getElementById('msg');

let W=0,H=0,DPR=1,k=1,ox=0,oy=0, hover=null, drag=null, painting=null;

function layout(){
  const r=wrap.getBoundingClientRect(); DPR=window.devicePixelRatio||1;
  W=r.width; H=r.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const v=SC[cur].view; k=Math.min(W/(v.x1-v.x0),H/(v.y1-v.y0));
  ox=(W-(v.x1-v.x0)*k)/2; oy=(H-(v.y1-v.y0)*k)/2;
}
const X=x=>ox+(x-SC[cur].view.x0)*k, Y=y=>oy+(SC[cur].view.y1-y)*k;
const toScr=p=>V(X(p.x),Y(p.y));
const toW=(sx,sy)=>V(SC[cur].view.x0+(sx-ox)/k, SC[cur].view.y1-(sy-oy)/k);
const brushW=()=>10/k;

function sunCenter(sc){return V((sc.view.x0+sc.view.x1)/2,0);}

function refreshUI(){
  const sc=SC[cur], pr=mode==='practice';
  document.querySelectorAll('#scenes button').forEach(b=>b.classList.toggle('on',b.dataset.s===cur));
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  document.querySelectorAll('.ex').forEach(b=>b.classList.toggle('hide',pr));
  document.querySelectorAll('.pr').forEach(b=>b.classList.toggle('hide',!pr));
  document.getElementById('tRayon').classList.toggle('hide',!pr||sc.light!=='point');
  document.getElementById('tDroite').classList.toggle('hide',!pr||sc.light!=='sun');
  document.getElementById('tPara').classList.toggle('hide',!pr||sc.light!=='sun');
  if(pr && ((tool==='rayon'&&sc.light!=='point')||((tool==='droite'||tool==='para')&&sc.light!=='sun'))) tool='colorier';
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));
  document.getElementById('bBeam').classList.toggle('on',SC[cur].showBeam);
  document.getElementById('bRays').classList.toggle('on',SC[cur].showRays);
  document.getElementById('bShadow').classList.toggle('on',SC[cur].showShadow);
  document.getElementById('bSol').classList.toggle('on',sc.showSol);
  const box=document.getElementById('solids'); box.innerHTML='';
  for(const o of allSolids(sc)){
    const b=document.createElement('button'); b.className='btn'+(o.off?'':' on'); b.textContent=o.name;
    b.onclick=()=>{ if(o.off && sc.light==='point' && inside(sc.S,o)) return; o.off=!o.off;
      // un solide de l'exercice ajouté : la démonstration disparaît, on ne garde que le faisceau
      if(!o.off && !o.demo){ sc.demo.off=true; sc.showBeam=true; sc.showRays=false; sc.showShadow=false; }
      refreshUI();}; box.appendChild(b);
  }
  document.getElementById('consigne').textContent = pr?sc.consigne:(sc.demo.off?sc.hint:(sc.light==='point'?'Déplace la lampe ou la maison.':sc.hint+' Déplace le sapin.'));
  const showMsg=pr&&sc.validated; msg.textContent=showMsg?sc.msg[0]:''; msg.className=showMsg?sc.msg[1]:'';
  computeTruth(sc); layout(); draw();
}

// ---------- dessin ----------
function drawZone(sc){
  const {S,d}=lightOf(sc);
  const off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height;
  const o=off.getContext('2d'); o.setTransform(DPR,0,0,DPR,0,0); o.fillStyle='#000';
  for(const pl of act(sc)) for(const e of pl.edges){
    const far=p=>sc.light==='point'?add(p,mul(sub(p,S),300)):add(p,mul(d,300));
    const q=[e.a,e.b,far(e.b),far(e.a)].map(toScr);
    o.beginPath(); o.moveTo(q[0].x,q[0].y); for(let i=1;i<4;i++) o.lineTo(q[i].x,q[i].y); o.closePath(); o.fill();
  }
  ctx.save(); ctx.beginPath(); ctx.rect(X(sc.view.x0),Y(sc.view.y1),(sc.view.x1-sc.view.x0)*k,Y(0)-Y(sc.view.y1)); ctx.clip();
  ctx.globalAlpha=0.22; ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(off,0,0); ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function runs(s,pred,cb){
  let i=0; while(i<s.N){ if(!pred(i)){i++;continue;} let j=i; while(j<s.N&&pred(j)) j++;
    const A=add(s.a,mul(sub(s.b,s.a),i/s.N)), B=add(s.a,mul(sub(s.b,s.a),j/s.N)); cb(A,B); i=j; }
}
function strokeOn(s,A,B,off){
  const nx=s.n.x*off, ny=-s.n.y*off, a=toScr(A), b=toScr(B);
  ctx.beginPath(); ctx.moveTo(a.x+nx,a.y+ny); ctx.lineTo(b.x+nx,b.y+ny); ctx.stroke();
}
function drawSurfaceRuns(sc,pred,color,width,off,dash){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='butt'; if(dash) ctx.setLineDash(dash);
  for(const s of sc.surfaces) runs(s,i=>pred(s,i),(A,B)=>strokeOn(s,A,B,off));
  ctx.restore();
}
function drawLamp(p,labelled){
  const s=toScr(p);
  const g=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,28); g.addColorStop(0,'rgba(255,200,40,.75)'); g.addColorStop(1,'rgba(255,200,40,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(s.x-28,s.y); ctx.arc(s.x,s.y,28,Math.PI,0,true); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffcc22'; ctx.strokeStyle='#8a5a00'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,7,0,7); ctx.fill(); ctx.stroke();
  // cache en demi-cercle : la lumière ne part pas vers le haut
  ctx.fillStyle='#444'; ctx.beginPath(); ctx.moveTo(s.x-17,s.y); ctx.arc(s.x,s.y,17,Math.PI,0); ctx.closePath(); ctx.fill();
  if(labelled){ctx.fillStyle='#333'; ctx.font='15px system-ui,sans-serif'; ctx.textBaseline='middle'; ctx.fillText('Source lumineuse',s.x+22,s.y-14);}
}
function drawCriticalRays(sc){
  const {S,d}=lightOf(sc);
  ctx.save(); ctx.strokeStyle='rgba(232,154,0,.9)'; ctx.lineWidth=1.6;
  for(const pl of act(sc)) for(const Vx of pl.pts){
    if(Vx.y<=0) continue;
    let P0,dir,tV;
    if(sc.light==='point'){if(Vx.y>=S.y) continue; P0=S;dir=sub(Vx,S);tV=1;}
    else{dir=d; if(d.y>=0) continue; tV=(sc.view.y1-Vx.y)/(-d.y); P0=sub(Vx,mul(d,tV));}
    let tEnd=firstHit(sc,P0,dir,1e-6,tV*(1-1e-6));
    if(tEnd>=tV*(1-1e-6)){
      const into=act(sc).some(q=>inside(add(Vx,mul(norm(dir),1e-3)),q));
      tEnd = into ? tV : firstHit(sc,P0,dir,tV*(1+1e-6),1e6);
      const cl=clipLine(sc,P0,dir,0,tEnd); if(cl) tEnd=Math.min(tEnd,cl[1]);
    }
    const a=toScr(P0), b=toScr(add(P0,mul(dir,tEnd)));
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.restore();
}
// faisceau : rayons régulièrement répartis, arrêtés par le premier obstacle ou le sol
function drawBeam(sc){
  const {S,d}=lightOf(sc);
  ctx.save(); ctx.strokeStyle=sc.light==='sun'?'rgba(232,154,0,.75)':'rgba(232,154,0,.45)'; ctx.lineWidth=1;
  const ray=(P0,dir,tmin)=>{
    const cl=clipLine(sc,P0,dir,tmin,1e9); if(!cl) return;
    const t1=Math.min(cl[1],firstHit(sc,P0,dir,Math.max(tmin,cl[0]),1e9));
    const a=toScr(add(P0,mul(dir,Math.max(tmin,cl[0])))), b=toScr(add(P0,mul(dir,t1)));
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  };
  if(sc.light==='point'){
    const n=72;
    for(let i=0;i<n;i++){const a=Math.PI+(i+0.5)*Math.PI/n; ray(S,V(Math.cos(a),Math.sin(a)),1e-6);}
  } else {
    const c=sunCenter(sc), nn=V(-d.y,d.x), P=sub(c,mul(d,200));
    for(let s=-60;s<=60;s+=0.7) ray(add(P,mul(nn,s)),d,0);
  }
  ctx.restore();
}
function lineSeg(sc,ln){
  if(ln.k==='ray'){
    const dir=sub(ln.t,sc.S0); const cl=clipLine(sc,sc.S0,dir,0,1e9); if(!cl) return null;
    return [sc.S0,add(sc.S0,mul(dir,cl[1]))];
  }
  const cl=clipLine(sc,ln.p,ln.d); if(!cl) return null;
  return [add(ln.p,mul(ln.d,cl[0])),add(ln.p,mul(ln.d,cl[1]))];
}
function drawStudentLines(sc){
  for(const ln of sc.lines){
    const sg=lineSeg(sc,ln); if(!sg) continue;
    const a=toScr(sg[0]), b=toScr(sg[1]);
    ctx.strokeStyle= ln===sc.pending ? '#e05a00' : '#2b6cb0'; ctx.lineWidth= ln===sc.pending?3:1.8;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  if(sc.pending && sc.pending.x!==undefined){const p=toScr(sc.pending); ctx.fillStyle='#e05a00'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill();}
}
function draw(){
  const sc=SC[cur], pr=mode==='practice';
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const showSh = pr ? sc.showSol : sc.showShadow;
  if(showSh) drawZone(sc);
  // sol
  ctx.strokeStyle='#222'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X(sc.view.x0),Y(0)); ctx.lineTo(X(sc.view.x1),Y(0)); ctx.stroke();
  // obstacles
  for(const pl of allSolids(sc)){
    if(!pr && pl.off) continue;
    ctx.beginPath(); pl.pts.forEach((p,i)=>{const s=toScr(p); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);}); ctx.closePath();
    ctx.fillStyle=pl.demo?'#d6c49a':pl.sphinx?'#cfcfcf':'#b8b8b8'; ctx.fill();
    ctx.strokeStyle=pl.sphinx?'#404040':'#111'; ctx.lineWidth=pl.sphinx?2.5:1.5; ctx.stroke();
    if(pl.sphinx && img.complete && img.naturalWidth){
      const c=toScr(V(11,2)), w=4.286*k, h=w*img.naturalHeight/img.naturalWidth;
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(Math.PI/2); ctx.globalCompositeOperation='multiply';
      ctx.drawImage(img,-w/2,-h/2,w,h); ctx.restore();
    }
  }
  if(!pr && SC[cur].showBeam) drawBeam(sc);
  if(!pr && SC[cur].showRays) drawCriticalRays(sc);
  if(pr){
    drawStudentLines(sc);
    if(sc.validated){
      drawSurfaceRuns(sc,(s,i)=>s.mark[i]&&(s.ign[i]||s.lock[i]),'#6a3fc0',6,3);
      drawSurfaceRuns(sc,(s,i)=>s.mark[i]&&!s.ign[i]&&!s.lock[i]&&s.target[i],'#1f8a3a',6,3);
      drawSurfaceRuns(sc,(s,i)=>s.mark[i]&&!s.ign[i]&&!s.target[i],'#d22',6,3);
      drawSurfaceRuns(sc,(s,i)=>!s.mark[i]&&!s.ign[i]&&s.target[i],'#d22',4,3,[6,5]);
    } else drawSurfaceRuns(sc,(s,i)=>s.mark[i]&&!s.lock[i],'#6a3fc0',6,3);
    if(sc.given){ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(X(sc.given[0]),Y(0)+3);ctx.lineTo(X(sc.given[1]),Y(0)+3);ctx.stroke();}
  }
  // lumière
  if(sc.light==='point') drawLamp(pr?sc.S0:sc.S,true);
  if(hover){const p=toScr(hover); ctx.strokeStyle='#e05a00'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,7); ctx.stroke();}
  if(painting||tool==='colorier'||tool==='gomme'){} // curseur géré par CSS
}

// ---------- interactions ----------
function snaps(sc){
  const out=[];
  for(const pl of sc.obstacles) out.push(...pl.pts);
  if(sc.given) out.push(V(sc.given[0],0),V(sc.given[1],0));
  for(const ln of sc.lines){const sg=lineSeg(sc,ln); if(sg) for(const p of sg) if(Math.abs(p.y)<1e-6) out.push(p);}
  return out;
}
function snap(sc,p){
  let best=null,bd=14/k;
  for(const q of snaps(sc)){const d=len(sub(q,p)); if(d<bd){bd=d;best=q;}}
  return best;
}
function distSeg(p,a,b){const ab=sub(b,a); let t=dot(sub(p,a),ab)/(dot(ab,ab)||1); t=Math.max(0,Math.min(1,t)); return len(sub(p,add(a,mul(ab,t))));}
function nearestLine(sc,p){
  let best=null,bd=12/k;
  for(const ln of sc.lines){const sg=lineSeg(sc,ln); if(!sg) continue; const d=distSeg(p,sg[0],sg[1]); if(d<bd){bd=d;best=ln;}}
  return best;
}
function paint(sc,a,b,val){
  const r=brushW(); let changed=false;
  for(const s of sc.surfaces) for(let i=0;i<s.N;i++){
    if(s.lock[i]||s.mark[i]===val) continue;
    if(distSeg(s.P[i],a,b)<r){s.mark[i]=val;changed=true;}
  }
  if(changed) unvalidate(sc);
}
function unvalidate(sc){ if(sc.validated){sc.validated=false; msg.textContent=''; msg.className='';} }
function evPos(e){const r=cv.getBoundingClientRect(); return toW(e.clientX-r.left,e.clientY-r.top);}
function clampSun(sc,p){
  let d=norm(sub(sunCenter(sc),p)); const minS=Math.sin(8*Math.PI/180);
  if(d.y>-minS){ d=V(Math.sign(d.x||1)*Math.cos(Math.asin(minS)),-minS); }
  sc.d=d;
}
function moveLamp(sc,p){
  const v=sc.view;
  const q=V(Math.max(v.x0+0.3,Math.min(v.x1-0.3,p.x)),Math.max(0.6,Math.min(v.y1-0.3,p.y)));
  if(act(sc).some(o=>inside(q,o))) return;
  sc.S=q;
}

cv.addEventListener('pointerdown',e=>{
  const sc=SC[cur], p=evPos(e); cv.setPointerCapture(e.pointerId);
  if(mode==='explore'){
    if(sc.light==='point' && len(sub(p,sc.S))<26/k) drag='lamp';
    else if(!sc.demo.off && inside(p,sc.demo)) drag={demo:p.x-sc.demoDef.x};
    else if(sc.light==='sun'){drag='sun'; clampSun(sc,p); computeTruth(sc); draw();}
    else if(sc.light==='point'){drag='lamp'; moveLamp(sc,p); computeTruth(sc); draw();}
    return;
  }
  if(tool==='colorier'||tool==='gomme'){
    if(tool==='gomme'){const ln=nearestLine(sc,p); if(ln){sc.lines.splice(sc.lines.indexOf(ln),1); if(sc.pending===ln) sc.pending=null; draw(); return;}}
    painting={last:p,val:tool==='colorier'?1:0}; paint(sc,p,p,painting.val); draw(); return;
  }
  const q=snap(sc,p)||p;
  if(tool==='rayon'){ if(len(sub(q,sc.S0))>0.2){sc.lines.push({k:'ray',t:q});} }
  else if(tool==='droite'){
    if(sc.pending && sc.pending.x!==undefined){ if(len(sub(q,sc.pending))>0.2) sc.lines.push({k:'line',p:sc.pending,d:norm(sub(q,sc.pending))}); sc.pending=null; }
    else sc.pending=q;
  } else if(tool==='para'){
    if(sc.pending && sc.pending.k){ sc.lines.push({k:'line',p:q,d:sc.pending.d}); sc.pending=null; }
    else { sc.pending=nearestLine(sc,p); }
  }
  draw();
});
cv.addEventListener('pointermove',e=>{
  const sc=SC[cur], p=evPos(e);
  if(drag==='lamp'){moveLamp(sc,p); computeTruth(sc); draw(); return;}
  if(drag&&drag.demo!==undefined){
    const old=sc.demoDef.x, v=sc.view, x=Math.max(v.x0+2,Math.min(v.x1-3,p.x-drag.demo));
    makeDemo(sc,x); if(sc.light==='point'&&inside(sc.S,sc.demo)) makeDemo(sc,old);
    computeTruth(sc); draw(); return;
  }
  if(drag==='sun'){clampSun(sc,p); computeTruth(sc); draw(); return;}
  if(painting){paint(sc,painting.last,p,painting.val); painting.last=p; draw(); return;}
  if(mode==='practice' && (tool==='rayon'||tool==='droite'||(tool==='para'&&sc.pending&&sc.pending.k))){
    const h=snap(sc,p); if(h!==hover){hover=h; draw();}
  } else if(hover){hover=null; draw();}
  if(mode==='explore'){
    const over = (sc.light==='point'&&len(sub(p,sc.S))<26/k)||(!sc.demo.off&&inside(p,sc.demo))||sc.light==='sun';
    cv.style.cursor= over?'grab':'default';
  } else cv.style.cursor= (tool==='colorier'||tool==='gomme')?'cell':'crosshair';
});
const endPtr=()=>{drag=null;painting=null;};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);

// ---------- boutons ----------
document.querySelectorAll('#scenes button').forEach(b=>b.onclick=()=>{cur=b.dataset.s; hover=null; refreshUI();});
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m; hover=null; refreshUI();});
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.t; SC[cur].pending=null; hover=null; refreshUI();});
document.getElementById('bBeam').onclick=()=>{SC[cur].showBeam=!SC[cur].showBeam; refreshUI();};
document.getElementById('bRays').onclick=()=>{SC[cur].showRays=!SC[cur].showRays; refreshUI();};
document.getElementById('bShadow').onclick=()=>{SC[cur].showShadow=!SC[cur].showShadow; refreshUI();};
document.getElementById('bSol').onclick=()=>{const sc=SC[cur]; sc.showSol=!sc.showSol; refreshUI();};
document.getElementById('bClear').onclick=()=>{
  const sc=SC[cur]; sc.lines=[]; sc.pending=null;
  for(const s of sc.surfaces) for(let i=0;i<s.N;i++) if(!s.lock[i]) s.mark[i]=0;
  unvalidate(sc); draw();
};
document.getElementById('bValider').onclick=()=>{
  const sc=SC[cur]; computeTruth(sc); computeIgnore(sc,Math.max(0.3,brushW()+0.12));
  let miss=0,extra=0;
  for(const s of sc.surfaces) for(let i=0;i<s.N;i++){
    if(s.ign[i]) continue;
    if(s.target[i]&&!s.mark[i]) miss++;
    if(!s.target[i]&&s.mark[i]) extra++;
  }
  sc.validated=true;
  sc.msg = (!miss&&!extra) ? ['Bravo !','ok'] : [(miss&&extra)?'Erreurs en rouge.':miss?"Il manque de l'ombre.":"Trop d'ombre.",'err'];
  msg.textContent=sc.msg[0]; msg.className=sc.msg[1];
  draw();
};

new ResizeObserver(()=>{layout();draw();}).observe(wrap);
refreshUI();
</script>
</body>
