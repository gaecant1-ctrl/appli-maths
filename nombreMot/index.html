<!DOCTYPE html>

</head>
<body>

  <!-- Conteneur du quiz -->
  <div id="app"></div>

  <!-- Scripts de ton projet -->
  <script src="Utils.js"></script>
  <script src="Nombre.js"></script>
  <script src="Grandeur.js"></script>
  <script src="Expression.js"></script>
  <script src="Somme.js"></script>
  <script src="Produit.js"></script>
  <script src="ObjetString.js"></script>

  <script src="Enonce.js"></script>
    <script src="Animation.js"></script>
  <script src="AnimationFinale.js"></script>

  <script>
  
window.addEventListener('load', () => {
//const niv = new Niveau({ levels:{ facile:'Facile', moyen:'Moyen', difficile:'Difficile' }, defaultKey:'moyen' });

 const SEED_BASE = "quiz-NombreMot-2025";

function buildEuclide(zone, index) {
  const opts={
  //seed: makeSeed(SEED_BASE, key, "euclide", index), 
   sharedOptions: { affichageAvecLettre: "" } // <--- seed stable
  };

  const inst = new EnonceNombreMot(opts);
  return inst.buildExercise(zone, index);
}


const quiz = new Quiz({
  mount: '#app',
  nbQuestions: 5,
  buildExercise: buildEuclide,
  texts: {
    ready: "Nombres en mots",
    readyContent: `
      <p style="font-size:1.2em; line-height:1.5; margin:20px 0; text-align:center;">
        On vous donne un nombre en <strong>mots-composés</strong>,<br>
        vous devez l'écrire comme une <em>expression mathématique</em><br>
        utilisant chacun des <strong>nombres mots-simples</strong>.
      </p>
    `
  }
});


  // Monter le sélecteur de niveau dans le slot du quiz
  //niv.renderInto(quiz.getLevelSlot());

  // Afficher l'écran d'accueil
  quiz.start();
});

  </script>
  
</body>
