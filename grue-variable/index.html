<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La grue avec variable</title>
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
<script src="https://unpkg.com/blockly/msg/fr.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e8;
    --panel:#fffdf8;
    --ink:#1f2430;
    --muted:#6b6f7a;
    --border:#d9d2c3;
    --accent:#2f5fd0;
    --sais:#e6eefc;   --sais-b:#9db6ec;
    --regle:#fdf0d8;  --regle-b:#e5b865;
    --donc:#e3f4e8;   --donc-b:#86c79a;
    --ok:#1f8a4c;     --ok-bg:#e3f4e8;
    --ko:#c0392b;     --ko-bg:#fbe6e3;
  }
  *{box-sizing:border-box;}
  html{font-size:18px;}
  body{
    margin:0;height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
    padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  header h1{font-size:1.1rem;margin:0;margin-right:auto;}
  nav{display:flex;gap:6px;flex-wrap:wrap;}
  button{font:inherit;cursor:pointer;}
  .tab{
    border:1px solid var(--border);background:var(--bg);color:var(--ink);
    padding:4px 11px;border-radius:999px;font-size:.8rem;
  }
  .tab.actif{background:var(--accent);border-color:var(--accent);color:#fff;}
  .onglet{border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:.85rem;}
  .onglet:hover{border-color:var(--accent);}

  /* L'appli tient dans la fenêtre : le chantier se met à l'échelle, Blockly prend le reste */
  main{
    flex:1;min-height:0;width:100%;
    display:grid;grid-template-columns:minmax(0,1fr) 375px;gap:14px;padding:14px;
  }
  .scene{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;min-height:0;}
  .entete{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .entete h2{margin:0;font-size:1.3rem;}
  .points{display:flex;gap:6px;}
  .point{
    width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
    background:var(--bg);font-size:.75rem;color:var(--muted);padding:0;
  }
  .point.fait{background:var(--ok);border-color:var(--ok);color:#fff;}
  .point.courant{border-color:var(--accent);color:var(--accent);font-weight:700;}
  .consigne{margin:0 0 10px;font-weight:600;font-size:1.05rem;}

  .plateau{flex:1;min-height:0;display:flex;gap:16px;}
  .gauche{flex:none;display:flex;flex-direction:column;min-height:0;max-width:42%;}
  #chantier{flex:1;min-height:120px;position:relative;}

  /* Chantier : la grue vue de côté */
  .chantier{position:absolute;left:0;top:0;transform-origin:0 0;background:linear-gradient(#eaf2fb,#f7f3ea);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .rail{position:absolute;left:0;right:0;top:10px;height:8px;background:#5b6270;border-radius:2px;}
  .guide{position:absolute;border-left:1px dashed #d6d0c2;border-right:1px dashed #d6d0c2;background:rgba(255,255,255,.35);}
  .sol{position:absolute;left:0;right:0;height:8px;background:#8a7a5c;}
  .num-pile{position:absolute;text-align:center;font-size:.85rem;font-weight:700;color:var(--muted);}
  .chariot{position:absolute;top:4px;width:40px;height:20px;background:#f2b705;border:2px solid #b58500;border-radius:5px;z-index:3;transition:left .3s ease;}
  .cable{position:absolute;top:24px;width:2px;background:#39404c;z-index:2;transition:left .3s ease,height .25s ease;}
  .pince{position:absolute;width:48px;height:14px;z-index:4;transition:left .3s ease,top .25s ease;}
  .pince svg{width:100%;height:100%;display:block;}
  .caisse{
    position:absolute;border-radius:5px;z-index:1;
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),inset 0 -8px 0 rgba(0,0,0,.08);
    transition:left .3s ease,top .25s ease;
  }
  .caisse{display:flex;align-items:center;justify-content:center;}
  .etiquette{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;}
  .etiquette{font-weight:800;color:var(--ink);}
  .boum{position:absolute;font-size:1.8rem;z-index:6;transform:translate(-50%,-50%);}
  .fixe *{transition:none !important;}
  /* La variable c, affichée au-dessus du chantier */
  .var-zone{text-align:center;margin-bottom:8px;}
  .var-zone.cachee{display:none;}
  .variable{display:inline-block;padding:3px 12px;border-radius:999px;background:#ff8c1a;color:#fff;font-weight:700;font-size:1rem;transition:transform .2s;}
  .variable.change{transform:scale(1.25);}
  .marque{position:absolute;text-align:center;font-size:20px;line-height:1;}

  /* Modèle et résultats en petit */
  .sous-titre{font-weight:600;color:var(--muted);margin:10px 0 4px;font-size:.95rem;}
  .mini{display:inline-flex;gap:4px;align-items:flex-end;padding:6px 6px 0;background:#fff;border:1px solid var(--border);border-radius:8px;}
  .mini .col{display:flex;flex-direction:column-reverse;align-items:center;border-bottom:3px solid #8a7a5c;}
  .mini .c{border-radius:3px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);margin-top:2px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .mini .n{font-size:.65rem;color:var(--muted);text-align:center;}

  /* Programme : Blockly */
  .programme{flex:1;min-width:300px;display:flex;flex-direction:column;}
  #blockly{flex:1;min-height:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  /* Pas d'ascenseurs : on se déplace en glissant le fond ou avec la molette */
  #blockly .blocklyScrollbarHorizontal,#blockly .blocklyScrollbarVertical{display:none;}
  .colonne{scrollbar-width:none;}
  .colonne::-webkit-scrollbar{display:none;}
  .blocklyHighlighted > .blocklyPath{stroke:#ffc400 !important;stroke-width:5px !important;filter:drop-shadow(0 0 6px #ffc400);}

  .prediction{margin-top:10px;display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap;}
  .slot{
    min-width:60px;min-height:42px;border-radius:10px;border:2px dashed var(--accent);background:#fff;color:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-size:1rem;
  }
  .slot.rempli{border-style:solid;color:var(--ink);}
  .slot.survol{background:#dde7ff;transform:scale(1.06);}
  .rappel{animation:secoue .4s ease;}
  @keyframes secoue{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .palette{display:flex;gap:6px;flex-wrap:wrap;}
  .propositions{margin-top:10px;padding-top:6px;border-top:1px dashed var(--border);}
  /* Réponse possible : le dessin reste en place, on glisse seulement l'étiquette (A, B, C) */
  .option{border:1px solid var(--border);background:#fff;border-radius:10px;padding:5px 4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .option .mini{border:none;padding:0;gap:2px;}
  .piece{
    border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:2px 14px;font-size:1rem;font-weight:700;
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .piece:hover{background:#dde7ff;}
  .fantome{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.2);}

  /* Colonne de droite */
  .colonne{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;}
  aside{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;}
  aside h3{margin:0 0 10px;font-size:1rem;}
  .boutons{display:flex;flex-direction:column;gap:8px;}
  .suite{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:1.05rem;font-weight:600;width:100%;
  }
  .suite:disabled{background:var(--border);color:var(--muted);cursor:default;}
  .second{width:100%;background:none;border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--ink);font-size:.95rem;}
  .second:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .second:disabled{color:var(--muted);cursor:default;}
  .bilan{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sais);border:1px solid var(--sais-b);font-size:.92rem;}
  .bilan .question{margin-top:6px;font-weight:600;}
  .bilan.rate{background:var(--ko-bg);border-color:#e7a79e;}
  .rates{display:flex;gap:6px;flex-wrap:wrap;}
  .pile-ratee{background:#fff;border:2px solid var(--border);border-radius:8px;padding:3px;}
  .pile-ratee:hover{border-color:var(--ko);}
  .pile-ratee .mini{border:none;padding:0;}
  .pile-ratee .n{display:none;}
  .numero{font-weight:400;color:var(--muted);font-size:1rem;}
  .aller-numero{display:flex;align-items:center;gap:6px;font-size:.85rem;}
  .aller-numero input{width:78px;font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:8px;text-align:center;}
  .erreur-numero{color:var(--ko);font-size:.8rem;}
  .aide{color:var(--muted);font-size:.9rem;margin:0 0 12px;}
  .eleve{font-size:.85rem;font-weight:600;}
  .eleve .note{background:var(--ok-bg);border:1px solid var(--donc-b);border-radius:999px;padding:3px 10px;margin-left:6px;}
  .nom-eleve{display:flex;flex-direction:column;gap:6px;margin:18px 0 6px;font-weight:600;font-size:1.05rem;}
  .nom-eleve input{font:inherit;font-weight:400;padding:10px 12px;border:2px solid var(--border);border-radius:10px;max-width:420px;}
  .nom-eleve input:focus{outline:none;border-color:var(--accent);}
  .points-ex{font-size:.9rem;margin:0 0 10px;padding:6px 10px;border-radius:8px;background:#fff6d6;display:flex;justify-content:space-between;gap:8px;}
  .nb-blocs{font-size:.9rem;margin:0 0 10px;padding:6px 10px;border-radius:8px;background:var(--bg);display:flex;justify-content:space-between;gap:8px;}
  .nb-blocs b{font-size:1rem;}

  .demo{display:flex;flex-direction:column;gap:0;font-size:.92rem;}
  .demo .m{border:2px solid;border-radius:10px;padding:6px 10px;}
  .demo .m b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;}
  .demo .m-sais{background:var(--sais);border-color:var(--sais-b);}
  .demo .m-sais b{color:#2a4f9e;}
  .demo .m-regle{background:var(--regle);border-color:var(--regle-b);}
  .demo .m-regle b{color:#8a5a00;}
  .demo .m-donc{background:var(--donc);border-color:var(--donc-b);}
  .demo .m-donc b{color:#1d6b3c;}
  .demo .fl{text-align:center;color:var(--muted);line-height:1.2;}
  .compteur{font-size:.8rem;color:var(--muted);margin-bottom:6px;}

  .retour{border-radius:10px;padding:12px 14px;font-size:1rem;margin-top:12px;}
  .retour.ko{background:var(--ko-bg);border-left:5px solid var(--ko);}
  .retour.ok{background:var(--ok-bg);border-left:5px solid var(--ok);}

  @media (max-width:900px), (max-height:560px){
    body{height:auto;min-height:100vh;}
    main{grid-template-columns:1fr;}
    .plateau{flex-wrap:wrap;}
    #chantier{flex:none;}
    .gauche{max-width:none;}
    .programme{min-width:min(300px,100%);}
    #blockly{flex:none;height:480px;}
  }
  .intro p{font-size:1.05rem;margin:0 0 8px;}
  .intro h2{margin:0 0 10px;}
  .intro .etapes{margin:0 0 10px;padding-top:8px;padding-bottom:8px;}
  .intro .actions{margin-top:10px;}
  .intro{overflow:auto;scrollbar-width:none;}
  .etapes{background:#f1edfc;border:2px solid #7a5fd0;border-radius:12px;padding:12px 16px 12px 40px;font-size:1.05rem;}
  .etapes li{margin-bottom:4px;}
  .actions{margin-top:18px;display:flex;justify-content:flex-end;}
  .actions .suite{width:auto;}
</style>
</head>
<body>
<header>
  <h1>🏗️ La grue avec variable</h1>
  <nav id="nav"></nav>
  <form class="aller-numero" id="allerNumero" autocomplete="off">
    <label for="champNumero">Grille n°</label>
    <input id="champNumero" type="text" inputmode="numeric" maxlength="5" placeholder="12483">
    <button type="submit" class="onglet">OK</button>
    <span id="erreurNumero" class="erreur-numero"></span>
  </form>
  <span class="eleve" id="eleveInfo"></span>
  <button class="onglet" id="btnDiplome" title="Voir et imprimer le diplôme" style="display:none">🎓 Diplôme</button>
  <button class="onglet" id="onglet" title="Ouvrir l’appli dans un nouvel onglet">↗ Nouvel onglet</button>
</header>
<main>
  <section class="scene" id="scene"></section>
  <div class="colonne" id="colonne"></div>
</main>

<script>
// Tout le code est enfermé dans une fonction : taper « eleve » ou « noter » dans la console ne donne rien.
(() => {
"use strict";
// === MOTEUR === (simulation + création des grilles, sans affichage)
// Caisses : une lettre par sorte de caisse (couleur + étiquette emoji, pour l'impression en noir et blanc).
// Une pile = une chaîne, du bas vers le haut (ex. "rb" : 🐟 posée sur 🍎).
const COUL = {
  r: { emo: "🍎", hex: "#e0473a" },
  b: { emo: "🐟", hex: "#3d7fe0" },
  g: { emo: "🍀", hex: "#2fa55a" },
  y: { emo: "⭐", hex: "#f1c232" },
  // caisses numérotées (niveau 5) : le numéro est la colonne où la ranger
  "2": { emo: "2", hex: "#d8b27c", num: 2 },
  "3": { emo: "3", hex: "#d8b27c", num: 3 },
  "4": { emo: "4", hex: "#d8b27c", num: 4 },
  "5": { emo: "5", hex: "#d8b27c", num: 5 }
};
const SORTES = ["r", "b", "g", "y"];   // les caisses à étiquette emoji
const HMAX = 6;           // hauteur maximale d'une pile
// Programme : liste de nœuds (les colonnes sont numérotées à partir de 1)
//  { t: "A", col }                            aller en colonne col (un nombre, ou "c" : la valeur de la variable)
//  { t: "P" } / { t: "L" }                    attraper / lâcher
//  { t: "M", n }                              mettre c à n
//  { t: "I" }                                 ajouter 1 à c
//  { t: "R", n, corps: [...] }                répéter n fois (n peut valoir "c")
//  { t: "S", c, corps: [...] }                si la pince tient une caisse de sorte c
//                                             (c = "c" : si le numéro de la caisse tenue est égal à la variable c)
// « trou: true » : valeur cachée (mode « compléter »)
const texte = nd => nd.t === "A" ? "aller en colonne " + nd.col : nd.t === "M" ? "mettre c à " + nd.n
  : { P: "attraper", L: "lâcher", I: "ajouter 1 à c" }[nd.t];

// Exécute tout le programme et renvoie la liste des étapes (pour l'animation et le raisonnement).
// Chaque étape : { etats: [état, ...], ids: [bloc], j: { sais, regle, tour, donc }, cond }
function executer(piles0, ncols, prog, max = 400) {
  let id = 0;
  const couleurs = [];
  const e = {
    piles: piles0.map(s => [...s].map(ch => { couleurs.push(ch); return id++; })),
    col: 0, tient: null, bas: false, c: null
  };
  const photo = (extra = {}) => ({ piles: e.piles.map(p => [...p]), col: e.col, tient: e.tient, bas: e.bas, c: e.c, ...extra });
  const frames = [{ etats: [photo()], ids: [], j: null }];
  const emo = i => COUL[couleurs[i]].emo;
  let fin = null, compte = 0;
  const tours = [];
  const sais = () => (e.tient === null ? "La pince est vide" : "La pince tient la caisse " + emo(e.tient)) + ", au-dessus de la colonne " + (e.col + 1) + ".";
  const tour = () => tours.length ? "répéter : tour " + tours.map(t => t.k + " sur " + t.n).join(" › ") : "";

  function action(nd) {
    if (++compte > max) { fin = "long"; return; }
    const f = { ids: [nd.id], j: { sais: sais(), regle: texte(nd) + ".", tour: tour() } };
    let donc;
    if (nd.t === "A") {
      const v = nd.col === "c" ? e.c : nd.col;
      if (v === null) { fin = "sansValeur"; donc = "❌ c n’a pas encore de valeur !"; f.etats = [photo({ erreur: true })]; }
      else if (v < 1 || v > ncols) { fin = "sortie"; donc = "💥 La colonne " + v + " n’existe pas !"; f.etats = [photo({ boum: v < 1 ? "G" : "D" })]; }
      else {
        donc = (nd.col === "c" ? "c vaut " + v + " : j" : "J") + (e.col === v - 1 ? "e reste en colonne " : "e vais en colonne ") + v + ".";
        e.col = v - 1; f.etats = [photo()];
      }
    } else if (nd.t === "M") {
      e.c = nd.n; donc = "Maintenant, c vaut " + nd.n + "."; f.etats = [photo()];
    } else if (nd.t === "I") {
      if (e.c === null) { fin = "sansValeur"; donc = "❌ c n’a pas encore de valeur !"; f.etats = [photo({ erreur: true })]; }
      else { e.c++; donc = "c valait " + (e.c - 1) + ", maintenant c vaut " + e.c + "."; f.etats = [photo()]; }
    } else if (nd.t === "P") {
      const p = e.piles[e.col];
      if (e.tient !== null) { fin = "pleine"; donc = "❌ Je tiens déjà une caisse !"; f.etats = [photo({ erreur: true })]; }
      else if (!p.length) {
        fin = "vide"; donc = "❌ Il n’y a rien à attraper !";
        e.bas = true; const a = photo({ erreur: true }); e.bas = false; f.etats = [a];
      } else {
        e.bas = true; const a = photo(); e.bas = false;
        e.tient = p.pop();
        donc = "J’attrape la caisse " + emo(e.tient) + ".";
        f.etats = [a, photo()];
      }
    } else if (nd.t === "L") {
      const p = e.piles[e.col];
      if (e.tient === null) { fin = "rien"; donc = "❌ Je n’ai rien à lâcher !"; f.etats = [photo({ erreur: true })]; }
      else if (p.length >= HMAX) { fin = "haut"; donc = "❌ La pile est trop haute !"; f.etats = [photo({ erreur: true })]; }
      else {
        e.bas = true; const a = photo(); e.bas = false;
        const t = e.tient; p.push(t); e.tient = null;
        donc = "Je lâche la caisse " + emo(t) + " en colonne " + (e.col + 1) + ".";
        f.etats = [a, photo()];
      }
    }
    f.j.donc = donc;
    frames.push(f);
  }
  function bloc(liste) {
    for (const nd of liste) {
      if (fin) return;
      if (nd.t === "R") {
        // « répéter c fois » : c est lu au début de la boucle
        if (nd.n === "c" && e.c === null) {
          fin = "sansValeur";
          frames.push({ ids: [nd.id], etats: [photo({ erreur: true })], j: { sais: sais(), regle: "répéter c fois.", tour: tour(), donc: "❌ c n’a pas encore de valeur !" } });
          return;
        }
        const t = { k: 0, n: nd.n === "c" ? e.c : nd.n };
        tours.push(t);
        for (t.k = 1; t.k <= t.n && !fin; t.k++) bloc(nd.corps);
        tours.pop();
      } else if (nd.t === "S") {
        if (++compte > max) { fin = "long"; return; }
        if (nd.c === "c") {
          // on compare le numéro de la caisse tenue à la valeur de c
          const num = e.tient === null ? null : COUL[couleurs[e.tient]].num;
          const f = { ids: [nd.id], etats: [photo()], cond: true, j: { sais: sais(), regle: "si la pince tient c alors…", tour: tour() } };
          if (e.c === null) { fin = "sansValeur"; f.etats = [photo({ erreur: true })]; f.j.donc = "❌ c n’a pas encore de valeur !"; frames.push(f); return; }
          const oui = num === e.c;
          f.j.donc = e.tient === null ? "La pince est vide : je passe."
            : !num ? "Cette caisse n’a pas de numéro : je passe."
            : oui ? "La caisse porte le numéro " + num + " et c vaut " + e.c + " : je fais ce qu’il y a dedans."
            : "La caisse porte le numéro " + num + ", mais c vaut " + e.c + " : je passe.";
          frames.push(f);
          if (oui) bloc(nd.corps);
          continue;
        }
        const oui = e.tient !== null && couleurs[e.tient] === nd.c, x = COUL[nd.c].emo;
        frames.push({ ids: [nd.id], etats: [photo()], cond: true, j: {
          sais: sais(), regle: "si la pince tient " + x + " alors…", tour: tour(),
          donc: oui ? "C’est " + x + " : je fais ce qu’il y a dedans." : "Ce n’est pas " + x + " : je passe."
        } });
        if (oui) bloc(nd.corps);
      } else action(nd);
    }
  }
  bloc(prog);
  return { frames, fin: fin || "ok", final: e.piles.map(p => p.map(i => couleurs[i]).join("")), tient: e.tient, couleurs };
}

const egal = (a, b) => a.join("|") === b.join("|");
// Programme réussi : pas d'erreur, pince vide à la fin, et piles identiques au modèle
const reussi = (item, prog) => { const r = executer(item.piles0, item.ncols, prog); return r.fin === "ok" && r.tient === null && egal(r.final, item.modele); };

// ---------- Création automatique des grilles ----------
// Tirage pseudo-aléatoire reproductible : un même numéro de grille donne toujours la même grille.
// ⚠️ Une fois des numéros notés par le professeur, ne plus modifier ce qui suit (ordre des tirages, formes, simulation).
let alea = Math.random;
function graine(n) {
  let a = n >>> 0;
  alea = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hasard = n => Math.floor(alea() * n);
const choisir = t => t[hasard(t.length)];
function melangeTab(t) { t = [...t]; for (let k = t.length - 1; k > 0; k--) { const j = hasard(k + 1); [t[k], t[j]] = [t[j], t[k]]; } return t; }
const aller = col => ({ t: "A", col });

// n caisses de sortes variées, réparties sur les piles (au plus « max » par pile au départ)
function tirerPiles(ncols, n, max = 3) {
  const cs = melangeTab(SORTES).slice(0, 2 + hasard(2));
  let caisses;
  do { caisses = Array.from({ length: n }, () => choisir(cs)); } while (new Set(caisses).size < 2);
  const piles = Array(ncols).fill("");
  for (const ch of caisses) {
    const libres = [...piles.keys()].filter(k => piles[k].length < max);
    piles[choisir(libres)] += ch;
  }
  return piles;
}

// Forme 1 : une suite d'instructions (k déplacements de caisses), sans variable
function formeSuite(k) {
  const ncols = 3 + hasard(2), piles = tirerPiles(ncols, 3 + hasard(2));
  const p = [...piles], prog = [];
  let avant = -1, col = 0;
  for (let i = 0; i < k; i++) {
    const sources = [...p.keys()].filter(x => p[x].length && x !== avant);
    if (!sources.length) return null;
    const a = choisir(sources);
    const b = choisir([...p.keys()].filter(x => x !== a && p[x].length < HMAX));
    p[b] += p[a].slice(-1); p[a] = p[a].slice(0, -1);
    if (a !== col) prog.push(aller(a + 1));
    prog.push({ t: "P" }, aller(b + 1), { t: "L" });
    avant = col = b;
  }
  return { ncols, piles0: piles, prog };
}

// Forme 1 bis : une suite d'instructions avec la variable, sans boucle.
// La grue lâche toujours en colonne c ; entre deux déplacements, c change (ajouter 1, ou nouvelle valeur).
function formeSuiteC(k) {
  const ncols = 3 + hasard(2), piles = tirerPiles(ncols, 3 + hasard(2));
  const p = [...piles];
  let c = 1 + hasard(ncols), col = 0;
  const prog = [{ t: "M", n: c }];
  for (let i = 0; i < k; i++) {
    const sources = [...p.keys()].filter(x => p[x].length && x !== c - 1);
    if (!sources.length || p[c - 1].length >= HMAX) return null;
    const a = choisir(sources);
    if (a !== col) prog.push(aller(a + 1));
    prog.push({ t: "P" }, aller("c"), { t: "L" });
    p[c - 1] += p[a].slice(-1); p[a] = p[a].slice(0, -1);
    col = c - 1;
    if (i < k - 1) {
      if (c < ncols && hasard(2)) { prog.push({ t: "I" }); c++; }
      else { const n = choisir([...Array(ncols).keys()].map(x => x + 1).filter(x => x !== c)); prog.push({ t: "M", n }); c = n; }
    }
  }
  return { ncols, piles0: piles, prog };
}

// Forme 2 : un compteur. « Étaler » : une caisse par colonne, c augmente ;
// « ramasser » : on prend une caisse dans chaque colonne pour tout empiler sur une seule.
function formeCompteur(sens) {
  const ncols = 4 + hasard(2), n = 2 + hasard(2);
  const s = 1 + hasard(ncols - n + 1);                      // colonnes s … s + n − 1
  const hors = [...Array(ncols).keys()].map(x => x + 1).filter(x => x < s || x >= s + n);
  if (!hors.length) return null;
  const fixe = choisir(hors);
  const piles = tirerPiles(ncols, 2 + hasard(3), 2);
  if (sens === "etaler") {
    piles[fixe - 1] = tirerPiles(1, n + hasard(2), HMAX)[0];
    return { ncols, piles0: piles, prog: [{ t: "M", n: s }, { t: "R", n, corps: [aller(fixe), { t: "P" }, aller("c"), { t: "L" }, { t: "I" }] }] };
  }
  for (let x = s; x < s + n; x++) if (!piles[x - 1]) piles[x - 1] = choisir(SORTES);
  return { ncols, piles0: piles, prog: [{ t: "M", n: s }, { t: "R", n, corps: [aller("c"), { t: "P" }, aller(fixe), { t: "L" }, { t: "I" }] }] };
}

// Une pile de m caisses numérotées (tous les numéros présents), à vider depuis la colonne 1
function pileNumeros(m, nums) {
  let pile;
  do { pile = Array.from({ length: m }, () => choisir(nums)).join(""); } while (!nums.every(x => pile.includes(x)));
  return pile;
}
const siMettre = (c, k) => ({ t: "S", c, corps: [{ t: "M", n: k }] });

// Forme 3 : tri de caisses numérotées : chaque « si » met c au numéro lu, puis « aller en colonne c »
function formeTriNum() {
  const m = 3 + hasard(3), nums = melangeTab(["2", "3"]);
  return { ncols: 3, piles0: [pileNumeros(m, nums), "", ""],
    prog: [{ t: "R", n: m, corps: [aller(1), { t: "P" }, ...nums.map(x => siMettre(x, +x)), aller("c"), { t: "L" }] }] };
}

// Forme 4 : c « par défaut », puis un seul « si » qui la change
function formeDefaut() {
  const ncols = 3 + hasard(2), m = 3 + hasard(3);
  const [d, autre] = melangeTab([...Array(ncols - 1).keys()].map(x => String(x + 2))).slice(0, 2);
  return { ncols, piles0: [pileNumeros(m, [d, autre]), ...Array(ncols - 1).fill("")],
    prog: [{ t: "R", n: m, corps: [aller(1), { t: "P" }, { t: "M", n: +d }, siMettre(autre, +autre), aller("c"), { t: "L" }] }] };
}

// Forme 5 : recherche avec « si la pince tient c » : la grue essaie c = 2, 3, 4…
function formeSiC() {
  const ncols = 4, m = 3 + hasard(2);
  return { ncols, piles0: [pileNumeros(m, ["2", "3", "4"]), "", "", ""],
    prog: [{ t: "R", n: m, corps: [aller(1), { t: "P" }, { t: "M", n: 2 }, { t: "R", n: 3, corps: [{ t: "S", c: "c", corps: [aller("c"), { t: "L" }] }, { t: "I" }] }] }] };
}

const FORMES = {
  suite: o => formeSuite(o.k || 2),
  suiteC: o => formeSuiteC(o.k || 2),
  compteur: o => formeCompteur(o.sens || choisir(["etaler", "ramasser"])),
  triNum: formeTriNum,
  defaut: formeDefaut,
  siC: formeSiC
};
// Autres valeurs possibles dans un « si la pince tient … » (étiquettes, ou numéros et c)
const autresSortes = (c, ncols) => SORTES.includes(c) ? SORTES.filter(x => x !== c)
  : [...Array(ncols - 1).keys()].map(x => String(x + 2)).concat(["c"]).filter(x => x !== c);
const utiliseC = liste => liste.some(nd => nd.t === "M" || (nd.t === "S" && nd.c === "c") || (nd.corps && utiliseC(nd.corps)));

// Toutes les versions du programme avec UNE erreur (lecture ou écriture)
function mutations(liste, ncols, avecC) {
  const res = [];
  const cols = [...Array(ncols).keys()].map(x => x + 1).concat(avecC ? ["c"] : []);
  liste.forEach((nd, i) => {
    const rempl = n2 => res.push(liste.map((x, j) => j === i ? n2 : x));
    if (nd.t === "A") for (const x of cols) if (x !== nd.col) rempl({ ...nd, col: x });
    if (nd.t === "M") { if (nd.n > 1) rempl({ ...nd, n: nd.n - 1 }); if (nd.n < ncols) rempl({ ...nd, n: nd.n + 1 }); }
    if (nd.t === "I") res.push(liste.filter((x, j) => j !== i));     // on oublie « ajouter 1 à c »
    if (nd.t === "R") {
      if (nd.n > 1) rempl({ ...nd, n: nd.n - 1 });
      if (nd.n < 6) rempl({ ...nd, n: nd.n + 1 });
      for (const c of mutations(nd.corps, ncols, avecC)) rempl({ ...nd, corps: c });
    }
    if (nd.t === "S") {
      for (const x of autresSortes(nd.c, ncols)) rempl({ ...nd, c: x });
      for (const c of mutations(nd.corps, ncols, avecC)) rempl({ ...nd, corps: c });
    }
  });
  const sis = [...liste.keys()].filter(k => liste[k].t === "S");
  if (sis.length === 2) res.push(liste.map((x, j) => j === sis[0] ? { ...x, c: liste[sis[1]].c } : j === sis[1] ? { ...x, c: liste[sis[0]].c } : x));
  return res;
}

// Toutes les façons de cacher UNE valeur ; alts : les programmes obtenus avec une autre valeur
function trous(liste, ncols, avecC) {
  const res = [];
  const cols = [...Array(ncols).keys()].map(x => x + 1).concat(avecC ? ["c"] : []);
  liste.forEach((nd, i) => {
    const avec = n2 => liste.map((x, j) => j === i ? n2 : x);
    if (nd.t === "A") res.push({ prog: avec({ ...nd, trou: true }), alts: cols.filter(x => x !== nd.col).map(x => avec({ ...nd, col: x })) });
    if (nd.t === "M") res.push({ prog: avec({ ...nd, trou: true }), alts: cols.filter(x => x !== nd.n && x !== "c").map(x => avec({ ...nd, n: x })) });
    if (nd.t === "R") {
      res.push({ prog: avec({ ...nd, trou: true }), alts: [1, 2, 3, 4, 5, 6].filter(x => x !== nd.n).map(x => avec({ ...nd, n: x })) });
      for (const s of trous(nd.corps, ncols, avecC)) res.push({ prog: avec({ ...nd, corps: s.prog }), alts: s.alts.map(c => avec({ ...nd, corps: c })) });
    }
    if (nd.t === "S") {
      res.push({ prog: avec({ ...nd, trou: true }), alts: autresSortes(nd.c, ncols).map(x => avec({ ...nd, c: x })) });
      for (const s of trous(nd.corps, ncols, avecC)) res.push({ prog: avec({ ...nd, corps: s.prog }), alts: s.alts.map(c => avec({ ...nd, corps: c })) });
    }
  });
  return res;
}

function genererItem(mode, o) {
  for (let essai = 0; essai < 3000; essai++) {
    const f = FORMES[o.forme](o);
    if (!f) continue;
    const r = executer(f.piles0, f.ncols, f.prog);
    if (r.fin !== "ok" || r.tient !== null || egal(r.final, f.piles0)) continue;
    const item = { ...f, modele: r.final };
    const avecC = utiliseC(f.prog);
    if (mode === "ecrire") return { ...item, solution: f.prog, prog: [] };
    if (mode === "prevoir") {
      // deux résultats pièges : ceux d'une lecture avec une seule erreur
      const pieges = [];
      for (const m of melangeTab(mutations(f.prog, f.ncols, avecC))) {
        const x = executer(f.piles0, f.ncols, m);
        if (x.fin === "ok" && x.tient === null && !egal(x.final, f.piles0) && ![r.final, ...pieges].some(y => egal(y, x.final))) pieges.push(x.final);
        if (pieges.length === 2) break;
      }
      if (pieges.length < 2) continue;
      const lettres = melangeTab(["A", "B", "C"]);
      return { ...item, reponse: lettres[0], options: [r.final, ...pieges].map((p, k) => ({ l: lettres[k], piles: p })).sort((a, b) => a.l < b.l ? -1 : 1) };
    }
    if (mode === "completer") {
      // une seule bonne valeur possible pour la case cachée
      const t = melangeTab(trous(f.prog, f.ncols, avecC)).find(s => s.alts.every(a => !reussi(item, a)));
      if (!t) continue;
      return { ...item, prog: t.prog, solution: f.prog };
    }
    if (mode === "deboguer") {
      const m = melangeTab(mutations(f.prog, f.ncols, avecC)).find(a => !reussi(item, a));
      if (!m) continue;
      return { ...item, prog: m, solution: f.prog };
    }
  }
  return null;
}

  const t = "grue✦" + nom + "✦" + Object.keys(notes).sort().map(k => k + "=" + notes[k]).join(";");
  let h = 2166136261;
  for (let k = 0; k < t.length; k++) { h ^= t.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}

// Construit le programme de l'item dans Blockly ; en mode « compléter », seuls les « ? » se modifient
function construireProgramme(item) {
  const bloque = item.mode === "completer";
  const nouveau = type => { const b = ws.newBlock(type); b.initSvg(); return b; };
  const dep = nouveau("depart");
  dep.setMovable(false); dep.setDeletable(false);
  const liste = (noeuds, conn) => {
    for (const nd of noeuds) {
      let b;
      if (nd.t === "P") b = nouveau("attraper");
      else if (nd.t === "L") b = nouveau("lacher");
      else if (nd.t === "I") b = nouveau("ajouter_c");
      else if (nd.t === "A") { b = nouveau("aller_col"); b.setFieldValue(nd.trou ? "?" : String(nd.col), "COL"); }
      else if (nd.t === "M") { b = nouveau("mettre_c"); b.setFieldValue(nd.trou ? "?" : String(nd.n), "N"); }
      else if (nd.t === "R") { b = nouveau("repeter"); b.setFieldValue(nd.trou ? "?" : String(nd.n), "N"); }
      else { b = nouveau("si_tient"); b.setFieldValue(nd.trou ? "?" : nd.c, "C"); }
      if (bloque) { b.setMovable(false); b.setDeletable(false); if (!nd.trou) b.setEditable(false); }
      conn.connect(b.previousConnection);
      if (nd.corps) liste(nd.corps, b.getInput("DO").connection);
      conn = b.nextConnection;
    }
  };
  liste(item.prog, dep.nextConnection);
  ws.getAllBlocks(false).forEach(b => b.render());
  dep.moveBy(16, 16);
}

// Lit le programme accroché sous « quand ▶ Lancer est cliqué »
function lireProgramme() {
  const dep = ws.getAllBlocks(false).find(b => b.type === "depart");
  const val = (b, champ) => { const v = b.getFieldValue(champ); return v === "?" ? null : v === "c" ? "c" : +v; };
  const chaine = b => {
    const l = [];
    for (; b; b = b.getNextBlock()) {
      if (b.type === "attraper") l.push({ t: "P", id: b.id });
      else if (b.type === "lacher") l.push({ t: "L", id: b.id });
      else if (b.type === "ajouter_c") l.push({ t: "I", id: b.id });
      else if (b.type === "aller_col") l.push({ t: "A", col: val(b, "COL"), id: b.id });
      else if (b.type === "mettre_c") l.push({ t: "M", n: val(b, "N"), id: b.id });
      else if (b.type === "repeter") l.push({ t: "R", n: val(b, "N"), corps: chaine(b.getInputTargetBlock("DO")), id: b.id });
      else if (b.type === "si_tient") { const v = b.getFieldValue("C"); l.push({ t: "S", c: v === "?" ? null : v, corps: chaine(b.getInputTargetBlock("DO")), id: b.id }); }
    }
    return l;
  };
  return dep ? chaine(dep.getNextBlock()) : [];
}

function problemes() {
  const item = itemCourant(), pb = [];
  if (item.mode === "prevoir") { if (prediction === null) pb.push("Glisse ta prévision dans la case, puis lance le programme."); return pb; }
  const tous = [];
  const parcourir = l => l.forEach(nd => { tous.push(nd); if (nd.corps) parcourir(nd.corps); });
  parcourir(programme);
  if (!programme.length) pb.push("Accroche des blocs sous « quand ▶ Lancer est cliqué ».");
  if (tous.some(nd => (nd.t === "A" && nd.col === null) || ((nd.t === "M" || nd.t === "R") && nd.n === null) || (nd.t === "S" && !nd.c))) pb.push("Choisis la valeur de chaque « ? ».");
  if (tous.some(nd => nd.t === "R" && !nd.corps.length)) pb.push("Un bloc « répéter » est vide.");
  return pb;
}
const pret = () => problemes().length === 0;

// Compteur de blocs (sans le bloc « quand ▶ Lancer est cliqué ») et record à battre
const compter = l => l.reduce((n, nd) => n + 1 + (nd.corps ? compter(nd.corps) : 0), 0);
function record(item) {
  if (item.mode === "ecrire") return compter(item.solution);
  // rangement : répéter { aller en colonne 1, attraper, mettre c à 4 (par défaut),
  //   si la pince tient 2 alors mettre c à 2, si la pince tient 3 alors mettre c à 3, aller en colonne c, lâcher }
  // (le défi expert en 9 blocs, une recherche avec « si la pince tient c », ne compte pas pour la note)
  if (item.mode === "trier") return 10;
  return null;
}

// ---------- Le chantier (dessin de la grue) ----------
const COLW = 72, CS = 48, PAD = 14, PH = 14, HAUT = 36;
const SOL = HAUT + PH + CS + 14 + HMAX * CS;
const xCol = c => PAD + c * COLW + COLW / 2;
const PINCE = `<svg viewBox="0 0 48 14"><path d="M4 13 L4 4 L44 4 L44 13" fill="none" stroke="#39404c" stroke-width="4" stroke-linejoin="round"/><rect x="18" y="0" width="12" height="6" rx="2" fill="#39404c"/></svg>`;
let dom = null;   // éléments du chantier affiché

function construireChantier(item) {
  const w = PAD * 2 + item.ncols * COLW, h = SOL + (item.mode === "trier" && !COUL[item.couleurs[0]].num ? 60 : 34);
  const ch = el("div", { class: "chantier fixe" });
  ch.style.width = w + "px"; ch.style.height = h + "px";
  for (let c = 0; c < item.ncols; c++) {
    const g = el("div", { class: "guide" });
    Object.assign(g.style, { left: (xCol(c) - CS / 2 - 2) + "px", width: (CS + 4) + "px", top: (SOL - HMAX * CS) + "px", height: HMAX * CS + "px" });
    const n = el("div", { class: "num-pile" }, String(c + 1));
    Object.assign(n.style, { left: (xCol(c) - 20) + "px", width: "40px", top: (SOL + 10) + "px" });
    ch.append(g, n);
    // niveau 5 : l’étiquette attendue sur chaque pile
    if (item.mode === "trier" && c > 0 && item.couleurs[c - 1] && !COUL[item.couleurs[c - 1]].num) {
      const m = el("div", { class: "marque" }, COUL[item.couleurs[c - 1]].emo);
      Object.assign(m.style, { left: (xCol(c) - CS / 2) + "px", width: CS + "px", top: (SOL + 34) + "px" });
      ch.append(m);
    }
  }
  const sol = el("div", { class: "sol" }); sol.style.top = SOL + "px";
  const chariot = el("div", { class: "chariot" }), cable = el("div", { class: "cable" }), pince = el("div", { class: "pince" });
  pince.innerHTML = PINCE;
  const boum = el("div", { class: "boum" }, "💥"); boum.style.display = "none";
  ch.append(el("div", { class: "rail" }), sol, cable, chariot, pince, boum);
  const caisses = res.couleurs.map(c => {
    const d = el("div", { class: "caisse" }, el("span", { class: "etiquette" }, COUL[c].emo));
    Object.assign(d.style, { width: (CS - 4) + "px", height: (CS - 4) + "px", background: COUL[c].hex });
    ch.append(d);
    return d;
  });
  dom = { ch, chariot, cable, pince, boum, caisses };
  return ch;
}

// Place la grue et les caisses selon un état ; sansAnim : saut immédiat (retour au départ)
function dessiner(et, sansAnim) {
  if (!dom) return;
  if (sansAnim) dom.ch.classList.add("fixe");
  const decal = et.boum ? (et.boum === "G" ? -26 : 26) : 0;
  const x = xCol(et.col) + decal;
  const hauteur = et.piles[et.col].length;
  let y = HAUT;
  if (et.bas) y = et.tient !== null ? SOL - (hauteur + 1) * CS - PH : SOL - hauteur * CS - PH + 4;
  dom.chariot.style.left = (x - 20) + "px";
  dom.cable.style.left = (x - 1) + "px";
  dom.cable.style.height = (y - 24 + 4) + "px";
  dom.pince.style.left = (x - 24) + "px";
  dom.pince.style.top = y + "px";
  et.piles.forEach((p, c) => p.forEach((id, k) => {
    dom.caisses[id].style.left = (xCol(c) - CS / 2 + 2) + "px";
    dom.caisses[id].style.top = (SOL - (k + 1) * CS + 2) + "px";
  }));
  if (et.tient !== null) {
    dom.caisses[et.tient].style.left = (x - CS / 2 + 2) + "px";
    dom.caisses[et.tient].style.top = (y + PH) + "px";
  }
  dom.boum.style.display = et.boum || et.erreur ? "" : "none";
  dom.boum.style.left = x + "px";
  dom.boum.style.top = (et.boum ? 14 : y + PH) + "px";
  const v = $("variable"), txt = "c = " + (et.c === null ? "?" : et.c);
  if (v && v.textContent !== txt) {
    v.textContent = txt;
    if (!sansAnim) { v.classList.add("change"); setTimeout(() => v.classList.remove("change"), 300); }
  }
  if (sansAnim) { void dom.ch.offsetWidth; dom.ch.classList.remove("fixe"); }
}

// Petit dessin des piles (modèle, résultats possibles)
function mini(piles, t = 18) {
  const m = el("div", { class: "mini" });
  piles.forEach((p, k) => {
    const col = el("div", { class: "col" });
    col.style.width = (t + Math.round(t / 3)) + "px"; col.style.height = (HMAX * (t + 2) + 3) + "px";
    for (const ch of p) { const c = el("div", { class: "c" }, COUL[ch].emo); Object.assign(c.style, { width: t + "px", height: t + "px", background: COUL[ch].hex, fontSize: Math.round(t * 0.62) + "px" }); col.append(c); }
    m.append(el("div", {}, col, el("div", { class: "n" }, String(k + 1))));
  });
  return m;
}

// ---------- Exécution ----------
function recalculer() {
  const item = itemCourant();
  // en mode « prévoir », le programme est complet même sans prévision
  res = executer(item.piles0, item.ncols, item.mode === "prevoir" || pret() ? programme : []);
  idx = 0;
}

function arreter() { clearTimeout(minuteur); minuteur = null; }
const fini = () => idx > 0 && idx === res.frames.length - 1;
// En mode « prévoir », le raisonnement ne commence qu'une fois le programme lancé
const demarre = () => itemCourant().mode !== "prevoir" || idx > 0 || minuteur !== null;

function avancer(auto) {
  const f = res.frames[++idx];
  dessiner(f.etats[0]);
  minuteur = setTimeout(() => {
    if (f.etats.length > 1) dessiner(f.etats[1]);
    if (fini()) { minuteur = null; terminer(); majVue(); return; }
    if (auto) minuteur = setTimeout(() => avancer(true), f.cond ? 250 : 380);
    else { minuteur = null; majVue(); }
  }, f.etats.length > 1 ? 300 : 0);
  majVue();
}

function lancer(pasAPas) {
  if (fini()) recommencer();
  arreter();
  if (res.frames.length < 2) return;
  if (pasAPas) avancer(false);
  else minuteur = setTimeout(() => avancer(true), 150), majVue();
}

function recommencer() {
  arreter();
  idx = 0;
  dessiner(res.frames[0].etats[0], true);
  majVue();
}

function terminer() {
  const item = itemCourant();
  // tri : validé seulement si le programme résiste aux autres piles (voir testerPiles)
  if (reussite() && item.mode !== "trier") fait[ecran.n + "-" + ecran.i] = true;
  if (reussite()) noter(pointsGrille()); else echecs++;
}

// Points gagnés sur la grille en cours :
//  prévoir : 1 si la première prévision est la bonne ; compléter, déboguer : 1 du premier coup, ½ après des essais ratés ;
//  écrire : réussite (1 ou ½) + 1 si le record de blocs est atteint ; ranger : + 1 si le programme marche sur toutes les piles
function pointsGrille() {
  const item = itemCourant();
  if (!fini() || !reussite()) return 0;
  const base = item.mode === "prevoir" ? (echecs ? 0 : 1) : (echecs ? 0.5 : 1);
  const rec = record(item), recOk = rec && compter(programme) <= rec ? 1 : 0;
  if (item.mode === "ecrire") return base + recOk;
  if (item.mode === "trier") return base + recOk + (tests && tests.every(t => t.ok) ? 1 : 0);
  return base;
}

// Niveau 5 : chaque couleur sur sa pile, la pile 1 vide
function trie(item, final) {
  return final[0] === "" && item.couleurs.every((c, k) => [...final[k + 1]].every(x => x === c)) && final.join("").length === item.n;
}

function reussite() {
  const item = itemCourant();
  if (!fini() || res.fin !== "ok" || res.tient !== null) return false;
  if (item.mode === "prevoir") return prediction === item.reponse;
  if (item.mode === "trier") return trie(item, res.final);
  return egal(res.final, item.modele);
}

// numero : numéro de grille imposé (dicté par le professeur) ; sinon tiré au hasard
function allerA(n, i, numero) {
  arreter();
  // on ne commence pas sans son nom (il figure sur le diplôme)
  if (!eleve.nom) { ecran = { type: "intro" }; rendu(); return; }
  echecs = 0;
  ecran = { type: "item", n, i };
  const it = itemCourant();
  if (it.genere) {
    // numéro à 5 chiffres : niveau, pastille, puis 3 chiffres (ex. 12483 = niveau 1, pastille ②)
    it.numero = numero || (n + 1) * 10000 + (i + 1) * 1000 + Math.floor(Math.random() * 1000);
    graine(it.numero);
    Object.assign(it, genererItem(it.mode, it.genere));
    alea = Math.random;
  }
  if (it.mode === "trier") { it.piles0 = null; nouvellePile(it); it.prog = []; }
  tests = null;
  prediction = null;
  rendu();
}

// Pile bien mélangée : autant de caisses de chaque sorte (à une près), au plus deux caisses
// identiques côte à côte, et jamais la même pile que la précédente
function tirerPile(it) {
  const k = it.couleurs.length, bas = Math.floor(it.n / k), haut = Math.ceil(it.n / k);
  const melangee = p => it.couleurs.every(c => { const x = [...p].filter(y => y === c).length; return x >= bas && x <= haut; })
    && [...p].filter((c, i) => i > 0 && c === p[i - 1]).length <= 1;
  let p;
  do { p = Array.from({ length: it.n }, () => choisir(it.couleurs)).join(""); } while (!melangee(p));
  return p;
}
function nouvellePile(it) {
  const avant = it.piles0 && it.piles0[0];
  let p;
  do { p = tirerPile(it); } while (p === avant);
  it.ncols = it.couleurs.length + 1;
  it.piles0 = [p, ...it.couleurs.map(() => "")];
}

// Le programme résiste-t-il au changement de pile ? On l'essaie sur 10 autres mélanges.
function testerPiles() {
  const item = itemCourant(), vues = new Set([item.piles0[0]]);
  tests = [];
  for (let essai = 0; essai < 1000 && tests.length < 10; essai++) {
    const p = tirerPile(item);
    if (vues.has(p)) continue;
    vues.add(p);
    const r = executer([p, ...item.couleurs.map(() => "")], item.ncols, programme);
    tests.push({ pile: p, ok: r.fin === "ok" && r.tient === null && trie(item, r.final) });
  }
  if (reussite() && tests.every(t => t.ok)) fait[ecran.n + "-" + ecran.i] = true;
  if (reussite()) noter(pointsGrille());
  majVue();
}

// Charge une pile précise (une pile ratée au test) pour regarder la grue s'y tromper
function chargerPile(p) {
  const item = itemCourant();
  arreter();
  item.piles0 = [p, ...item.couleurs.map(() => "")];
  recalculer();
  $("chantier").replaceChildren(construireChantier(item));
  dessiner(res.frames[0].etats[0], true);
  ajuster();
  majVue();
}

function suivant() {
  const { n, i } = ecran;
  if (i + 1 < NIVEAUX[n].items.length) allerA(n, i + 1);
  else if (n + 1 < NIVEAUX.length) allerA(n + 1, 0);
  else { arreter(); ecran = { type: "fin" }; rendu(); }
}

// ---------- Fiche papier ----------
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function fichePiles(piles, grue) {
  const cols = piles.map((p, k) => `<div class="fcol"><div class="fpile">${[...p].map(ch => `<span>${COUL[ch].emo}</span>`).join("")}</div><div class="fn">${k + 1}</div></div>`).join("");
  return `<div class="fchantier">${grue ? `<div class="frail"><span class="fgrue">▼</span></div>` : ""}<div class="fcols">${cols}</div></div>`;
}

function ficheBlocs(prog, mode) {
  const liste = l => l.map(nd => {
    const bulle = v => `<span class="bulle">${nd.trou ? "&nbsp;&nbsp;" : v}</span>`;
    if (nd.t === "A") return `<div class="b mouv">aller en colonne ${bulle(nd.col)}</div>`;
    if (nd.t === "M") return `<div class="b var">mettre c à ${bulle(nd.n)}</div>`;
    if (nd.t === "I") return `<div class="b var">ajouter 1 à c</div>`;
    if (nd.t === "P" || nd.t === "L") return `<div class="b mouv">${texte(nd)}</div>`;
    const tete = nd.t === "R" ? `répéter <span class="bulle">${nd.trou ? "&nbsp;&nbsp;" : nd.n}</span> fois`
      : `si la pince tient <span class="bulle">${nd.trou ? "&nbsp;&nbsp;&nbsp;" : (nd.c === "c" ? "c" : COUL[nd.c].emo)}</span> alors`;
    return `<div class="c"><div class="c-t">${tete}</div><div class="c-m">${liste(nd.corps)}</div><div class="c-p"></div></div>`;
  }).join("");
  const corps = mode === "ecrire" ? Array(10).fill(`<div class="ligne-ecrire">………………………………………</div>`).join("") : liste(prog);
  return `<div class="b chap">quand ▶ Lancer est cliqué</div>${corps}`;
}

function ficheContenu() {
  const niv = NIVEAUX[ecran.n], item = itemCourant();
  const consignes = {
    prevoir: "Lis le programme. Suis la grue avec ton crayon. Quel sera le résultat : A, B ou C ?",
    completer: "Complète le « ? » pour que la grue obtienne le modèle.",
    ecrire: "Écris le programme pour que la grue obtienne le modèle.",
    deboguer: "Le programme se trompe ! Trouve le bloc faux, barre-le et corrige-le."
  };
  const reserve = {
    completer: "Dans la bulle vide : un nombre, la variable c, ou une étiquette",
    ecrire: "Blocs : aller en colonne … — attraper — lâcher — mettre c à … — ajouter 1 à c — répéter … fois",
    deboguer: "Blocs : aller en colonne … — attraper — lâcher — mettre c à … — ajouter 1 à c — répéter … fois — si la pince tient … alors"
  }[item.mode];
  const bas = item.mode === "prevoir"
    ? `<div class="ft">Résultats possibles :</div><div class="fopts">${item.options.map(o => `<div><b>${o.l}</b>${fichePiles(o.piles)}</div>`).join("")}</div>
       <div class="rep">Le résultat est : <span class="case-rep"></span></div>`
    : `<div class="ft">Modèle à obtenir :</div>${fichePiles(item.modele)}`;
  return `
<h2>🏗️ La grue avec variable — ${esc(niv.nom)} <span class="num">— grille n°${item.numero || ""}</span></h2>
<p class="consigne">${esc(consignes[item.mode])}</p>
<div class="corps">
  <div class="gauche"><div class="ft">Départ :</div>${fichePiles(item.piles0, true)}${bas}</div>
  <div class="prog">${ficheBlocs(item.prog, item.mode)}${reserve ? `<div class="reserve">${reserve}</div>` : ""}</div>
</div>`;
}

function ouvrirFiche() { ouvrirOverlay(ficheContenu()); orientation("portrait"); }

// Orientation proposée par la fenêtre d'impression (réglage ajouté après les autres styles, donc prioritaire)
function orientation(sens) {
  let st = $("styleOrientation");
  if (!st) { st = el("style", { id: "styleOrientation" }); document.head.append(st); }
  st.textContent = "@page{size:A4 " + sens + ";margin:" + (sens === "landscape" ? "10mm" : ".8cm") + ";}";
}

function ouvrirOverlay(contenu) {
  let ov = $("overlayFiche");
  if (!ov) {
    const st = document.createElement("style");
    st.textContent = FICHE_CSS;
    document.head.append(st);
    ov = el("div", { id: "overlayFiche" });
    ov.addEventListener("click", e => { if (e.target === ov) fermerFiche(); });
    document.body.append(ov);
  }
  ov.innerHTML = `<div id="ficheCarte">
    <button id="btnFermerFiche" type="button" aria-label="Fermer">×</button>
    <div class="fiche-actions">
      <button type="button" class="principal" id="btnImprimerFiche">🖨️ Imprimer / Enregistrer en PDF</button>
    </div>
    <p class="note-impression">💡 Dans la fenêtre d’impression, décoche <strong>« En-têtes et pieds de page »</strong> et coche <strong>« Graphiques d’arrière-plan »</strong> pour garder les couleurs.</p>
    ${contenu}
  </div>`;
  $("btnFermerFiche").onclick = fermerFiche;
  $("btnImprimerFiche").onclick = () => window.print();
  ov.classList.add("ouverte");
  document.body.classList.add("fiche-ouverte");
}

function fermerFiche() {
  const ov = $("overlayFiche");
  if (ov) ov.classList.remove("ouverte");
  document.body.classList.remove("fiche-ouverte");
}

// ---------- Glisser-déposer (mode prévoir) ----------
function attacherGlisser(piece, val) {
  piece.addEventListener("pointerdown", e => {
    if (e.button > 0 || minuteur) return;
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY, rect = piece.getBoundingClientRect();
    let fantome = null, survol = null;
    const cibleSous = ev => {
      const t = document.elementFromPoint(ev.clientX, ev.clientY);
      return t && t.closest("[data-cible]");
    };
    const bouge = ev => {
      if (!fantome) {
        if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return;
        fantome = piece.cloneNode(true);
        fantome.classList.add("fantome");
        fantome.style.width = rect.width + "px";
        document.body.append(fantome);
      }
      fantome.style.left = (ev.clientX - (x0 - rect.left)) + "px";
      fantome.style.top = (ev.clientY - (y0 - rect.top)) + "px";
      const c = cibleSous(ev);
      if (c !== survol) { survol && survol.classList.remove("survol"); survol = c; c && c.classList.add("survol"); }
    };
    const fin = ev => {
      document.removeEventListener("pointermove", bouge);
      document.removeEventListener("pointerup", fin);
      document.removeEventListener("pointercancel", fin);
      if (!fantome) {
        const c = document.querySelector("[data-cible]");
        if (c) { c.classList.remove("rappel"); void c.offsetWidth; c.classList.add("rappel"); }
        return;
      }
      fantome.remove();
      survol && survol.classList.remove("survol");
      if (ev.type === "pointerup" && cibleSous(ev)) { prediction = val; recommencer(); }
    };
    document.addEventListener("pointermove", bouge);
    document.addEventListener("pointerup", fin);
    document.addEventListener("pointercancel", fin);
  });
}

// ---------- Rendu ----------
function rendu() {
  renduNav();
  if (ws) { ws.dispose(); ws = null; }
  dom = null;
  const s = $("scene");
  s.replaceChildren(); $("colonne").replaceChildren();
  s.className = "scene";
  if (ecran.type === "intro") return renduIntro(s);
  if (ecran.type === "fin") return renduFin(s);

  const niv = NIVEAUX[ecran.n], item = itemCourant();
  s.append(
    el("div", { class: "entete" },
      el("h2", {}, niv.nom, item.numero ? el("span", { class: "numero" }, " — grille n°" + item.numero) : null),
      niv.items.length > 1 ? el("div", { class: "points", id: "points" }) : null
    ),
    el("p", { class: "consigne" }, item.consigne || niv.consigne),
    el("div", { class: "plateau" },
      el("div", { class: "gauche" }, el("div", { class: "var-zone", id: "varZone" }, el("span", { class: "variable", id: "variable" })), el("div", { id: "chantier" }), el("div", { id: "dessous" })),
      el("div", { class: "programme" }, el("div", { id: "blockly" })))
  );

  const libre = ["aller_col", "attraper", "lacher", "mettre_c", "ajouter_c"];
  const defauts = { repeter: { N: "2" }, aller_col: { COL: "1" }, mettre_c: { N: "1" } };
  const bloc = t => defauts[t] ? { kind: "block", type: t, fields: defauts[t] } : { kind: "block", type: t };
  const outils = {
    ecrire: [...libre, "repeter"].concat(JSON.stringify(item.solution || []).includes('"t":"S"') ? ["si_tient"] : []),
    deboguer: [...libre, "repeter", "si_tient"],
    trier: [...libre, "repeter", "si_tient"]
  }[item.mode] || [];
  ws = Blockly.inject("blockly", {
    renderer: "zelos",
    theme: THEME,
    readOnly: item.mode === "prevoir",
    toolbox: outils.length ? { kind: "flyoutToolbox", contents: outils.map(bloc) } : undefined,
    trashcan: outils.length > 0,
    move: { scrollbars: true, drag: true, wheel: true },
    zoom: { startScale: 0.85 }
  });
  Blockly.Events.disable();
  construireProgramme(item);
  Blockly.Events.enable();
  programme = lireProgramme();
  recalculer();
  $("chantier").append(construireChantier(item));
  dessiner(res.frames[0].etats[0], true);
  ws.addChangeListener(ev => {
    if (ev.isUiEvent) return;
    arreter();
    programme = lireProgramme();
    tests = null;
    recalculer();
    dessiner(res.frames[0].etats[0], true);
    majVue();
  });
  majVue();
  ajuster();
  cadrer();
}

// Le programme donné tient en entier dans l'espace Blockly (réduit si besoin, jamais agrandi)
function cadrer() {
  if (!ws || !itemCourant().prog.length) return;
  ws.zoomToFit();
  ws.setScale(Math.max(0.5, Math.min(0.85, ws.scale * 0.95)));
  // calé en haut à gauche
  const c = ws.getBlocksBoundingBox();
  ws.scroll(16 - c.left * ws.scale, 16 - c.top * ws.scale);
}

// Met à jour tout sauf Blockly et le chantier
// Le programme utilise-t-il la variable c ?
const avecVariable = l => l.some(nd => "MI".includes(nd.t) || (nd.t === "S" && nd.c === "c") || (nd.t === "A" && nd.col === "c") || (nd.t === "R" && nd.n === "c") || (nd.corps && avecVariable(nd.corps)));

function majVue() {
  const item = itemCourant();
  majEleve();
  const zone = $("varZone"), cachee = !avecVariable(programme);
  if (zone && zone.classList.contains("cachee") !== cachee) { zone.classList.toggle("cachee", cachee); ajuster(); }
  const pts = $("points");
  if (pts) pts.replaceChildren(...NIVEAUX[ecran.n].items.map((_, k) =>
    el("button", {
      class: "point" + (fait[ecran.n + "-" + k] ? " fait" : "") + (k === ecran.i ? " courant" : ""),
      onclick: () => allerA(ecran.n, k)
    }, String(k + 1))));
  $("dessous").replaceChildren(...renduDessous(item));
  const col = $("colonne");
  col.replaceChildren();
  renduColonne(col, item);
  surligner();
}

// Sous le chantier : le modèle, ou (mode prévoir) la case réponse et les résultats possibles
function renduDessous(item) {
  if (item.mode === "trier") return [el("div", { class: "sous-titre" }, "Chaque caisse va dans la colonne de son numéro.")];
  if (item.mode !== "prevoir") return [el("div", { class: "sous-titre" }, "Modèle à obtenir :"), mini(item.modele, 24)];
  const sl = el("span", { class: "slot" + (prediction ? " rempli" : "") }, prediction || "?");
  if (!minuteur && idx === 0) sl.dataset.cible = "prediction";
  const pal = el("div", { class: "palette" });
  for (const o of item.options) { const pc = el("div", { class: "piece" }, o.l); attacherGlisser(pc, o.l); pal.append(el("div", { class: "option" }, pc, mini(o.piles, item.ncols > 3 ? 11 : 13))); }
  return [
    el("div", { class: "prediction" }, "Le résultat sera :", sl),
    el("div", { class: "propositions" }, el("div", { class: "sous-titre" }, "Résultats possibles :"), pal)
  ];
}

function surligner() {
  if (!ws) return;
  ws.highlightBlock(null);
  const f = fini() ? res.frames[idx] : pret() && demarre() ? res.frames[idx + 1] : null;
  if (f) f.ids.forEach(id => id && ws.highlightBlock(id, true));
  // pendant l'exécution, le bloc en cours reste visible
  const b = f && idx > 0 && f.ids[0] && ws.getBlockById(f.ids[0]);
  if (b && ws.scrollBoundsIntoView) ws.scrollBoundsIntoView((b.getBoundingRectangleWithoutChildren || b.getBoundingRectangle).call(b));
}

function renduColonne(col, item) {
  const cmd = el("aside", {}, el("h3", {}, "▶ Programme"));
  const ok = pret();
  for (const pb of problemes()) cmd.append(el("p", { class: "aide" }, pb));
  const rec = record(item), nb = compter(programme);
  const k = ecran.n + "-" + ecran.i;
  cmd.append(el("div", { class: "points-ex" }, el("span", {}, "⭐ Points de l’exercice"), el("b", {}, fmt(eleve.notes[k] || 0) + " / " + BAREME[item.mode])));
  if (rec) cmd.append(el("div", { class: "nb-blocs" }, el("span", {}, "🧱 Blocs : ", el("b", {}, String(nb))), el("span", {}, "🏆 Record : ", el("b", {}, String(rec)))));
  const prevoir = item.mode === "prevoir";
  const lancerB = el("button", { class: "suite", onclick: () => lancer(false) }, "▶ Lancer");
  const pasB = el("button", { class: "second", onclick: () => lancer(true) }, "⏭ Pas à pas");
  const recB = el("button", { class: "second", onclick: recommencer }, "↺ Remettre au départ");
  if (!ok || minuteur || res.frames.length < 2) { lancerB.disabled = true; pasB.disabled = true; }
  if (idx === 0 && !minuteur) recB.disabled = true;
  const boutons = el("div", { class: "boutons" }, lancerB, pasB, recB);
  if (item.genere) {
    boutons.append(el("button", { class: "second", onclick: () => allerA(ecran.n, ecran.i) }, "🎲 Nouvelle grille"));
    boutons.append(el("button", { class: "second", onclick: ouvrirFiche }, "🖨 Fiche papier"));
  }
  cmd.append(boutons);

  if (fini() && !minuteur) {
    if (reussite()) {
      const r = el("div", { class: "retour ok" }, prevoir
        ? "✅ Bien prévu : c’est le résultat " + item.reponse + " !"
        : item.mode === "trier" ? "✅ Cette pile est rangée !" : "✅ Bravo ! C’est le modèle.");
      if (rec) r.append(el("br"), nb > rec ? "Mais on peut le faire en " + rec + " blocs : essaie de réduire !"
        : nb < rec ? "🏆 Record battu : " + nb + " blocs !" : "🏆 Record égalé !");
      if (item.mode === "trier" && nb === rec) r.append(el("br"), "🧠 Défi expert : on peut le faire en 9 blocs !");
      // points perdus à cause des essais ratés : comment les récupérer
      if (echecs && prevoir) r.append(el("br"), "Pas de point : ta première prévision était fausse. Prends une 🎲 nouvelle grille !");
      else if (echecs && item.mode !== "prevoir") r.append(el("br"), "½ point seulement : il y a eu des essais ratés. Réussis du premier coup sur une 🎲 nouvelle grille !");
      const dernier = ecran.n === NIVEAUX.length - 1 && ecran.i === NIVEAUX[ecran.n].items.length - 1;
      const suiteB = el("div", { style: "margin-top:10px" }, el("button", { class: "suite", onclick: suivant }, dernier ? "Terminer →" : "Suite →"));
      // tri : avant la suite, le programme doit marcher avec d'autres piles
      if (item.mode === "trier" && !tests) cmd.append(r, el("div", { class: "bilan" },
        el("div", { class: "question" }, "🤔 Et avec une autre pile de caisses ?"),
        el("div", { style: "margin-top:8px" }, el("button", { class: "suite", onclick: testerPiles }, "🧪 Tester d’autres piles"))));
      else if (item.mode === "trier" && tests.some(t => !t.ok)) cmd.append(r);
      else cmd.append(r, suiteB);
    } else {
      const msg = {
        sortie: "💥 Cette colonne n’existe pas !",
        sansValeur: "❌ c n’a pas encore de valeur !",
        vide: "❌ Rien à attraper : la pile était vide !",
        pleine: "❌ La pince tenait déjà une caisse !",
        rien: "❌ La pince était vide : rien à lâcher !",
        haut: "❌ La pile est trop haute !",
        long: "🔁 Le programme ne s’arrête pas !"
      }[res.fin] || (res.tient !== null ? "❌ La grue tient encore une caisse !"
        : prevoir ? "❌ Le résultat est " + item.reponse + ", pas " + prediction + "."
        : item.mode === "trier" ? "❌ Les caisses ne sont pas bien rangées." : "❌ Ce n’est pas le modèle.");
      cmd.append(el("div", { class: "retour ko" }, msg, " ", prevoir ? "Relis le programme pas à pas." : "Corrige le programme et relance."));
    }
  }
  if (item.mode === "trier" && tests && !minuteur) {
    const ok = tests.filter(t => t.ok).length, rates = tests.filter(t => !t.ok);
    const b = el("div", { class: "bilan" + (rates.length ? " rate" : "") },
      el("div", { class: "question" }, rates.length
        ? "🧪 Piles réussies : " + ok + " sur " + tests.length + ". Ton programme ne marche pas pour toutes les piles !"
        : "🧪 " + ok + " piles sur " + tests.length + " : ton programme marche à tous les coups ! 🏆"));
    if (rates.length) {
      b.append(el("div", { class: "aide", style: "margin:6px 0" }, "Clique sur une pile ratée pour la charger :"));
      const l = el("div", { class: "rates" });
      for (const t of rates.slice(0, 6)) l.append(el("button", { class: "pile-ratee", title: "Charger cette pile", onclick: () => chargerPile(t.pile) }, mini([t.pile], 12)));
      b.append(l);
    }
    cmd.append(b);
  }
  col.append(cmd);

  // Le raisonnement : l'étape à venir, ou la dernière jouée à la fin
  const demo = el("aside", {}, el("h3", {}, "🧠 Le raisonnement de la grue"));
  const avenir = !fini() && ok && demarre() ? res.frames[idx + 1] : null;
  const f = avenir || (fini() ? res.frames[idx] : null);
  if (!f) demo.append(el("p", { class: "aide" }, "La grue lit le programme bloc par bloc, dans l’ordre."));
  else {
    demo.append(el("div", { class: "compteur" }, "Étape n°" + (avenir ? idx + 1 : idx) + (avenir ? " — ce que la grue va faire" : "") + (f.j.tour ? " · " + f.j.tour : "")));
    // Sans « si », pas de raisonnement : la grue exécute simplement l'instruction
    if (!f.cond) {
      const erreur = /^[❌💥]/u.test(f.j.donc);
      demo.append(el("div", { class: "demo" },
        el("div", { class: "m m-regle" }, el("b", {}, "Instruction"), f.j.regle.replace(/\.$/, "")),
        erreur && !avenir ? el("div", { class: "retour ko" }, f.j.donc) : null));
    } else demo.append(
      el("div", { class: "demo" },
        el("div", { class: "m m-sais" }, el("b", {}, "Je sais que…"), f.j.sais),
        el("div", { class: "fl" }, "↓"),
        el("div", { class: "m m-regle" }, el("b", {}, "Le programme dit…"), f.j.regle),
        el("div", { class: "fl" }, "↓"),
        el("div", { class: "m m-donc" }, el("b", {}, "Donc…"), f.j.donc)));
  }
  col.append(demo);
}

function renduIntro(s) {
  s.classList.add("intro");
  s.append(
    el("h2", {}, "La grue range les caisses 🏗️"),
    el("p", {}, "La grue ne réfléchit pas toute seule : elle suit le programme, bloc par bloc."),
    el("p", {}, "Elle sait faire 3 choses :"),
    el("ol", { class: "etapes" },
      el("li", {}, "aller en colonne 1, 2, 3… ;"),
      el("li", {}, "attraper la caisse du dessus ;"),
      el("li", {}, "lâcher la caisse sur la pile.")
    ),
    el("p", {}, "Elle a aussi une mémoire : la variable c. C’est un nombre qu’on peut changer."),
    el("p", {}, "« aller en colonne c » : la grue va dans la colonne qui porte le numéro c."),
    el("p", {}, "Chaque exercice rapporte des points. Tu peux le refaire : seule ta meilleure note compte. Vise 20/20 !")
  );
  const champ = el("input", { id: "champNom", type: "text", autocomplete: "off", placeholder: "Prénom Nom", maxlength: "40" });
  // champ toujours vide à l'accueil : chaque élève tape son nom (le même nom retrouve sa note)
  const erreur = el("span", { class: "erreur-numero" });
  const commencer = () => {
    const nom = champ.value.trim().replace(/\s+/g, " ");
    if (nom.length < 2) { erreur.textContent = "Écris ton prénom et ton nom."; champ.focus(); return; }
    // nouvel élève sur ce poste : on repart de zéro
    if (nom !== eleve.nom) {
      eleve = enregistre && enregistre.nom === nom ? enregistre : { nom, notes: {} };
      enregistre = eleve;
      fait = {};
      sauverEleve();
    }
    allerA(0, 0);
  };
  champ.addEventListener("keydown", e => { if (e.key === "Enter") commencer(); });
  s.append(
    el("label", { class: "nom-eleve", for: "champNom" }, "Ton prénom et ton nom (pour le diplôme) :", champ, erreur),
    el("div", { class: "actions" }, el("button", { class: "suite", onclick: commencer }, "Commencer →"))
  );
  setTimeout(() => champ.focus(), 0);
}

// Premier exercice où il manque des points (pour améliorer sa note)
function exerciceAAmeliorer() {
  for (let n = 0; n < NIVEAUX.length; n++)
    for (let i = 0; i < NIVEAUX[n].items.length; i++)
      if ((eleve.notes[n + "-" + i] || 0) < BAREME[NIVEAUX[n].items[i].mode]) return [n, i];
  return null;
}

function renduFin(s) {
  if (!eleve.nom) { ecran = { type: "intro" }; return renduIntro(s); }
  const note = noteTotale(), max = noteMax(), a = exerciceAAmeliorer();
  s.append(
    el("h2", {}, "🏆 Bravo " + eleve.nom + " !"),
    el("p", {}, "Tu as écrit des programmes et la grue les a suivis à la lettre."),
    el("p", {}, "Avec une variable, un même bloc « aller en colonne c » peut envoyer la grue à des endroits différents."),
    el("p", { style: "font-size:1.4rem;font-weight:700" }, "📝 Ta note : " + fmt(note) + " / " + max),
    a ? el("p", {}, "Il te manque des points : refais les exercices pour viser " + max + "/" + max + " !") : el("p", {}, "🌟 Note parfaite !"),
    el("div", { class: "actions", style: "gap:10px" },
      a ? el("button", { class: "second", style: "width:auto", onclick: () => allerA(a[0], a[1]) }, "↺ Améliorer ma note") : null,
      el("button", { class: "suite", onclick: ouvrirDiplome }, "🎓 Mon diplôme"))
  );
}

// ---------- Diplôme ----------
function mention(note, max) {
  const x = note / max * 20;
  return x >= 20 ? "Félicitations !" : x >= 16 ? "Très bien" : x >= 14 ? "Bien" : x >= 12 ? "Assez bien" : x >= 10 ? "Réussi" : "Continue tes efforts";
}
function diplomeContenu() {
  const note = noteTotale(), max = noteMax();
  const date = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  // une médaille par niveau, avec ses étoiles (une par point entier)
  const medailles = NIVEAUX.map((niv, n) => {
    const pts = niv.items.reduce((t, _, i) => t + (eleve.notes[n + "-" + i] || 0), 0);
    const m = niv.items.reduce((t, it) => t + BAREME[it.mode], 0);
    const etoiles = Array.from({ length: m }, (_, k) => `<span class="${k < Math.floor(pts) ? "pleine" : ""}">★</span>`).join("");
    return `<div class="d-med${pts >= m ? " complete" : ""}"><div class="d-med-nom">${esc(niv.nom.replace(/^\d+\.\s*/, ""))}</div><div class="d-med-pts">${fmt(pts)} / ${m}</div><div class="d-etoiles">${etoiles}</div></div>`;
  }).join("");
  // sceau doré : cercle festonné, rubans, note au centre
  const festons = Array.from({ length: 48 }, (_, k) => {
    const a = k / 48 * 2 * Math.PI, r = k % 2 ? 44 : 48;
    return (k ? "L" : "M") + (50 + r * Math.cos(a)).toFixed(2) + " " + (50 + r * Math.sin(a)).toFixed(2);
  }).join(" ") + "Z";
  const sceau = `<svg class="d-sceau" viewBox="0 0 100 130" aria-hidden="true">
    <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e08a"/><stop offset=".5" stop-color="#d4a62a"/><stop offset="1" stop-color="#a87a12"/></linearGradient></defs>
    <path d="M30 80 L18 128 L32 118 L40 130 L48 86 Z" fill="#1d3b8f"/><path d="M70 80 L82 128 L68 118 L60 130 L52 86 Z" fill="#1d3b8f"/>
    <path d="${festons}" fill="url(#or)" stroke="#a87a12" stroke-width="1"/>
    <circle cx="50" cy="50" r="36" fill="#fffaf0" stroke="#c9a227" stroke-width="2"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="#c9a227" stroke-width=".8" stroke-dasharray="2 2"/>
    <text x="50" y="50" text-anchor="middle" class="d-sceau-note">${fmt(note)}</text>
    <text x="50" y="66" text-anchor="middle" class="d-sceau-sur">sur ${max}</text>
  </svg>`;
  // la grue et sa caisse
  const grue = `<svg class="d-grue" viewBox="0 0 120 110" aria-hidden="true">
    <g stroke="#1d3b8f" stroke-width="2.2" fill="none" stroke-linejoin="round">
      <path d="M22 106 V14 M34 106 V14 M22 14 H34"/>
      ${Array.from({ length: 7 }, (_, k) => `<path d="M22 ${106 - k * 13} L34 ${93 - k * 13} M34 ${106 - k * 13} L22 ${93 - k * 13}"/>`).join("")}
      <path d="M8 14 H112 M8 22 H112 M28 4 L8 14 M28 4 L112 14"/>
      ${Array.from({ length: 9 }, (_, k) => `<path d="M${40 + k * 8} 14 L${44 + k * 8} 22"/>`).join("")}
      <path d="M96 22 V58" stroke-width="1.4"/>
    </g>
    <rect x="4" y="14" width="12" height="12" fill="#c9a227"/>
    <rect x="12" y="102" width="32" height="6" fill="#1d3b8f"/>
    <rect x="84" y="58" width="24" height="24" rx="2" fill="#e0473a" stroke="#1d3b8f" stroke-width="1.5"/>
    <text x="96" y="76" text-anchor="middle" font-size="14">🍎</text>
  </svg>`;
  const coin = `<svg class="d-coin" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 38 V2 H38" fill="none" stroke="#c9a227" stroke-width="2"/><path d="M8 38 V8 H38" fill="none" stroke="#1d3b8f" stroke-width="1"/><rect x="11" y="11" width="8" height="8" transform="rotate(45 15 15)" fill="#c9a227"/></svg>`;
  const caisses = ["r", "b", "g", "y", "r", "b", "g", "y", "r", "b", "g", "y"].map(c => `<span style="background:${COUL[c].hex}">${COUL[c].emo}</span>`).join("");
  return `<div class="diplome">
  <div class="d-cadre">
    ${["hg", "hd", "bg", "bd"].map(p => `<div class="d-c ${p}">${coin}</div>`).join("")}
    ${grue}
    <div class="d-titre">Diplôme</div>
    <div class="d-sous">de programmation · <b>La grue avec variable</b></div>
    <div class="d-milieu">
      <div class="d-texte">
        <div class="d-decerne">Ce diplôme est décerné à</div>
        <div class="d-nom">${esc(eleve.nom || "……………………")}</div>
        <div class="d-pour">pour avoir programmé une grue avec des boucles, des conditions et une variable.</div>
        <div class="d-mention">${mention(note, max)}</div>
      </div>
      ${sceau}
    </div>
    <div class="d-meds">${medailles}</div>
    <div class="d-bas"><div>Fait le ${date}</div><div class="d-signature">Signature du professeur</div></div>
    <div class="d-frise">${caisses}</div>
  </div>
</div>`;
}
// Le diplôme garde sa taille A4 (paysage) ; à l'écran, il est réduit pour tenir dans la fenêtre
function ouvrirDiplome() {
  // pas de diplôme sans nom : retour à l'accueil pour l'écrire
  if (!eleve.nom) { fermerFiche(); arreter(); ecran = { type: "intro" }; rendu(); return; }
  ouvrirOverlay(diplomeContenu());
  orientation("landscape");
  $("ficheCarte").classList.add("large");
  const d = document.querySelector("#overlayFiche .diplome");
  const carte = getComputedStyle(d.parentElement);
  const place = d.parentElement.clientWidth - parseFloat(carte.paddingLeft) - parseFloat(carte.paddingRight);
  const r = d.getBoundingClientRect();            // taille réelle affichée (zoom compris)
  const e = Math.min(1, place / r.width);
  d.style.transform = "scale(" + e + ")";
  d.style.marginBottom = -(1 - e) * r.height / 0.95 + "px";
  d.style.marginRight = -(1 - e) * r.width / 0.95 + "px";
}

function majEleve() {
  const info = $("eleveInfo");
  info.replaceChildren(...(eleve.nom ? ["👤 " + eleve.nom, el("span", { class: "note" }, "📝 " + fmt(noteTotale()) + " / " + noteMax())] : []));
  $("btnDiplome").style.display = eleve.nom ? "" : "none";
}

function renduNav() {
  majEleve();
  $("nav").replaceChildren(...NIVEAUX.map((niv, n) =>
    el("button", { class: "tab" + (ecran.type === "item" && ecran.n === n ? " actif" : ""), onclick: () => allerA(n, 0) }, niv.nom)));
}

// Aller directement à une grille à partir de son numéro (celui de la fiche papier)
$("allerNumero").addEventListener("submit", ev => {
  ev.preventDefault();
  const v = $("champNumero").value.trim(), code = parseInt(v, 10);
  const n = Math.floor(code / 10000) - 1, i = Math.floor(code / 1000) % 10 - 1;
  const it = /^\d{5}$/.test(v) && NIVEAUX[n] && NIVEAUX[n].items[i];
  if (!it || !it.genere) { $("erreurNumero").textContent = "Numéro inconnu"; return; }
  $("erreurNumero").textContent = "";
  $("champNumero").value = "";
  allerA(n, i, code);
});
// Le chantier se met à l'échelle de la place disponible (jamais plus grand que nature)
const PETIT = window.matchMedia("(max-width:900px), (max-height:560px)");
function ajuster() {
  const w = $("chantier");
  if (w && dom) {
    w.style.height = "";
    const W = dom.ch.offsetWidth, H = dom.ch.offsetHeight;
    const largeur = w.closest(".plateau").clientWidth * (PETIT.matches ? 1 : 0.42);
    const e = Math.max(0.4, Math.min(1, largeur / W, PETIT.matches ? 1 : w.clientHeight / H));
    dom.ch.style.transform = "scale(" + e + ")";
    w.style.width = W * e + "px";
    $("varZone").style.width = W * e + "px";
    w.style.height = PETIT.matches ? H * e + "px" : "";
  }
  if (ws) Blockly.svgResize(ws);
}
window.addEventListener("resize", () => { ajuster(); cadrer(); });
$("onglet").onclick = () => window.open(location.href, "_blank");
$("btnDiplome").onclick = ouvrirDiplome;
rendu();
})();
</script>
