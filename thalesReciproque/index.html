<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réciproque et contraposée de Thalès</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#d8dee9;
  --accent:#2f6fde; --orange:#e67e22; --ok:#1f9d55; --ko:#d64545;
  --shadow:0 2px 8px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:260px 1fr 440px;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.panneau{background:linear-gradient(180deg,#dfe8fb,#cfdcf8);border:1px solid #c3d2f3;border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.panneau h1{font-size:1.25rem;margin:0}
.section{display:flex;flex-direction:column;gap:8px}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#3a5ba8;margin:0}
.ligne{display:flex;gap:6px}
.ligne .btn{flex:1;padding:10px 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;box-shadow:var(--shadow);font-weight:600}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#bHasard{flex:0 0 52px;font-size:1.2rem}
#bHasard.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
#bOrdre.on{background:var(--ok);border-color:var(--ok);color:#fff}
#bOrdre:disabled{opacity:.45;cursor:default}
#bBougerN.on{background:var(--orange);border-color:var(--orange);color:#fff}
#bRapports.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sansRapports .rapports{visibility:hidden}   /* place gardée : les longueurs ne bougent pas */
#bCorrection.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.principal{display:flex;flex-direction:column;min-height:0;min-width:0}
#stage{flex:1;min-height:260px;touch-action:none;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
#ggb{position:absolute;inset:0}
#ggb .GeoGebraFrame{border:none!important;outline:none!important;box-shadow:none!important}
#chargement{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.bandeau{display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0;background:#f3eefe;border:1px solid #d9ccfb;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;font-size:1.1rem}
/* colonnes de largeur fixe : rien ne bouge quand les valeurs changent (glisser N) */
.donnees{display:grid;grid-template-columns:auto auto;gap:4px 28px;font-weight:600;white-space:nowrap;align-items:center;font-variant-numeric:tabular-nums;column-gap:24px;justify-content:start}
.donnees .longueurs{display:grid;grid-template-columns:auto auto 2.2em auto;gap:4px 5px;align-items:center;justify-content:start}
.donnees .longueurs .v{text-align:right}
.donnees .rapports{display:grid;grid-template-columns:auto auto 3.4em 5.4em;gap:12px 6px;align-items:center;justify-content:start;font-size:1.05em}
.donnees .rapports .frac{justify-self:center}
.donnees .q{grid-column:1/-1;color:var(--accent);margin-top:4px;white-space:normal}
.correction{display:flex;flex-direction:column;gap:8px;border-top:3px solid #d9ccfb;padding-top:14px}
.correction p{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.correction .accolade{display:flex;align-items:stretch;gap:8px}
.correction .accolade .bout{align-self:center;display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;flex:none}
.correction .accolade svg{width:12px;flex:none}
.correction .accolade .lignes{display:flex;flex-direction:column;gap:8px}
.correction .conclu{font-weight:700}
.correction .vrai{color:var(--ok)} .correction .faux{color:var(--ko)}
.cache{display:none!important}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.95em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.bleu{color:var(--accent);font-weight:700} .orange{color:var(--orange);font-weight:700}
/* écran moyen : données et correction passent sous la figure */
@media (max-width:1100px){
  .app{grid-template-columns:240px 1fr;grid-template-rows:1fr auto}
  .bandeau{grid-column:2;max-height:45vh}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding:8px}
  .bandeau{grid-column:1}
  .panneau{gap:8px;padding:10px}
  .panneau h1,.section h2{display:none}
  .bandeau{font-size:1rem}
}
#voileOnglet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;z-index:50;text-align:center}
#voileOnglet .titre{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:700;margin:0}
#voileOnglet a{display:flex;align-items:center;justify-content:center;width:min(900px,100%);min-height:min(45vh,320px);padding:24px;border-radius:28px;background:var(--accent);color:#fff;text-decoration:none;font-size:clamp(2rem,7vw,4.5rem);font-weight:800;box-shadow:0 8px 24px rgba(47,111,222,.35)}
</style>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
<div class="app">
  <aside class="panneau">
    <h1>Réciproque et contraposée de Thalès</h1>
    <div class="section">
      <h2>Figure</h2>
      <div class="ligne">
        <button class="btn" id="bEgaux">Rapports égaux</button>
        <button class="btn" id="bInegaux">Rapports inégaux</button>
        <button class="btn" id="bHasard" title="Au hasard, sans le dire">?</button>
      </div>
      <button class="btn on" id="bOrdre" aria-pressed="true">Alignés dans le même ordre</button>
      <div class="ligne">
        <button class="btn" id="bAutre">↻ Autre figure</button>
        <button class="btn" id="bMelanger" title="Mêmes longueurs, points placés autrement">🔀 Mélanger</button>
      </div>
      <button class="btn" id="bBougerN" aria-pressed="false">✋ Déplacer N</button>
    </div>
    <div class="section">
      <h2>Correction</h2>
      <button class="btn" id="bSens" title="Sens des rapports, comme dans le cours">Rapports : AM/AB</button>
      <button class="btn on" id="bRapports" aria-pressed="true">Rapports affichés</button>
      <button class="btn" id="bParallele" aria-pressed="false">Parallèle à (BC) par M</button>
      <button class="btn" id="bCorrection" aria-pressed="false">Correction</button>
    </div>
  </aside>
  <main class="principal">
    <div id="stage">
      <div id="chargement">Chargement de GeoGebra…</div>
      <div id="ggb"></div>
    </div>
  </main>
  <aside class="bandeau">
    <div class="donnees" id="donnees"></div>
    <div class="correction cache" id="correction"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
let api = null;
const etat = { mode: 'egaux', memeOrdre: true, parallele: false, correction: false, fig: null, px: 20, bougerN: false, rapports: true, inverse: false, k: 0.05 };

/* ================= Tirage de la figure =================
   Deux droites sécantes en A ; B sur la 1re, C sur la 2de.
   M = A + kM·AB et N = A + kN·AC (en vecteurs).
   Même ordre : kN de même signe que kM (kN = kM si rapports égaux).
   Pas le même ordre : kN = −kM (ou −k' si rapports inégaux).
   « Mélanger » : mêmes longueurs, mais B, C, M, N passent au hasard d'un côté ou de l'autre de A. */
const hasard = t => t[Math.floor(Math.random() * t.length)];
const alea = (a, b) => a + Math.random() * (b - a);
const r2 = x => Math.round(x * 100) / 100;
const fr = x => String(r2(x)).replace('.', ',');
// valeur d'un quotient : exacte si elle a au plus 4 décimales, sinon arrondie au millième
const valeur = q => {
  const d = [0, 1, 2, 3, 4].find(n => Math.abs(q * 10 ** n - Math.round(q * 10 ** n)) < 1e-9);
  return d === undefined ? `≈ ${String(Math.round(q * 1000) / 1000).replace('.', ',')}`
                         : `= ${String(Math.round(q * 10 ** d) / 10 ** d).replace('.', ',')}`;
};

function tirer() {
  let mode = etat.mode, meme = etat.memeOrdre;
  if (mode === 'hasard') {
    [mode, meme] = hasard([['egaux', true], ['egaux', true], ['inegaux', true], ['inegaux', false], ['egaux', false], ['egaux', false]]);
  }
  const AB = hasard([4, 5, 6, 8]);
  const AC = hasard([4, 5, 6, 8, 10].filter(x => x !== AB));
  const k = hasard([
    ...[0.4, 0.5, 0.6, 0.75, 0.8],          // M entre A et B
    ...[1.2, 1.25, 1.5, 1.6],               // B entre A et M
    ...[-0.4, -0.5, -0.6, -0.75, -0.8],     // A entre M et B (papillon)
  ]);
  let k2 = k;
  if (mode === 'inegaux') {
    // rapport voisin mais différent : l'œil ne suffit pas, il faut calculer
    const ok = [0.05, -0.05, 0.1, -0.1, 0.15, -0.15].map(d => r2(Math.abs(k) + d))
      .filter(v => v > 0.25 && Math.abs(v - 1) > 0.08 && v < 2.2);
    k2 = Math.sign(k) * hasard(ok);
  }
  const kM = k, kN = meme ? k2 : -k2;
  // directions des deux droites : tirées une seule fois, les sécantes ne changent plus ensuite
  if (!etat.droites) {
    const t1 = alea(-20, 20) * Math.PI / 180, t2 = t1 + alea(35, 65) * Math.PI / 180 * hasard([1, -1]);
    etat.droites = { u1: [Math.cos(t1), Math.sin(t1)], u2: [Math.cos(t2), Math.sin(t2)] };
  }
  const { u1, u2 } = etat.droites;
  const A = [0, 0];
  const P = (s, u, L) => [A[0] + s * L * u[0], A[1] + s * L * u[1]];
  etat.fig = { mode, meme, AB, AC, kM, kN, u1, u2, sB: 1, sC: 1,
    pts: { A, B: P(1, u1, AB), C: P(1, u2, AC), M: P(kM, u1, AB), N: P(kN, u2, AC) },
    AM: r2(Math.abs(kM) * AB), AN: r2(Math.abs(kN) * AC) };
}

/* ================= GeoGebra ================= */
const NOMS = ['A', 'B', 'C', 'M', 'N'];
function construire() {
  const cmd = c => api.evalCommand(c);
  NOMS.forEach(n => cmd(`${n}=(0,0)`));
  cmd('d1=Line(A,B)'); cmd('d2=Line(A,C)');
  cmd('sBC=Segment(B,C)'); cmd('sMN=Segment(M,N)');
  cmd('par=Line(M,Vector(B,C))');
  NOMS.forEach(n => cmd(`t${n}=Text("${n}",(0,0))`));
  ['d1', 'd2'].forEach(n => { api.setColor(n, 152, 162, 179); api.setLineThickness(n, 4); api.setLayer(n, 0); });
  api.setColor('sBC', 47, 111, 222); api.setLineThickness('sBC', 8);
  api.setColor('sMN', 230, 126, 34); api.setLineThickness('sMN', 8);
  api.setColor('par', 47, 111, 222); api.setLineStyle('par', 1); api.setLineThickness('par', 4); api.setLayer('par', 0);
  NOMS.forEach(n => {
    api.setPointSize(n, 5); api.setColor(n, 29, 36, 51); api.setLabelVisible(n, false); api.setFixed(n, true, false);
    api.setFixed(`t${n}`, true, false); api.setColor(`t${n}`, 29, 36, 51);
  });
  ['d1', 'd2', 'sBC', 'sMN', 'par'].forEach(n => { api.setLabelVisible(n, false); api.setFixed(n, true, false); });
  api.setAxesVisible(false, false);
  api.setGridVisible(false);
}

function poser() {
  const f = etat.fig;
  NOMS.forEach(n => api.evalCommand(`${n}=(${f.pts[n][0]},${f.pts[n][1]})`));   // points fixes : on les redéfinit
  styleN();
  api.setVisible('par', etat.parallele);
  cadrer();
}

/* Mode « Déplacer N » : on fait glisser N sur la droite (AC) — glisser programmé par nous
   (GeoGebra ne réagit pas toujours). AN est arrondi au millimètre ; rapport, ordre et correction suivent. */
function styleN() {
  if (etat.bougerN) { api.setPointSize('N', 8); api.setColor('N', 230, 126, 34); }
  else { api.setPointSize('N', 5); api.setColor('N', 29, 36, 51); }
}
function versMonde(e) {   // position de la souris → coordonnées GeoGebra
  const c = document.querySelector('#ggb canvas').getBoundingClientRect(), v = JSON.parse(api.getViewProperties());
  return [v.xMin + (e.clientX - c.left) * v.width / c.width * v.invXscale,
          v.yMin + (c.bottom - e.clientY) * v.height / c.height * v.invYscale];
}
function presDeN(e) {
  const [x, y] = versMonde(e), N = etat.fig.pts.N;
  return Math.hypot(x - N[0], y - N[1]) / etat.k < 30;   // à moins de 30 pixels
}
function placerN(e) {
  const f = etat.fig, [x, y] = versMonde(e);
  let s = Math.round((x * f.u2[0] + y * f.u2[1]) * 10) / 10;   // AN algébrique, au millimètre
  if (s === 0) s = 0.1;                                         // N ne doit pas venir sur A
  const kN = s / (f.sC * f.AC);
  if (kN === f.kN) return;
  f.kN = kN; f.AN = r2(Math.abs(s));
  f.pts.N = [s * f.u2[0], s * f.u2[1]];
  f.meme = Math.sign(kN) === Math.sign(f.kM); etat.memeOrdre = f.meme;
  api.evalCommand(`N=(${f.pts.N[0]},${f.pts.N[1]})`); styleN(); api.setFixed('N', true, false); api.setLabelVisible('N', false);
  textes(); majBoutons(); etiquettes(etat.k);
}
let glisse = false;
const stage = $('stage');
stage.addEventListener('pointerdown', e => {
  if (!api || !etat.bougerN || !presDeN(e)) return;
  e.preventDefault(); e.stopPropagation();
  glisse = true; stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing';
}, { capture: true });
stage.addEventListener('pointermove', e => {
  if (glisse) { e.preventDefault(); e.stopPropagation(); placerN(e); return; }
  if (api && etat.bougerN) stage.style.cursor = presDeN(e) ? 'grab' : '';
}, { capture: true });
['pointerup', 'pointercancel'].forEach(t => stage.addEventListener(t, e => {
  if (!glisse) return;
  glisse = false; stage.style.cursor = presDeN(e) ? 'grab' : '';
}, { capture: true }));

function cadrer() {
  if (!api || !etat.fig) return;
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  api.setSize(w, h);
  const P = Object.values(etat.fig.pts);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  // A au centre du cadre : on prend l'écart le plus grand de chaque côté de A
  const [ax, ay] = etat.fig.pts.A;
  const ex = Math.max(...xs.map(x => Math.abs(x - ax))), ey = Math.max(...ys.map(y => Math.abs(y - ay)));
  const ech = Math.min(0.86 * w / (2 * ex || 1), 0.8 * h / (2 * ey || 1));
  const cx = ax, cy = ay, dx = w / ech / 2, dy = h / ech / 2;
  api.setCoordSystem(cx - dx, cx + dx, cy - dy, cy + dy);
  etat.px = Math.round(Math.max(18, Math.min(34, Math.min(w, h) / 20)));
  NOMS.forEach(n => api.setFont(`t${n}`, etat.px, true, false, false));
  etat.k = 1 / ech;
  etiquettes(etat.k);
}

/* Noms des points, placés à la main (en pixels) loin des segments */
function etiquettes(k) {
  const f = etat.fig, p = f.pts;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1], sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const perp = u => [-u[1], u[0]];
  const loin = (Q, u, autre) => { const n = perp(u), s = Math.sign(dot(n, sub(autre, p.A))) || 1; return [-s * n[0], -s * n[1]]; };
  // A : au milieu du plus grand angle libre entre les demi-droites utilisées
  const rayons = [p.B, p.C, p.M, p.N]
    .map(u => Math.atan2(u[1] - p.A[1], u[0] - p.A[0])).sort((a, b) => a - b);
  let best = 0, dirA = 0;
  rayons.forEach((a, i) => {
    const b = i + 1 < rayons.length ? rayons[i + 1] : rayons[0] + 2 * Math.PI;
    if (b - a > best) { best = b - a; dirA = (a + b) / 2; }
  });
  const dirs = {
    A: [Math.cos(dirA), Math.sin(dirA)],
    B: loin(p.B, f.u1, p.C), M: loin(p.M, f.u1, p.N),
    C: loin(p.C, f.u2, p.B), N: loin(p.N, f.u2, p.M),
  };
  const r = etat.px * 1.05 * k;
  NOMS.forEach(n => {
    const [x, y] = p[n], [dx, dy] = dirs[n];
    // un texte GeoGebra s'accroche par son coin bas-gauche : on le recentre
    api.evalCommand(`t${n}=Text("${n}",(${x + r * dx - 0.36 * etat.px * k},${y + r * dy - 0.4 * etat.px * k}))`);
    api.setFont(`t${n}`, etat.px, true, false, false); api.setColor(`t${n}`, 29, 36, 51); api.setFixed(`t${n}`, true, false);
  });
}

/* ================= Textes ================= */
// accolade fermante, à droite des deux rapports ; la comparaison s'écrit à sa pointe
const ACCOLADE = `<svg viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path d="M1,1 C6,1 6,5 6,14 L6,40 C6,47 8,50 11,50 C8,50 6,53 6,60 L6,86 C6,95 6,99 1,99" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function ordre(s, nP, nQ) {   // points A (0), Q (1), P (s) d'une droite, dans l'ordre
  return [['A', 0], [nQ, 1], [nP, s]].sort((a, b) => a[1] - b[1]).map(x => x[0]).join(', ');
}
function textes() {
  const f = etat.fig;
  // rapports écrits AM/AB ou AB/AM, selon le cours (bouton)
  const ra = etat.inverse ? ['AB', 'AM', f.AB, f.AM] : ['AM', 'AB', f.AM, f.AB];
  const rb = etat.inverse ? ['AC', 'AN', f.AC, f.AN] : ['AN', 'AC', f.AN, f.AC];
  const nom = r => frac(r[0], r[1]), nb = r => frac(fr(r[2]), fr(r[3])), val = r => valeur(r[2] / r[3]);
  $('donnees').innerHTML = `
    <div class="longueurs">${[['AB', f.AB], ['AC', f.AC], ['AM', f.AM], ['AN', f.AN]].map(([n, x]) =>
      `<span>${n}</span><span>=</span><span class="v">${fr(x)}</span><span>cm</span>`).join('')}</div>
    <div class="rapports">
      ${nom(ra)}<span>=</span>${nb(ra)}<span>${val(ra)}</span>
      ${nom(rb)}<span>=</span>${nb(rb)}<span>${val(rb)}</span>
    </div>
    <div class="q">(<span class="orange">MN</span>) et (<span class="bleu">BC</span>) sont-elles parallèles ?</div>`;
  const egaux = Math.abs(f.AM * f.AC - f.AN * f.AB) < 1e-9;
  const o1 = ordre(f.kM, 'M', 'B'), o2 = ordre(f.kN, 'N', 'C');
  let html = `<p><b>Les droites (BM) et (CN) sont sécantes en A.</b></p>
    <div class="accolade"><div class="lignes"><p>${nom(ra)} = ${nb(ra)} ${val(ra)}</p><p>${nom(rb)} = ${nb(rb)} ${val(rb)}</p></div>${ACCOLADE}
      <div class="bout">${nom(ra)} ${egaux ? '=' : '≠'} ${nom(rb)}</div></div>`;
  if (!egaux) {
    html += `<p class="conclu">Donc, d’après la contraposée du théorème de Thalès,</p>
      <p class="conclu faux">(MN) et (BC) ne sont pas parallèles.</p>`;
  } else if (f.meme) {
    html += `<p><b>De plus,</b></p>
      <p>les points ${o1} et ${o2} sont alignés dans le même ordre.</p>
      <p class="conclu">Donc, d’après la réciproque du théorème de Thalès,</p>
      <p class="conclu faux">(MN) // (BC).</p>`;
  } else {
    html += `<p><b>Mais</b> les points ${o1} et ${o2} ne sont pas alignés dans le même ordre.</p>
      <p class="conclu faux">Donc on ne peut pas utiliser la réciproque du théorème de Thalès.</p>`;
  }
  $('correction').innerHTML = html;
}

/* ================= Boutons ================= */
function majBoutons() {
  $('bEgaux').classList.toggle('on', etat.mode === 'egaux');
  $('bInegaux').classList.toggle('on', etat.mode === 'inegaux');
  $('bHasard').classList.toggle('on', etat.mode === 'hasard');
  $('bOrdre').disabled = etat.mode === 'hasard';
  $('bOrdre').classList.toggle('on', etat.memeOrdre && etat.mode !== 'hasard');
  $('bOrdre').textContent = etat.memeOrdre ? 'Alignés dans le même ordre' : 'Pas alignés dans le même ordre';
  $('bOrdre').setAttribute('aria-pressed', etat.memeOrdre);
  $('bParallele').classList.toggle('on', etat.parallele);
  $('bBougerN').classList.toggle('on', etat.bougerN);
  $('bRapports').classList.toggle('on', etat.rapports);
  $('bSens').textContent = etat.inverse ? 'Rapports : AB/AM' : 'Rapports : AM/AB';
  $('bRapports').setAttribute('aria-pressed', etat.rapports);
  $('bRapports').textContent = etat.rapports ? 'Rapports affichés' : 'Rapports cachés';
  $('donnees').classList.toggle('sansRapports', !etat.rapports);
  $('bBougerN').setAttribute('aria-pressed', etat.bougerN);
  $('bCorrection').classList.toggle('on', etat.correction);
  $('correction').classList.toggle('cache', !etat.correction);
}
function nouvelle() {
  etat.parallele = false; etat.correction = false;
  tirer(); textes(); majBoutons();
  if (api) poser();
}
$('bEgaux').onclick = () => { etat.mode = 'egaux'; nouvelle(); };
$('bInegaux').onclick = () => { etat.mode = 'inegaux'; nouvelle(); };
$('bHasard').onclick = () => { etat.mode = 'hasard'; nouvelle(); };
// même figure, même k : seul N passe de l'autre côté de A (AN = −k·AC en vecteurs)
$('bOrdre').onclick = () => {
  const f = etat.fig;
  etat.memeOrdre = !etat.memeOrdre;
  f.meme = etat.memeOrdre; f.kN = -f.kN;
  f.pts.N = [f.kN * f.pts.C[0], f.kN * f.pts.C[1]];
  etat.correction = false;
  textes(); majBoutons();
  if (api) poser();
};
$('bAutre').onclick = nouvelle;
$('bSens').onclick = () => { etat.inverse = !etat.inverse; textes(); majBoutons(); };
$('bRapports').onclick = () => { etat.rapports = !etat.rapports; majBoutons(); };
$('bMelanger').onclick = () => {
  const f = etat.fig, avant = JSON.stringify(f.pts), pm = () => hasard([1, -1]);
  do {   // une disposition différente de l'actuelle
    f.sB = pm(); f.sC = pm(); f.kM = pm() * Math.abs(f.kM); f.kN = pm() * Math.abs(f.kN);
    f.pts.B = [f.sB * f.AB * f.u1[0], f.sB * f.AB * f.u1[1]];
    f.pts.C = [f.sC * f.AC * f.u2[0], f.sC * f.AC * f.u2[1]];
    f.pts.M = [f.kM * f.pts.B[0], f.kM * f.pts.B[1]];
    f.pts.N = [f.kN * f.pts.C[0], f.kN * f.pts.C[1]];
  } while (JSON.stringify(f.pts) === avant);
  f.meme = Math.sign(f.kM) === Math.sign(f.kN); etat.memeOrdre = f.meme;
  etat.correction = false;
  textes(); majBoutons();
  if (api) poser();
};
$('bBougerN').onclick = () => { etat.bougerN = !etat.bougerN; majBoutons(); if (api) styleN(); };
$('bParallele').onclick = () => { etat.parallele = !etat.parallele; if (api) api.setVisible('par', etat.parallele); majBoutons(); };
$('bCorrection').onclick = () => { etat.correction = !etat.correction; majBoutons(); };

nouvelle();

const applet = new GGBApplet({
  appName: 'classic', width: $('stage').clientWidth, height: $('stage').clientHeight, language: 'fr',
  showToolBar: false, showAlgebraInput: false, showMenuBar: false, showResetIcon: false,
  enableRightClick: false, enableShiftDragZoom: false, enableLabelDrags: false, allowStyleBar: false,
  showZoomButtons: false, showFullscreenButton: false, perspective: 'G',
  appletOnLoad(a) {
    api = a;
    $('chargement').remove();
    construire(); poser();
    new ResizeObserver(cadrer).observe($('stage'));
  },
}, true);
window.addEventListener('load', () => applet.inject('ggb'));

/* Intégrée dans une page (iframe) : écran plein avec un énorme bouton. */
(function () {
  let integree;
  try { integree = window.self !== window.top; } catch (e) { integree = true; }
  if (!integree) return;
  const voile = document.createElement('div');
  voile.id = 'voileOnglet';
  voile.innerHTML = `<p class="titre">Réciproque et contraposée de Thalès</p><a href="${location.href}" target="_blank" rel="noopener">↗ Ouvrir l’appli</a>`;
  document.body.appendChild(voile);
})();
</script>
