<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Diviseurs d'un Nombre</title>
  <link rel="stylesheet" href="style.css?v=1">

  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Confetti (optionnel) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>

  <header>
    <span id="titre_appli">Diviseurs <b>d'un Nombre</b></span>
    <div class="header-actions" id="topButtonsBar"></div>
  </header>

  <div id="appBody">
    <aside id="panneauLateral"></aside>

    <!-- Conteneur du quiz -->
    <main id="app"></main>
  </div>

  <!-- Scripts de ton projet -->
  <script src="Grandeur.js"></script>
  <script src="Exercice.js?v=3"></script>
  <script src="AnimationFinale.js"></script>
  <script src="Generateur.js"></script>
  <script src="Fiche.js?v=14"></script>
  <script src="Guide.js?v=1"></script>
  <script src="Quiz.js?v=2"></script>

  <script>

/** Installe le bouton "Nouvel onglet" dans le header.
 *  Repli si window.open() est bloqué (iframe sandbox) : affiche un lien
 *  cliquable à côté du bouton. */
function setupBoutonNouvelOnglet() {
  const conteneur = document.getElementById("topButtonsBar");
  if (!conteneur) return;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'btnNouvelOnglet';
  btn.className = 'btn-header';
  btn.textContent = 'Nouvel onglet';

  const repli = document.createElement('span');
  repli.style.cssText = 'display:none; font-size:0.8em; margin-left:8px;';
  repli.innerHTML = `Bloqué — <a href="${window.location.href}" target="_blank" rel="noopener">clique ici</a>`;

  btn.onclick = () => {
    const w = window.open(window.location.href, "_blank", "noopener");
    if (!w) repli.style.display = 'inline';
  };

  conteneur.appendChild(btn);
  conteneur.appendChild(repli);
}

window.addEventListener('load', () => {

  function buildQcm(zone, index, onRejet) {
    const questionData = diviseurDecFullQCM();
    return new ExerciceFullQcm(zone, questionData, onRejet);
  }

  const quiz = new Quiz({
    mount: '#app',
    nbQuestions: 10,
    buildExercise: buildQcm,
    texts: {
      ready: "Diviseurs d'un Nombre",
      readyImage: "",
      readyContent: `
        <p style="font-size:1.2em; line-height:1.5; margin:20px 0; text-align:center;">
          Un nombre est décomposé en produit de facteurs premiers. Coche, parmi une liste de nombres proposés, ceux qui le divisent.
        </p>
      `
    }
  });

  setupBoutonNouvelOnglet();

  // ==========================================
  // FICHE PAPIER (overlay LaTeX + impression PDF)
  // ==========================================
  const fiche = new FichePapier({
    genererQuestion: diviseurDecFullQCM,
    nbExercices: 8,
    titre: "Diviseurs d'un Nombre",
    sousTitre: ""
  });
  fiche.installerBouton(document.getElementById('topButtonsBar'));

  // ==========================================
  // GUIDE (mode d'emploi)
  // ==========================================
  const guide = new GuideAppli();
  guide.installerBouton(document.getElementById('topButtonsBar'));
});

  </script>

</body>
</html>
