<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Géométrie mentale</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#d8dee9;
  --accent:#2f6fde; --accent-soft:#e6eefc; --ok:#1f9d55; --ok-bg:#e2f6e9; --ko:#d64545; --ko-bg:#fde7e7;
  --code:#2f9e44; --fig:#d63a3a;
  --shadow:0 2px 8px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{font-size:1.3rem;margin:0}
.grow{flex:1}
.prog{font-weight:600;color:var(--muted)}
.score{font-weight:700;color:var(--ok);margin-left:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.hidden{display:none!important}
main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}

/* Accueil */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 18px;text-align:left;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:1.5rem;margin-bottom:6px}
.mode span{color:var(--muted)}
@media (max-width:640px){.modes{grid-template-columns:1fr;gap:12px;margin-top:12px}.mode{padding:16px}}
/* Flash (vidéoprojeté) */
.num{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:6px 18px;font-size:clamp(1.1rem,2.6vw,1.6rem)}
.mid{font-size:clamp(2rem,7vw,3.6rem);font-weight:700;text-align:center}
#flFig{width:100%;display:flex;justify-content:center}
#flRun .fig{width:min(640px,100%);max-height:50vh}
.flchoix{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;width:min(900px,100%);font-size:clamp(1.3rem,3.2vw,2rem);font-weight:700}
.flchoix.long{grid-template-columns:1fr}
.flchoix div{display:flex;align-items:center;gap:12px}
.flchoix b{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.8em}
.corr{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:10px 20px;margin-top:12px}
.cell{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:clamp(1rem,2.4vw,1.6rem);box-shadow:var(--shadow);font-weight:700}
.cell .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.75em}
.cell .fig{width:clamp(80px,16vw,150px);flex:none;box-shadow:none;border-radius:8px}
.cell .r{color:var(--accent)}
@media (max-width:640px){.cell{flex-wrap:wrap;justify-content:center}}
.info{margin-top:18px;color:var(--muted);text-align:center}
/* QR code de l'accueil (pour ouvrir l'appli sur un téléphone) ; inutile sur le téléphone lui-même */
.qr{margin:20px auto 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;box-shadow:var(--shadow)}
.qr svg{display:block;width:170px;height:170px}
.qr span{color:var(--muted);font-size:.95rem}
#qrOv{cursor:zoom-out}
#qrOv .qr-grand{background:#fff;border-radius:20px;padding:20px}
#qrOv svg{display:block;width:min(80vmin,720px);height:min(80vmin,720px)}
@media (max-width:640px),(pointer:coarse) and (max-height:500px){.qr{display:none}} /* téléphone, en portrait ou en paysage */
.info.warn{color:var(--ko);font-weight:600}

/* Figure */
.fig{display:block;width:min(480px,100%);height:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.fig .cadre{fill:none;stroke:var(--line);stroke-width:1.5}
.fig .trait{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .epais{stroke-width:4}
.fig .tirets{stroke-width:1.6;stroke-dasharray:7 6}
.fig .croix{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.fig .rouge{fill:none;stroke:var(--fig);stroke-width:3;stroke-linecap:round}
.fig .pointille{stroke-dasharray:8 7}
.fig .code{fill:none;stroke:var(--code);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fig text{font:700 18px system-ui,-apple-system,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.fig text.nom{font-weight:500}
.fig text.mesure{font-weight:600;font-size:16px}
.fig text.codetxt{fill:var(--code);font-size:11px;font-weight:800}

/* QCM */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.consigne{font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:600;text-align:center}
.bar{width:min(480px,100%);height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(560px,100%)}
.choices.long{grid-template-columns:1fr}
.choice{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:clamp(1.25rem,5vw,1.7rem);font-weight:700;box-shadow:var(--shadow);padding:6px 10px}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.choice:disabled{cursor:default}
.fb{min-height:1.5em;font-size:1.3rem;font-weight:700;text-align:center}
.fb.ok{color:var(--ok)} .fb.ko{color:var(--ko)}
.next-row{width:min(560px,100%);display:flex;justify-content:flex-end;min-height:48px}
.hint{color:var(--muted);font-size:1.15rem;text-align:center}

/* Résultats */
.res{width:min(720px,100%);margin:12px auto 0;display:flex;flex-direction:column;gap:12px}
.filigrane{position:fixed;inset:0;display:grid;place-items:center;font-size:min(70vw,70vh);line-height:1;opacity:.22;pointer-events:none;z-index:0}
.res .err{background:rgba(255,255,255,.55)}
.res .err .fig{background:rgba(255,255,255,.6)}
.res>*:not(.filigrane){position:relative;z-index:1}
.res h2{text-align:center;font-size:clamp(2rem,8vw,3rem);margin:8px 0}
.err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:1.3rem}
.err.bon{border-left:6px solid var(--ok)}
.err.rate{border-left:6px solid var(--ko);background:rgba(255,240,240,.6)}
.err .marque{font-weight:900;font-size:1.3em;width:1.2em;text-align:center}
.err.bon .marque{color:var(--ok)} .err.rate .marque{color:var(--ko)}
.err .fig{width:170px;box-shadow:none;border-radius:8px}
.err .juste{color:var(--ok);font-weight:800}
.choice sub,.err sub{font-size:.6em}
.ou{color:var(--muted);font-weight:400;font-size:.75em;margin:0 .3em}
.err .y{color:var(--ko);font-size:1rem}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

/* Paramètres */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:16px 18px 20px}
.sheet-head{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--card);padding:6px 0}
.sheet h2{margin:0;flex:1}
.sheet h3{margin:16px 0 8px;font-size:1rem;color:var(--muted)}
.row-btns{display:flex;gap:8px;margin-top:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:64px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* Intégrée dans une page : on force le nouvel onglet */
#voileOnglet{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;z-index:50;text-align:center}
#voileOnglet .titre{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:700;margin:0}
#voileOnglet a{display:flex;align-items:center;justify-content:center;gap:.4em;width:min(900px,100%);min-height:min(45vh,320px);padding:24px;border-radius:28px;background:var(--accent);color:#fff;text-decoration:none;font-size:clamp(2rem,7vw,4.5rem);font-weight:800;line-height:1.15;box-shadow:0 8px 24px rgba(47,111,222,.35)}
#voileOnglet a:hover{filter:brightness(1.08)}
@media (max-width:640px){.overlay{padding:0}.sheet{border-radius:0;height:100%;width:100%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="hTitle">Géométrie mentale</h1>
    <span id="hProg" class="prog hidden"></span><span id="hScore" class="score hidden"></span>
    <span class="grow"></span>
    <button class="btn hidden" id="bPause">⏸ Pause</button>
    <button class="btn" id="bParams">⚙ Paramètres</button>
    <button class="btn hidden" id="bHome">↩ Accueil</button>
  </header>

  <main>
    <section class="screen" id="sHome">
      <div class="modes">
        <button class="mode" data-mode="flash"><b>Flash</b><span>Figures projetées, correction à la fin</span></button>
        <button class="mode" data-mode="qcm"><b>QCM</b><span>Choisis la bonne réponse</span></button>
      </div>
      <p class="info" id="homeInfo"></p>
      <button type="button" class="qr hidden" id="qrBox" title="Agrandir"><div id="qrImg"></div><span>Sur ton téléphone : scanne-moi</span></button>
    </section>

    <section class="screen hidden" id="sFlash">
      <div class="stage" id="flIntro" style="justify-content:center">
        <div class="mid" id="flIntroTxt"></div>
        <p class="hint">Écris ta réponse sur ta feuille.</p>
        <button class="btn primary" id="flStart" style="font-size:1.4rem;padding:14px 32px">Démarrer</button>
      </div>
      <div class="stage hidden" id="flRun">
        <span class="num" id="flNum"></span>
        <div class="consigne" id="flConsigne"></div>
        <div id="flFig"></div>
        <div class="flchoix" id="flChoix"></div>
        <div class="bar"><div id="flBar"></div></div>
      </div>
      <div class="stage hidden" id="flEnd" style="justify-content:center">
        <div class="mid">Terminé !</div>
        <button class="btn primary" id="flShow" style="font-size:1.3rem;padding:14px 28px">Voir la correction</button>
      </div>
      <div class="hidden" id="flCorr">
        <div class="corr" id="flGrid"></div>
        <div class="actions"><button class="btn primary" id="flAgain">Nouvelle série</button></div>
      </div>
    </section>

    <section class="screen hidden" id="sQcm">
      <div class="stage">
        <div class="consigne" id="qConsigne"></div>
        <div id="qFig"></div>
        <div class="bar" id="qBarWrap"><div id="qBar"></div></div>
        <div class="choices" id="qChoices"></div>
        <div class="fb" id="qFb"></div>
        <div class="next-row"><button class="btn primary hidden" id="qNext">Suivant →</button></div>
      </div>
    </section>

    <section class="screen hidden" id="sRes">
      <div class="res">
        <div class="filigrane" id="rEmoji" aria-hidden="true"></div>
        <h2 id="rScore"></h2>
        <div id="rList"></div>
        <div class="actions"><button class="btn primary" id="rAgain">Rejouer</button></div>
      </div>
    </section>
  </main>
</div>

<div class="overlay hidden" id="ov">
  <div class="sheet">
    <div class="sheet-head"><h2>Paramètres</h2><button class="btn primary" id="ovClose">OK</button></div>
    <h3>Questions</h3>
    <div class="seg" id="grpSeg"></div>
    <h3>Nombre de questions</h3>
    <div class="seg" id="nbSeg"></div>
    <h3>Flash : durée par question</h3>
    <div class="seg" id="flDurSeg"></div>
    <h3>QCM : durée par question</h3>
    <div class="seg" id="durSeg"></div>
  </div>
</div>

<div class="overlay hidden" id="qrOv"><div class="qr-grand" id="qrBig"></div></div>

<script>
/* ================= Outils ================= */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const coin = () => Math.random() < .5;
const $ = id => document.getElementById(id);

// Lettres des points (on évite I, O, Q, W)
const LETTRES = 'ABCDEFGHJKLMNPRSTUVXYZ'.split('');
const lettres = n => shuffle(LETTRES.slice()).slice(0, n);

/* ================= Écriture des phrases ================= */
const nomH = s => `(<i>${s}</i>)`;                       // (d) dans une phrase
const deux = (a, b) => coin() ? a + b : b + a;          // AB ou BA (ordre libre)
const eg = (...t) => shuffle(t).join(' = ');            // OP = OQ ou OQ = OP
// Phrase : chaque morceau reste sur une ligne ; on coupe seulement autour de « et »
const ph = (...parts) => parts.map(p => p.replace(/ /g, ' ')).join(' et ');
const texte = h => h.replace(/<[^>]+>/g, '');

/* ================= Géométrie / SVG ================= */
const W = 300, H = 200, rad = d => d * Math.PI / 180;
const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const dir = a => V(Math.cos(a), Math.sin(a)), nrm = u => V(-u.y, u.x), len = a => Math.hypot(a.x, a.y), unit = a => mul(a, 1 / len(a));
const mid = (a, b) => mul(add(a, b), .5);
const inside = (p, m = 24) => p.x >= m && p.x <= W - m && p.y >= m && p.y <= H - m;
const f = n => n.toFixed(1);
let uid = 0;

class Fig {
  constructor() { this.g = []; this.id = 'm' + (++uid); this.lignes = []; this.etiq = []; }
  seg(a, b, cls = 'trait') { this.g.push(`<line class="${cls}" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"/>`); return this; }
  droite(p, u, cls) { this.lignes.push({ p, u }); return this.seg(add(p, mul(u, -900)), add(p, mul(u, 900)), cls); }
  demi(p, u, cls) { return this.seg(p, add(p, mul(u, 900)), cls); }
  cercle(c, r, cls = 'trait') { this.g.push(`<circle class="${cls}" cx="${f(c.x)}" cy="${f(c.y)}" r="${f(r)}"/>`); return this; }
  txt(p, t, cls = '') {
    const q = V(Math.min(W - 12, Math.max(12, p.x)), Math.min(H - 12, Math.max(12, p.y)));
    this.etiq.push(q);
    this.g.push(`<text class="${cls}" x="${f(q.x)}" y="${f(q.y)}">${t}</text>`); return this;
  }
  // point marqué d'une croix + nom décalé de off
  point(p, nom, off) {
    this.g.push(`<path class="croix" d="M${f(p.x - 5)},${f(p.y - 5)}L${f(p.x + 5)},${f(p.y + 5)}M${f(p.x - 5)},${f(p.y + 5)}L${f(p.x + 5)},${f(p.y - 5)}"/>`);
    return this.txt(add(p, off), nom);
  }
  // nom d'une droite : à côté d'elle, près du bord du cadre, mais loin des autres droites et des autres étiquettes
  nomDroite(p, u, s, cote = 1) {
    const autres = this.lignes.filter(L => Math.abs(L.u.x * u.y - L.u.y * u.x) > 1e-6 || Math.abs((p.x - L.p.x) * L.u.y - (p.y - L.p.y) * L.u.x) > 1);
    const distLigne = (q, L) => Math.abs((q.x - L.p.x) * L.u.y - (q.y - L.p.y) * L.u.x);
    let best = null, bestScore = -Infinity;
    for (const c of [cote, -cote]) for (let t = -170; t <= 170; t += 5) {
      const q = add(add(p, mul(u, t)), mul(nrm(u), 16 * c));
      if (!inside(q, 18)) continue;
      const dL = Math.min(99, ...autres.map(L => distLigne(q, L)));
      const dE = Math.min(99, ...this.etiq.map(e => len(sub(q, e))));
      // d'abord la lisibilité (loin des autres droites et étiquettes), puis le bord du cadre, puis le côté demandé
      const score = Math.min(dL, 22) * 10 + Math.min(dE, 34) * 10 + Math.abs(t) / 10 + (c === cote ? 3 : 0);
      if (score > bestScore) { bestScore = score; best = q; }
    }
    return best ? this.txt(best, `(<tspan font-style="italic">${s}</tspan>)`, 'nom') : this;
  }
  // nom du cercle : autour du cercle, à l'endroit le plus éloigné des points et étiquettes (obstacles)
  nomCercle(o, r, s, obstacles) {
    let best = null, bestD = -1;
    for (let a = 0; a < 360; a += 5) {
      const q = add(o, mul(dir(rad(a)), r + 16));
      if (!inside(q, 16)) continue;
      const dd = Math.min(...obstacles.map(p => len(sub(q, p))));
      if (dd > bestD) { bestD = dd; best = q; }
    }
    return best ? this.txt(best, `(<tspan font-style="italic">${s}</tspan>)`, 'nom') : this;
  }
  angleDroit(v, u1, u2) {
    const a = add(v, mul(u1, 13)), b = add(a, mul(u2, 13)), c = add(v, mul(u2, 13));
    this.g.push(`<path class="code" d="M${f(a.x)},${f(a.y)}L${f(b.x)},${f(b.y)}L${f(c.x)},${f(c.y)}"/>`); return this;
  }
  // k petits traits verts au milieu de [ab]
  marques(a, b, k) {
    const m = mid(a, b), u = unit(sub(b, a)), s = add(mul(nrm(u), 7), mul(u, 3));
    for (let i = 0; i < k; i++) {
      const c = add(m, mul(u, (i - (k - 1) / 2) * 6));
      this.seg(sub(c, s), add(c, s), 'code');
    }
    return this;
  }
  // codage « parallèles » de la fiche : rond // et deux flèches vers les droites
  paralleles(p1, p2) {
    const m = mid(p1, p2), u = unit(sub(p2, p1));
    this.g.push(`<circle class="code" cx="${f(m.x)}" cy="${f(m.y)}" r="11"/>`);
    this.txt(m, '//', 'codetxt');
    this.g.push(`<line class="code" x1="${f(m.x + 11 * u.x)}" y1="${f(m.y + 11 * u.y)}" x2="${f(p2.x)}" y2="${f(p2.y)}" marker-end="url(#${this.id})"/>`);
    this.g.push(`<line class="code" x1="${f(m.x - 11 * u.x)}" y1="${f(m.y - 11 * u.y)}" x2="${f(p1.x)}" y2="${f(p1.y)}" marker-end="url(#${this.id})"/>`);
    return this;
  }
  // longueur : flèche double rouge en pointillés, décalée de off
  fleche(a, b, off) {
    const u = unit(sub(b, a)), p = add(add(a, off), mul(u, 9)), q = sub(add(b, off), mul(u, 9));
    this.g.push(`<line class="rouge pointille" x1="${f(p.x)}" y1="${f(p.y)}" x2="${f(q.x)}" y2="${f(q.y)}" marker-start="url(#${this.id}r)" marker-end="url(#${this.id}r)"/>`);
    return this;
  }
  toString() {
    return `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="figure">
      <defs><marker id="${this.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--code)"/></marker><marker id="${this.id}r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--fig)"/></marker></defs>
      <rect class="cadre" x="1" y="1" width="${W - 2}" height="${H - 2}" rx="10"/>${this.g.join('')}</svg>`;

}
// Relance un générateur tant que la figure sort du cadre
function essai(g) { for (let i = 0; i < 5000; i++) { const r = g(); if (r) return r; } throw new Error('figure'); }

/* ================= Types =================
   Chaque générateur renvoie { svg, juste, faux: [...] } : une seule phrase juste, toutes les autres fausses. */
/* ---------- Groupe 1 : notations (II du cours) ---------- */
const NOTA = {
  droite:   (P, Q) => `(${P}${Q})`,
  segment:  (P, Q) => `[${P}${Q}]`,
  ddPQ:     (P, Q) => `[${P}${Q})`,
  ddQP:     (P, Q) => `[${Q}${P})`,
  longueur: (P, Q) => `${P}${Q}`,
};
const SYMETRIQUE = { droite: true, segment: true, longueur: true };
// (AB) = (BA), [AB] = [BA], AB = BA : ordre tiré au hasard ; la correction donne les deux
const ecrire = (k, P, Q) => SYMETRIQUE[k] && coin() ? NOTA[k](Q, P) : NOTA[k](P, Q);
const ecrireTout = (k, P, Q) => SYMETRIQUE[k] ? `${NOTA[k](P, Q)}<span class="ou">ou</span>${NOTA[k](Q, P)}` : NOTA[k](P, Q);

// forme : tracé rouge ; k : bonne notation ; force : leurre toujours proposé ; leurres : autres objets
function genNotation(forme, k, force, leurres) {
  const [P, Q] = lettres(2);
  let a, b;
  do { a = V(R(45, 255), R(40, 160)); b = V(R(45, 255), R(40, 160)); } while (len(sub(b, a)) < 110);
  const u = unit(sub(b, a)), n = nrm(u), s = pick([1, -1]), fig = new Fig();
  if (forme === 'droite') fig.droite(a, u, 'rouge');
  if (forme === 'segment') fig.seg(a, b, 'rouge');
  if (forme === 'demi') fig.demi(a, u, 'rouge');
  if (forme === 'longueur') fig.fleche(a, b, mul(n, 10 * s)).txt(add(mid(a, b), mul(n, 26 * s)), 'distance', 'mesure');
  const o = mul(n, 17 * (forme === 'longueur' ? -s : s));
  fig.point(a, P, o).point(b, Q, o);
  return {
    svg: fig, consigne: 'Quelle est la bonne notation du tracé rouge ?',
    juste: ecrire(k, P, Q), correction: ecrireTout(k, P, Q),
    faux: force.concat(shuffle(leurres.slice())).map(x => ecrire(x, P, Q)),
  };
}

/* ---------- Groupe 2 : phrases mathématiques (fiche) ---------- */
// Noms des droites et des cercles, eux aussi tirés au hasard
// (toujours en minuscules)
const LIGNE = ['d', 'd′', 'd₁', 'd₂', 'd₃', 'e', 'f'];
const PAIRES = [['d', 'd′'], ['d₁', 'd₂'], ['d₂', 'd₃'], ['d₁', 'd₃'], ['e', 'f']];
const CERCLE = ['c', 'c′', 'c₁', 'c₂', 'c₃'];
const TRIPLES = [['d₁', 'd₂', 'd₃'], ['d', 'd′', 'e'], ['d', 'e', 'f']];

function genDroite() { // A ∈ (d), M ∉ (d) : 3 points, sur ou hors de la droite
  return essai(() => {
    const noms = lettres(3), d = pick(LIGNE), D = nomH(d);
    const c = V(R(120, 180), R(85, 115)), u = dir(rad(R(-35, 35))), n = nrm(u), s = pick([1, -1]);
    const sur = shuffle([true, false, coin()]);                 // au moins un point sur, un hors
    const ts = shuffle([-85, -15, 55]).map(t => t + R(0, 25));  // abscisses bien séparées
    const pts = ts.map((t, k) => add(add(c, mul(u, t)), mul(n, sur[k] ? 0 : s * R(35, 55))));
    if (!pts.every(p => inside(p))) return null;
    const fig = new Fig().droite(c, u).nomDroite(c, u, d, -s);
    pts.forEach((p, k) => fig.point(p, noms[k], mul(n, (sur[k] ? -16 : 16) * s)));
    const vrai = noms.map((x, k) => ph(`${x} ${sur[k] ? '∈' : '∉'} ${D}`));
    const faux = noms.map((x, k) => ph(`${x} ${sur[k] ? '∉' : '∈'} ${D}`));
    return { svg: fig, juste: pick(vrai), faux };
  });
}
function genSegment() { // B milieu de [AC], codé une fois sur deux : sans codage on ne peut affirmer que B ∈ [AC]
  return essai(() => {
    const [A, B, C] = lettres(3), code = coin();
    const u = dir(rad(R(-30, 30))), n = nrm(u), a = V(R(40, 80), R(55, 145)), c = add(a, mul(u, R(180, 210)));
    // B est toujours au milieu (un écart serait invérifiable) : seul le codage permet d'affirmer BA = BC
    const k = 0.5, b = add(a, mul(sub(c, a), k)), s = pick([1, -1]);
    if (!inside(a) || !inside(c)) return null;
    const fig = new Fig().seg(a, c);
    if (code) fig.marques(a, b, 2).marques(b, c, 2);
    fig.point(a, A, mul(n, 16 * s)).point(b, B, mul(n, 16 * s)).point(c, C, mul(n, 16 * s));
    const BA = deux(B, A), BC = deux(B, C), AC = deux(A, C);
    const vrai = [`${B} ∈ [${AC}]`].concat(code ? [eg(BA, BC), eg(BA, BC)] : []);
    const faux = [`${B} ∉ [${AC}]`, `${A} ∈ [${BC}]`, `${C} ∈ [${deux(A, B)}]`, eg(deux(A, B), AC)];
    if (!code) faux.push(eg(BA, BC), eg(BA, BC));   // le leurre clé quand il n'y a pas de codage
    return { svg: fig, juste: ph(pick(vrai)), faux: [...new Set(shuffle(faux))].map(x => ph(x)) };
  });
}
function genDemi() { // V ∉ [OT), V ∈ (OT), V ∈ [TO)…
  return essai(() => {
    const [O, T, Vn] = lettres(3);
    const u = dir(rad(R(-25, 25) + (coin() ? 0 : 180))), n = nrm(u), s = pick([1, -1]);
    const o = V(R(120, 180), R(85, 115)), t = add(o, mul(u, R(60, 85))), v = add(o, mul(u, -R(55, 80)));
    if (!inside(t) || !inside(v)) return null;
    const fig = new Fig().droite(o, u, 'trait tirets').demi(o, u, 'trait epais')
      .point(o, O, mul(n, 16 * s)).point(t, T, mul(n, 16 * s)).point(v, Vn, mul(n, 16 * s));
    const OT = deux(O, T);
    return {
      svg: fig, juste: ph(pick([`${Vn} ∉ [${O}${T})`, `${Vn} ∉ [${O}${T})`, `${Vn} ∈ (${OT})`, `${Vn} ∈ [${T}${O})`])),
      faux: shuffle([ph(`${Vn} ∈ [${O}${T})`), ph(`${Vn} ∉ (${OT})`), ph(`${Vn} ∉ [${T}${O})`), ph(`${T} ∉ [${O}${T})`)]),
    };
  });
}
function genCercle() { // E ∉ (c), F ∈ (c)
  return essai(() => {
    const [O, E, F] = lettres(3), c = pick(CERCLE), C = nomH(c);
    const o = V(R(130, 170), R(95, 105)), r = R(48, 58);
    const aF = Math.random() * 2 * Math.PI, aE = aF + rad(R(100, 260)), dE = r + R(28, 40);
    const pf = add(o, mul(dir(aF), r)), pe = add(o, mul(dir(aE), dE));
    if (!inside(pe)) return null;
    const lf = add(pf, mul(dir(aF), 16)), le = add(pe, mul(dir(aE), 16));
    const fig = new Fig().cercle(o, r).point(o, O, V(0, 16)).point(pf, F, mul(dir(aF), 16)).point(pe, E, mul(dir(aE), 16))
      .nomCercle(o, r, c, [pf, pe, lf, le]);
    return { svg: fig, juste: ph(pick([`${E} ∉ ${C}`, `${F} ∈ ${C}`])), faux: [ph(`${E} ∈ ${C}`), ph(`${F} ∉ ${C}`), ph(`${O} ∈ ${C}`)] };
  });
}
/* Angle droit commun à Intersection et Perpendiculaires (toujours exactement 90° : seul le codage compte) :
   codé → la phrase ⊥ est la bonne réponse ;
   non codé → on ne peut pas affirmer ⊥ : c'est le leurre clé, et une appartenance est la bonne réponse.
   Les 4 réponses ont toujours la même forme : une ⊥, une //, deux appartenances. */
function reponsesAngle(code, perp, para, appVraies, appFausses) {
  if (code) return { juste: ph(perp), faux: shuffle(appFausses.slice()).slice(0, 2).concat([para]).map(x => ph(x)) };
  return { juste: ph(pick(appVraies)), faux: [perp, para, pick(appFausses)].map(x => ph(x)) };
}
function genInter() { // (d) et (d′) perpendiculaires en I, angle droit codé ou non
  return essai(() => {
    const [In] = lettres(1), [d1, d2] = pick(PAIRES), code = coin();
    const i = V(R(120, 180), R(85, 115)), a1 = rad(R(-60, 60)), u1 = dir(a1);
    const u2 = dir(a1 + rad(90) * pick([1, -1]));
    const off = mul(unit(sub(u1, u2)), 18);
    const fig = new Fig().droite(i, u1).droite(i, u2);
    if (code) fig.angleDroit(i, u1, u2);
    fig.point(i, In, off).nomDroite(i, u1, d1, 1).nomDroite(i, u2, d2, -1);
    const A = nomH(d1), B = nomH(d2), [x, y] = shuffle([A, B]);
    return {
      svg: fig, ...reponsesAngle(code, `${x} ⊥ ${y}`, `${x} // ${y}`,
        [`${In} ∈ ${A}`, `${In} ∈ ${B}`], [`${In} ∉ ${A}`, `${In} ∉ ${B}`]),
    };
  });
}
function genPerp() { // (EF) et (FG), angle droit en F codé ou non (droites ou triangle)
  return essai(() => {
    const [E, F, G] = lettres(3), code = coin();
    const a = Math.random() * 2 * Math.PI, sg = pick([1, -1]);
    const u = dir(a), v = dir(a + sg * rad(90));
    const fp = V(R(90, 210), R(70, 130)), e = add(fp, mul(u, R(55, 75))), g = add(fp, mul(v, R(95, 125)));
    if (!inside(e) || !inside(g)) return null;
    const fig = new Fig(), tri = coin();
    if (tri) fig.seg(fp, e).seg(e, g).seg(g, fp); else fig.droite(fp, u).droite(fp, v);
    if (code) fig.angleDroit(fp, u, v);
    fig.point(e, E, mul(v, -16)).point(g, G, mul(u, -16)).point(fp, F, mul(unit(add(u, v)), -17));
    const EF = deux(E, F), FG = deux(F, G), [x, y] = shuffle([`(${EF})`, `(${FG})`]);
    return {
      svg: fig, ...reponsesAngle(code, `${x} ⊥ ${y}`, `${x} // ${y}`,
        [`${G} ∉ (${EF})`, `${E} ∉ (${FG})`], [`${G} ∈ (${EF})`, `${E} ∈ (${FG})`]),
    };
  });
}
function genPara() { // (d₁) // (d₂) codées, coupées par une troisième droite (d₃) nettement oblique
  return essai(() => {
    const [d1, d2, d3] = shuffle(pick(TRIPLES).slice());
    const c = V(R(130, 170), R(90, 110)), u = dir(rad(R(-30, 30))), n = nrm(u), gap = R(70, 90);
    const c1 = add(c, mul(n, -gap / 2)), c2 = add(c, mul(n, gap / 2));
    const w = dir(Math.atan2(u.y, u.x) + rad(R(40, 65)) * pick([1, -1]));   // (d₃) : ni parallèle, ni perpendiculaire
    const p3 = add(c, mul(u, R(45, 70))), t = -R(55, 75);                   // codage // loin de (d₃)
    const fig = new Fig().droite(c1, u).droite(c2, u).droite(p3, w)
      .paralleles(add(c1, mul(u, t)), add(c2, mul(u, t)))
      .nomDroite(c1, u, d1, -1).nomDroite(c2, u, d2, 1).nomDroite(p3, w, d3, pick([1, -1]));
    const A = nomH(d1), B = nomH(d2), C = nomH(d3);
    const par = (x, y) => coin() ? `${x} // ${y}` : `${y} // ${x}`;
    return {
      svg: fig, juste: ph(par(A, B)),
      faux: shuffle([ph(par(A, C)), ph(par(B, C)), ph(`${pick([A, B])} ⊥ ${C}`), ph(`${A} = ${B}`)]),
    };
  });
}
function genRayons() { // cercle de centre O : une seule égalité (OP = OQ) ou une appartenance (P ∈ (c))
  return essai(() => {
    const trois = coin(), [O, P, Q, Rn] = lettres(4), c = pick(CERCLE), C = nomH(c);
    const o = V(R(135, 165), R(95, 105)), r = R(55, 62), a0 = Math.random() * 2 * Math.PI;
    const angs = [a0, a0 + rad(R(85, 150))];
    if (trois) angs.push(angs[1] + rad(R(85, 120)));
    const pts = angs.map(a => add(o, mul(dir(a), r)));
    const fig = new Fig().cercle(o, r);
    const moy = unit(pts.reduce((s, p) => add(s, sub(p, o)), V(0, 0.001)));
    fig.point(o, O, mul(moy, -16));
    const noms = [P, Q, Rn].slice(0, pts.length);
    noms.forEach((nm, k) => fig.point(pts[k], nm, mul(dir(angs[k]), 16)));
    fig.nomCercle(o, r, c, pts.concat(pts.map((p, k) => add(p, mul(dir(angs[k]), 16)))));
    // vrai : deux rayons égaux, ou un point du cercle ; faux : corde = rayon, points confondus, centre sur le cercle…
    const paires = noms.flatMap((x, k) => noms.slice(k + 1).map(y => [x, y]));
    const [x, y] = pick(paires);
    const vrai = coin() || coin() ? eg(deux(O, x), deux(O, y)) : `${pick(noms)} ∈ ${C}`;
    const faux = [eg(deux(O, x), deux(x, y)), eg(deux(O, y), deux(x, y)), eg(x, y), `${O} ∈ ${C}`, `${pick(noms)} ∉ ${C}`, `${O} ∈ [${deux(x, y)}]`];
    return { svg: fig, juste: ph(vrai), faux: shuffle(faux).map(x => ph(x)) };
  });
}
function genCodage() { // triangle équilatéral parfait ; deux côtés codés (NQ = NR) ou aucun codage
  return essai(() => {
    const [Nn, Q, Rn] = lettres(3), code = coin(), L = R(122, 136);
    // triangle équilatéral parfait (un écart serait invérifiable) : seul le codage compte
    const nq = L, nr = L, qr = L;
    // Q et R sur une base tournée au hasard, N par intersection de cercles
    const th = Math.random() * 2 * Math.PI, u = dir(th), x = (nq ** 2 - nr ** 2 + qr ** 2) / (2 * qr), h2 = nq ** 2 - x ** 2;
    if (h2 <= 0) return null;
    const c0 = V(R(130, 170), R(95, 110));
    let q = V(0, 0), r = mul(u, qr), nn = add(mul(u, x), mul(nrm(u), -Math.sqrt(h2)));
    const g0 = mul(add(add(q, r), nn), 1 / 3);
    [q, r, nn] = [q, r, nn].map(p => add(sub(p, g0), c0));
    if (!inside(nn) || !inside(q) || !inside(r)) return null;
    const g = mul(add(add(nn, q), r), 1 / 3), k = pick([1, 2]);
    const fig = new Fig().seg(nn, q).seg(q, r).seg(r, nn);
    if (code) fig.marques(nn, q, k).marques(nn, r, k);
    fig.point(nn, Nn, mul(unit(sub(nn, g)), 16)).point(q, Q, mul(unit(sub(q, g)), 16)).point(r, Rn, mul(unit(sub(r, g)), 16));
    const NQ = deux(Nn, Q), NR = deux(Nn, Rn), QR = deux(Q, Rn);
    // une phrase d'appartenance : un sommet et le côté (ou la droite) opposé
    const [X, Y, Z] = pick([[Nn, Q, Rn], [Q, Nn, Rn], [Rn, Nn, Q]]), YZ = deux(Y, Z), forme = pick(['[]', '()']);
    const objet = forme === '[]' ? `[${YZ}]` : `(${YZ})`;
    const egalites = [eg(NQ, NR), eg(NQ, QR), eg(NR, QR)];
    if (code) return { svg: fig, juste: ph(egalites[0]), faux: [egalites[1], egalites[2], `${X} ∈ ${objet}`].map(t => ph(t)) };
    return { svg: fig, juste: ph(`${X} ∉ ${objet}`), faux: egalites.map(t => ph(t)) };
  });
}
/* Quadrilatère : toujours un carré parfait (les écarts seraient de toute façon invérifiables).
   Seul le codage compte : une phrase codée est la bonne réponse, les phrases non codées sont les leurres. */
function genCarre() {
  return essai(() => {
    const noms = lettres(4), L = R(100, 115), th = Math.random() * 2 * Math.PI;
    const nCotes = pick([0, 2, 2, 3]), nAngles = pick([0, 1, 1, 2]);
    if (!nCotes && !nAngles) return null;
    const cotesCodes = shuffle([0, 1, 2, 3]).slice(0, nCotes), angles = shuffle([0, 1, 2, 3]).slice(0, nAngles);
    const u = dir(th), v = nrm(u), c0 = V(R(135, 165), R(95, 105));
    const centre = mul(add(u, v), 0.5), Q = [V(0, 0), u, add(u, v), v].map(p => add(c0, mul(sub(p, centre), L)));
    if (!Q.every(p => inside(p))) return null;
    const g = mul(Q.reduce(add, V(0, 0)), 1 / 4), fig = new Fig(), nb = pick([1, 2]);
    for (let k = 0; k < 4; k++) fig.seg(Q[k], Q[(k + 1) % 4]);
    cotesCodes.forEach(k => fig.marques(Q[k], Q[(k + 1) % 4], nb));
    angles.forEach(k => fig.angleDroit(Q[k], unit(sub(Q[(k + 3) % 4], Q[k])), unit(sub(Q[(k + 1) % 4], Q[k]))));
    Q.forEach((p, k) => fig.point(p, noms[k], mul(unit(sub(p, g)), 17)));
    // phrases : égalités de côtés (côté k = [Pk Pk+1]) et perpendicularités de côtés consécutifs (au sommet k)
    const cote = k => deux(noms[k], noms[(k + 1) % 4]);
    const perpAu = k => { const [x, y] = shuffle([`(${cote((k + 3) % 4)})`, `(${cote(k)})`]); return `${x} ⊥ ${y}`; };
    const egVrai = [], egFaux = [];
    for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++)
      (cotesCodes.includes(a) && cotesCodes.includes(b) ? egVrai : egFaux).push(eg(cote(a), cote(b)));
    const perpVrai = angles.map(perpAu), perpFaux = [0, 1, 2, 3].filter(k => !angles.includes(k)).map(perpAu);
    const juste = pick(egVrai.concat(perpVrai));
    // toujours au moins une égalité et une perpendicularité parmi les 4 réponses
    const autre = juste.includes('⊥') ? egFaux : perpFaux, meme = juste.includes('⊥') ? perpFaux : egFaux;
    if (!autre.length) return null;
    const faux = [...new Set([pick(autre)].concat(shuffle(autre.concat(meme))))];
    if (faux.length < 3) return null;
    return { svg: fig, juste: ph(juste), faux: faux.map(x => ph(x)) };
  });
}
function genMesure() { // HJ = 4 cm
  return essai(() => {
    const [Hn, J] = lettres(2);
    const u = dir(rad(R(-25, 25))), n = nrm(u), h = V(R(50, 90), R(60, 140)), j = add(h, mul(u, R(150, 190))), s = pick([1, -1]);
    if (!inside(h) || !inside(j)) return null;
    const x = pick([3, 4, 5, 6, 7, 8, 4.5, 5.5, 6.5]), cm = v => `${String(v).replace('.', ',')} cm`;
    const fig = new Fig().seg(h, j).txt(add(mid(h, j), mul(n, -18 * s)), cm(x), 'mesure')
      .point(h, Hn, mul(n, 16 * s)).point(j, J, mul(n, 16 * s));
    const HJ = deux(Hn, J);
    return { svg: fig, juste: ph(`${HJ} = ${cm(x)}`), faux: shuffle([x + 1, x - 1, x + 2, 2 * x]).map(y => ph(`${HJ} = ${cm(y)}`)) };
  });
}

  { id: 'rayons',  groupe: 2, label: 'Rayons d’un cercle',    ex: 'OP = OQ',           gen: genRayons },
  { id: 'codage',  groupe: 2, label: 'Longueurs codées',      ex: 'NQ = NR',           gen: genCodage },
  { id: 'carre',   groupe: 2, label: 'Quadrilatère codé', ex: 'AB = BC, (AB) ⊥ (BC)',       gen: genCarre },
  { id: 'mesure',  groupe: 2, label: 'Longueur mesurée',      ex: 'HJ = 4 cm',         gen: genMesure },
];

/* ================= Paramètres ================= */
const KEY = 'geometrieMentale6e-v2';
const DUREES = [0, 10, 15, 20, 30];
// questions : 1 = notations, 2 = phrases mathématiques, 3 = les deux
const QUESTIONS = [[1, 'Notations'], [2, 'Phrases mathématiques'], [3, 'Les deux']];
const NOMBRES = [5, 10, 15, 20], DUREES_FLASH = [10, 15, 20, 30];
const settings = { questions: 3, duree: 0, nb: 10, flDuree: 15 };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) {
    if ([1, 2, 3].includes(s.questions)) settings.questions = s.questions;
    if (DUREES.includes(s.duree)) settings.duree = s.duree;
    if (NOMBRES.includes(s.nb)) settings.nb = s.nb;
    if (DUREES_FLASH.includes(s.flDuree)) settings.flDuree = s.flDuree;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };
const activeTypes = () => TYPES.filter(t => settings.questions === 3 || t.groupe === settings.questions);

function renderSettings() {
  $('grpSeg').innerHTML = QUESTIONS.map(([g, l]) =>
    `<button class="btn ${g === settings.questions ? 'on' : ''}" data-g="${g}">${l}</button>`).join('');
  $('nbSeg').innerHTML = NOMBRES.map(v => `<button class="btn ${v === settings.nb ? 'on' : ''}" data-v="${v}">${v}</button>`).join('');
  $('flDurSeg').innerHTML = DUREES_FLASH.map(v => `<button class="btn ${v === settings.flDuree ? 'on' : ''}" data-v="${v}">${v} s</button>`).join('');
  $('durSeg').innerHTML = DUREES.map(d =>
    `<button class="btn ${d === settings.duree ? 'on' : ''}" data-d="${d}">${d ? d + ' s' : 'Sans'}</button>`).join('');
}
const majParams = () => { save(); renderSettings(); renderHome(); };
$('grpSeg').addEventListener('click', e => { const g = +e.target.dataset.g; if (g) { settings.questions = g; majParams(); } });
$('nbSeg').addEventListener('click', e => { const v = e.target.dataset.v; if (v != null) { settings.nb = +v; majParams(); } });
$('flDurSeg').addEventListener('click', e => { const v = e.target.dataset.v; if (v != null) { settings.flDuree = +v; majParams(); } });
$('durSeg').addEventListener('click', e => { const d = e.target.dataset.d; if (d != null) { settings.duree = +d; majParams(); } });
$('bParams').onclick = () => { renderSettings(); $('ov').classList.remove('hidden'); };
$('ovClose').onclick = () => $('ov').classList.add('hidden');
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') $('ov').classList.add('hidden'); });

/* ================= Série ================= */
function makeSeries() {
  const types = activeTypes(), out = [];
  let bag = [], prev = null;
  while (out.length < settings.nb) {
    if (!bag.length) bag = shuffle(types.slice());
    let t = bag.pop();
    if (t === prev && bag.length) { bag.unshift(t); t = bag.pop(); } // pas deux fois le même type de suite
    let q;
    try { q = t.gen(); } catch (e) { bag.unshift(t); continue; }   // figure introuvable (très rare) : autre tirage
    q.svg = String(q.svg);
    q.choix = shuffle([{ h: q.juste, ok: true }, ...q.faux.slice(0, 3).map(h => ({ h, ok: false }))]);
    out.push(q); prev = t;
  }
  return out;
}

/* ================= Navigation ================= */
const SCREENS = ['sHome', 'sFlash', 'sQcm', 'sRes'];
let mode = 'qcm', series = [], idx = 0, score = 0, errors = [], answered = false, nextTO = null;
const N = () => series.length;

function show(id) {
  SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id));
  const home = id === 'sHome';
  $('hTitle').classList.toggle('hidden', id === 'sQcm' || id === 'sFlash');
  $('bParams').classList.toggle('hidden', !home);
  $('bHome').classList.toggle('hidden', home);
  $('hProg').classList.toggle('hidden', id !== 'sQcm' && id !== 'sFlash');
  $('hScore').classList.toggle('hidden', id !== 'sQcm');
  $('bPause').classList.add('hidden');
}
function renderHome() {
  const quoi = { 1: 'notations', 2: 'phrases mathématiques', 3: 'notations et phrases' }[settings.questions];
  $('homeInfo').textContent = `${settings.nb} questions · ${quoi} · Flash : ${settings.flDuree} s · QCM : ${settings.duree ? settings.duree + ' s' : 'sans temps'}`;
}
function goHome() { stopTimer(); clearTimeout(nextTO); show('sHome'); renderHome(); }
$('bHome').onclick = goHome;
document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.mode));
function start(m = mode) {
  mode = m; series = makeSeries(); idx = 0; score = 0; errors = [];
  if (m === 'flash') flashIntro(); else { show('sQcm'); qcmShow(); }
}
function setProg() { $('hProg').textContent = `Question ${idx + 1} / ${N()}`; $('hScore').textContent = `✓ ${score}`; }

/* Minuteur */
let timer = null, remain = 0, total = 0, last = 0, paused = false;
function runTimer(sec, onEnd, barId = 'qBar') {
  stopTimer();
  total = remain = sec * 1000; last = performance.now(); paused = false;
  const bar = $(barId); bar.style.width = '100%';
  timer = setInterval(() => {
    const now = performance.now(); if (!paused) remain -= now - last; last = now;
    bar.style.width = Math.max(0, remain / total * 100) + '%';
    if (remain <= 0) { stopTimer(); onEnd(); }
  }, 50);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }

/* ================= Flash (vidéoprojeté) =================
   Notations : la figure seule, on écrit la notation. Phrases : la figure et les 4 phrases numérotées, on écrit le numéro. */
function flashPart(p) { ['flIntro', 'flRun', 'flEnd', 'flCorr'].forEach(id => $(id).classList.toggle('hidden', id !== p)); }
function flashIntro() {
  show('sFlash'); flashPart('flIntro');
  $('hProg').textContent = 'Flash';
  $('flIntroTxt').textContent = `${N()} questions · ${settings.flDuree} s`;
}
$('flStart').onclick = () => { idx = 0; flashPart('flRun'); $('bPause').classList.remove('hidden'); flashShow(); };
function flashShow() {
  const q = series[idx];
  setProg();
  $('flNum').textContent = `n° ${idx + 1}`;
  $('flFig').innerHTML = q.svg;
  if (q.consigne) {
    $('flConsigne').textContent = 'Écris la notation du tracé rouge.';
    $('flChoix').innerHTML = '';
  } else {
    $('flConsigne').textContent = 'Quelle phrase est vraie ? Écris son numéro.';
    $('flChoix').classList.toggle('long', q.choix.some(c => texte(c.h).length > 14));
    $('flChoix').innerHTML = q.choix.map((c, i) => `<div><b>${i + 1}</b><span>${c.h}</span></div>`).join('');
  }
  $('bPause').textContent = '⏸ Pause';
  runTimer(settings.flDuree, () => {
    if (++idx < N()) flashShow();
    else { flashPart('flEnd'); $('bPause').classList.add('hidden'); $('hProg').textContent = 'Flash'; }
  }, 'flBar');
}
$('bPause').onclick = () => { paused = !paused; $('bPause').textContent = paused ? '▶ Reprendre' : '⏸ Pause'; };
$('flShow').onclick = () => {
  $('flGrid').style.gridTemplateRows = `repeat(${Math.ceil(N() / 2)}, auto)`;
  $('flGrid').innerHTML = series.map((q, i) => {
    const rep = q.consigne ? `<span class="r">${q.correction || q.juste}</span>`
      : `<span><span class="r">n° ${q.choix.findIndex(c => c.ok) + 1}</span> : ${q.juste}</span>`;
    return `<div class="cell"><span class="n">${i + 1}</span>${q.svg}${rep}</div>`;
  }).join('');
  $('hProg').textContent = 'Correction';
  flashPart('flCorr');
};
$('flAgain').onclick = () => start('flash');

/* ================= QCM ================= */
function qcmShow() {
  const q = series[idx];
  answered = false; setProg();
  $('qFig').innerHTML = q.svg;
  $('qConsigne').textContent = q.consigne || 'Laquelle de ces phrases mathématiques est vraie ?';
  $('qFb').textContent = ''; $('qFb').className = 'fb';
  $('qNext').classList.add('hidden');
  const long = q.choix.some(c => texte(c.h).length > 12);
  $('qChoices').classList.toggle('long', long);
  $('qChoices').innerHTML = q.choix.map((c, i) => `<button class="choice" data-i="${i}">${c.h}</button>`).join('');
  $('qBarWrap').classList.toggle('hidden', !settings.duree);
  if (settings.duree) runTimer(settings.duree, () => qcmAnswer(null));
}
// b : bouton choisi, ou null si le temps est écoulé
function qcmAnswer(b) {
  if (answered) return;
  answered = true; stopTimer();
  const q = series[idx], ok = b && q.choix[b.dataset.i].ok;
  $('qChoices').querySelectorAll('.choice').forEach(x => {
    x.disabled = true;
    if (q.choix[x.dataset.i].ok) x.classList.add('ok');
  });
  if (ok) { score++; $('qFb').textContent = 'Bravo !'; $('qFb').className = 'fb ok'; setProg(); nextTO = setTimeout(next, 1000); }
  else {
    if (b) b.classList.add('ko');
    errors.push({ q, y: b ? q.choix[b.dataset.i].h : null });
    $('qFb').textContent = b ? 'Non.' : 'Temps écoulé !'; $('qFb').className = 'fb ko';
    $('qNext').classList.remove('hidden'); $('qNext').focus();
  }
}
$('qChoices').addEventListener('click', e => { const b = e.target.closest('.choice'); if (b) qcmAnswer(b); });
$('qNext').onclick = next;

function next() {
  clearTimeout(nextTO);
  if (++idx < N()) { qcmShow(); return; }
  show('sRes');
  $('rScore').textContent = `${score} / ${N()}`;
  // gros emoji en filigrane selon le score
  const taux = score / N();
  $('rEmoji').textContent = taux === 1 ? '🏆' : taux >= .8 ? '😃' : taux >= .5 ? '🙂' : '💪';
  // toute la série : ✓ pour les réussites, ✗ avec la réponse donnée pour les erreurs
  $('rList').innerHTML = series.map(q => {
    const e = errors.find(x => x.q === q);
    return `<div class="err ${e ? 'rate' : 'bon'}"><span class="marque">${e ? '✗' : '✓'}</span>${q.svg}<span class="juste">${q.correction || q.juste}</span>`
      + (e ? `<span class="y">${e.y == null ? 'Temps écoulé' : 'Ta réponse : ' + e.y}</span>` : '') + '</div>';
  }).join('');
}
$('rAgain').onclick = () => start(mode);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('ov').classList.add('hidden'); $('qrOv').classList.add('hidden'); } });

/* ================= Nouvel onglet =================
   Intégrée dans une page (iframe) : écran plein avec un énorme bouton.
   Un vrai lien target="_blank" n'est pas bloqué par les anti-popups. */
function forcerNouvelOnglet() {
  let integree;
  try { integree = window.self !== window.top; } catch (e) { integree = true; }
  if (!integree) return;
  const voile = document.createElement('div');
  voile.id = 'voileOnglet';
  voile.innerHTML = `<p class="titre">Géométrie mentale</p>
    <a href="${location.href}" target="_blank" rel="noopener">↗ Ouvrir l’appli</a>`;
  document.body.appendChild(voile);
}

/* ================= QR code de l'accueil =================
   Adresse de la page (sans paramètres), dessinée en SVG ; clic = plein écran pour la projection. */
function installerQr() {
  // déjà sur un téléphone (portrait ou paysage) : pas de QR code
  const telephone = (navigator.userAgentData && navigator.userAgentData.mobile) || /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent);
  if (telephone || !/^https?:$/.test(location.protocol) || typeof qrcode !== 'function') return;
  const qr = qrcode(0, 'M');
  qr.addData(location.origin + location.pathname);
  qr.make();
  const n = qr.getModuleCount(), m = 2;
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m},${y + m}h1v1h-1z`;
  const svg = `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code de l'appli"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  $('qrImg').innerHTML = svg; $('qrBig').innerHTML = svg;
  $('qrBox').classList.remove('hidden');
  $('qrBox').onclick = () => $('qrOv').classList.remove('hidden');
  $('qrOv').onclick = () => $('qrOv').classList.add('hidden');
}

installerQr();
goHome();
forcerNouvelOnglet();
</script>
